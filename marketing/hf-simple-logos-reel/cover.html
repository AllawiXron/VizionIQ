<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <title>allawi.psd · simple logos (reel cover)</title>
    <style>
@font-face { font-family:'DG Sahabah'; font-weight:400; src:url(assets/fonts/DG-Sahabah-Reg.ttf) format('truetype') }
/* the reel's red world and its real apple with the bite taken out, standing on the word; text kept inside the 3:4
   crop the profile grid shows (y 240 to 1680) */
* { margin:0; padding:0; box-sizing:border-box }
html, body { width:1080px; height:1920px; overflow:hidden; background:#7a0b17 }
#c { position:relative; width:1080px; height:1920px; overflow:hidden; direction:rtl; font-family:'DG Sahabah'; font-weight:400; font-synthesis:none; color:#f6ead8 }
.lt { position:absolute; border-radius:50%; filter:blur(120px) }
#paper { position:absolute; inset:0; background:url(assets/img/paper.jpg) center/cover; mix-blend-mode:multiply; opacity:.38 }
#line { position:absolute; top:300px; left:0; right:0; text-align:center; font-size:56px; line-height:1.2; white-space:nowrap; text-shadow:0 6px 18px rgba(0,0,0,.4) }
#word { position:absolute; top:330px; left:0; right:0; text-align:center; font-size:520px; line-height:1.3; color:#f3e4cc; text-shadow:0 20px 50px rgba(40,0,6,.45) }
#apple { position:absolute; left:205px; top:830px; width:660px; filter:drop-shadow(0 46px 40px rgba(20,0,4,.6)) drop-shadow(0 10px 10px rgba(20,0,4,.35)); transform:rotate(-4deg) }
#apple img { display:block; width:100%; -webkit-mask-image:radial-gradient(circle 132px at calc(100% + 56px) 46%, transparent 131px, #000 132px); mask-image:radial-gradient(circle 132px at calc(100% + 56px) 46%, transparent 131px, #000 132px) }
#dirt { position:absolute; inset:0; background:url(assets/img/paper.jpg) center/cover; mix-blend-mode:multiply; opacity:.5; filter:grayscale(1) brightness(1.9) contrast(1.6) }
#grain { position:absolute; inset:0; background:url(assets/img/grain.png) 0 0/420px; mix-blend-mode:overlay; opacity:.07 }
#vig { position:absolute; inset:0; box-shadow:inset 0 0 300px 80px rgba(20,0,4,.55) }
    </style>
  </head>
  <body>
    <div id="c">
      <i class="lt" style="left:100px; top:520px; width:900px; height:900px; background:rgba(214,40,58,.6)"></i>
      <i class="lt" style="left:380px; top:1380px; width:760px; height:640px; background:rgba(40,0,6,.7)"></i>
      <div id="paper"></div>
      <div id="line">التفصيلة اللي خلت هاي التفاحة ما تنسى</div>
      <div id="word">عضة</div>
      <div id="apple"><img src="assets/obj/apple-cover.png" /></div>
      <div id="dirt"></div>
      <div id="grain"></div>
      <div id="vig"></div>
    </div>
  </body>
</html>
