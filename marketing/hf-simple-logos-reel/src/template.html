<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>allawi.psd · simple logos (reel)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
@font-face { font-family:'DG Sahabah'; font-style:normal; font-weight:400; font-display:block; src:url(assets/fonts/DG-Sahabah-Reg.ttf) format('truetype') }
/* the reference's grammar in my colours: words out of a sideways blur, one hero object with a deep shadow and a slow
   push, things bursting in from the corners, whips with motion blur, hard cuts into the next colour world */
* { margin:0; padding:0; box-sizing:border-box }
html, body { width:1080px; height:1920px; overflow:hidden; background:#1c120d }
#root { position:relative; width:100%; height:100%; overflow:hidden; direction:rtl; font-family:'DG Sahabah'; font-weight:400; font-synthesis:none; color:#f6ead8 }
.sc { position:absolute; inset:0; overflow:hidden }
.world { position:absolute; inset:-60px }
.world::after { content:''; position:absolute; inset:0; background:url(assets/img/paper.jpg) center/cover; mix-blend-mode:multiply; opacity:.38 }
.lt { position:absolute; border-radius:50%; filter:blur(110px) }
.brown { background:#2a1a12 } .red { background:#7a0b17 } .paper { background:#e9dfcf } .green { background:#0d3526 }
.yellow { background:#e3a60c } .sgreen { background:#0b3d2e } .navy { background:#0f1c3d } .black { background:#0b0806 } .orange { background:#d4521c }
.black::after { opacity:.12 }
#fx { position:absolute; inset:0; pointer-events:none; z-index:50 }
#grain { position:absolute; inset:0; background:url(assets/img/grain.png) 0 0/420px; mix-blend-mode:overlay; opacity:.07 }
#vig { position:absolute; inset:0; box-shadow:inset 0 0 260px 60px rgba(0,0,0,.5) }

.cap { position:absolute; left:50px; right:50px; text-align:center; white-space:nowrap; z-index:20; text-shadow:0 6px 18px rgba(0,0,0,.45); line-height:1.2 }
.w { display:inline-block; opacity:0 }
.k { color:#f08a4b }
.inkt .cap { color:#1f1510; text-shadow:0 4px 14px rgba(255,240,220,.35) } .inkt .k { color:#b9461c }
.orange .cap, #sQ .cap { color:#2a1208; text-shadow:none } #sQ .k { color:#fbf0e0 }
.obj { position:absolute; z-index:10; transform-origin:50% 60% }
.obj img { display:block; width:100%; filter:drop-shadow(0 40px 36px rgba(0,0,0,.55)) drop-shadow(0 8px 8px rgba(0,0,0,.35)) }
.logo { position:absolute; z-index:12 }
.logo img { display:block; width:100%; filter:drop-shadow(0 24px 30px rgba(0,0,0,.45)) }
.wht img { filter:invert(1) drop-shadow(0 24px 30px rgba(0,0,0,.5)) }
.cream img { filter:brightness(0) invert(.94) drop-shadow(0 20px 24px rgba(0,0,0,.5)) }
.print { position:absolute; z-index:9; padding:12px; background:#efe7d8; box-shadow:0 26px 40px rgba(0,0,0,.5) }
.print > div { width:100%; height:100%; background-size:cover; background-position:center }
.disc { position:absolute; z-index:12; border-radius:50%; background:#f4efe4; box-shadow:0 22px 40px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center }
#sN .cap { color:#fff; mix-blend-mode:difference; text-shadow:none } #sN .k { color:#fff }
.dot { position:absolute; z-index:21; width:7px; height:7px; border-radius:50%; background:#1f1510; opacity:0 }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__D__" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="__D__" data-track-index="0" style="position:absolute; inset:0">

        <!-- A · the hook -->
        <div class="sc" id="sA">
          <div class="world brown"><i class="lt" style="left:160px; top:560px; width:900px; height:800px; background:rgba(214,140,80,.32)"></i></div>
          <div class="logo wht" id="lgApple" style="left:420px; top:960px; width:240px"><img src="assets/logos/apple.svg" /></div>
          <div class="logo" id="lgShell" style="left:130px; top:1080px; width:200px"><img src="assets/logos/shell.svg" /></div>
          <div class="logo cream" id="lgCroc" style="left:720px; top:1140px; width:250px"><img src="assets/logos/lacoste-croc.svg" /></div>
        </div>

        <!-- B · تفاحة، تمساح، صدفة، ثور, then the burst around the bull -->
        <div class="sc" id="sB">
          <div class="world brown"><i class="lt" style="left:100px; top:700px; width:960px; height:900px; background:rgba(214,140,80,.36)"></i></div>
          <div class="obj" id="oApple" style="left:270px; top:720px; width:540px"><img src="assets/obj/apple.png" /></div>
          <div class="obj" id="oCroc" style="left:120px; top:760px; width:900px"><img src="assets/obj/croc.png" /></div>
          <div class="obj" id="oShell" style="left:250px; top:760px; width:580px"><img src="assets/obj/shell.png" /></div>
          <div class="obj" id="oBull" style="left:200px; top:760px; width:680px"><img src="assets/obj/bull.png" /></div>
          <div class="obj" id="cApple" style="left:70px; top:640px; width:230px"><img src="assets/obj/apple.png" /></div>
          <div class="obj" id="cShell" style="left:780px; top:640px; width:230px"><img src="assets/obj/shell.png" /></div>
          <div class="obj" id="cCroc" style="left:40px; top:1330px; width:380px"><img src="assets/obj/croc.png" /></div>
          <div class="print" id="cPrint" style="left:640px; top:1300px; width:220px; height:320px; transform:rotate(6deg)"><div style="background-image:url(assets/obj/mermaid.jpg)"></div></div>
        </div>

        <!-- Dr · red: the logo drops in with its echoes -->
        <div class="sc" id="sDr">
          <div class="world red"><i class="lt" style="left:150px; top:500px; width:820px; height:820px; background:rgba(214,40,58,.6)"></i><i class="lt" style="left:400px; top:1300px; width:700px; height:600px; background:rgba(40,0,6,.7)"></i></div>
          <div class="drop" id="drop1" data-src="assets/logos/apple.svg" data-f="invert(1)" style="position:absolute; left:340px; top:880px; width:400px; z-index:12"></div>
        </div>

        <!-- E · paper: «محد يتذكره» falls apart -->
        <div class="sc inkt" id="sE">
          <div class="world paper"><i class="lt" style="left:200px; top:500px; width:800px; height:800px; background:rgba(255,250,240,.6)"></i></div>
          <div id="dots"></div>
        </div>

        <!-- F · a dark shape flies in: the secret -->
        <div class="sc" id="sF">
          <div class="world brown"><i class="lt" style="left:150px; top:700px; width:900px; height:800px; background:rgba(214,140,80,.3)"></i></div>
          <div class="obj" id="oSil" style="left:340px; top:860px; width:400px"><img src="assets/obj/apple.png" style="filter:brightness(0) drop-shadow(0 0 3px rgba(246,234,216,.55)) drop-shadow(0 40px 36px rgba(0,0,0,.6))" /></div>
        </div>

        <!-- G · green: the crocodile -->
        <div class="sc" id="sG">
          <div class="world green"><i class="lt" style="left:300px; top:600px; width:900px; height:700px; background:rgba(60,140,100,.45)"></i></div>
          <div class="obj" id="oCrocG" style="left:150px; top:640px; width:980px; transform:rotate(-3deg)"><img src="assets/obj/croc.png" /></div>
          <div class="logo cream" id="lgCrocG" style="left:80px; top:1270px; width:320px"><img src="assets/logos/lacoste-croc.svg" /></div>
        </div>

        <!-- H · yellow: the shell rises -->
        <div class="sc inkt" id="sH">
          <div class="world yellow"><i class="lt" style="left:200px; top:600px; width:800px; height:800px; background:rgba(255,214,90,.8)"></i></div>
          <div class="obj" id="oShellH" style="left:240px; top:700px; width:600px"><img src="assets/obj/shell.png" /></div>
          <div class="logo" id="lgShellH" style="left:80px; top:1320px; width:210px"><img src="assets/logos/shell.svg" /></div>
        </div>

        <!-- I · paper wall: the two logos as framed prints -->
        <div class="sc inkt" id="sI">
          <div class="world paper"></div>
          <div class="print" id="pCroc" style="left:120px; top:760px; width:400px; height:480px; transform:rotate(-4deg)"><div style="background:#fbf6ec url(assets/logos/lacoste-croc.svg) center/70% no-repeat"></div></div>
          <div class="print" id="pShell" style="left:560px; top:820px; width:400px; height:480px; transform:rotate(3deg)"><div style="background:#fbf6ec url(assets/logos/shell.svg) center/58% no-repeat"></div></div>
        </div>

        <!-- J · black: the first open loop -->
        <div class="sc" id="sJ"><div class="world black"></div></div>

        <!-- K · Starbucks green: the old woodcut in a frame -->
        <div class="sc" id="sK">
          <div class="world sgreen"><i class="lt" style="left:-100px; top:500px; width:800px; height:900px; background:rgba(40,120,90,.4)"></i></div>
          <div class="print" id="frameK" style="left:120px; top:650px; width:540px; height:820px; transform:rotate(-2deg); background:#efe7d8; border:22px solid #3b2412; box-shadow:0 30px 50px rgba(0,0,0,.6), inset 0 0 0 2px rgba(0,0,0,.3)"><div style="background-image:url(assets/obj/mermaid.jpg); filter:sepia(.15)"></div></div>
          <div class="disc" id="discK" style="left:560px; top:1150px; width:330px; height:330px"><img src="assets/logos/starbucks.svg" style="width:290px" /></div>
        </div>

        <!-- L · navy: two bronze bulls collide, the sun comes up between them -->
        <div class="sc" id="sL">
          <div class="world navy"><i class="lt" style="left:250px; top:600px; width:700px; height:700px; background:rgba(60,90,170,.45)"></i></div>
          <div id="sunL" style="position:absolute; z-index:8; left:390px; top:700px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle at 45% 40%, #ffd84a, #f2b705 60%, #d99400); box-shadow:0 0 90px rgba(255,200,40,.45)"></div>
          <div class="obj" id="bullL" style="left:50px; top:780px; width:500px"><img src="assets/obj/bull.png" style="transform:scaleX(-1)" /></div>
          <div class="obj" id="bullR" style="left:530px; top:780px; width:500px"><img src="assets/obj/bull.png" /></div>
          <div class="logo" id="lgRB" style="left:80px; top:1290px; width:300px"><img src="assets/logos/redbull.svg" /></div>
        </div>

        <!-- M · the compass drawing: the six logos pass, then two circles meet -->
        <div class="sc" id="sM">
          <div class="world paper" style="background:#efe6d6 url(assets/obj/circles.jpg) 40% 50%/cover"></div>
          <div id="conv" style="position:absolute; z-index:12; left:0; top:860px; height:260px; width:1080px"></div>
          <div id="cRed" style="position:absolute; z-index:10; left:110px; top:700px; width:520px; height:520px; border-radius:50%; background:#eb001b; mix-blend-mode:multiply; opacity:0"></div>
          <div id="cYel" style="position:absolute; z-index:10; left:450px; top:700px; width:520px; height:520px; border-radius:50%; background:#f79e1b; mix-blend-mode:multiply; opacity:0"></div>
        </div>

        <!-- N · black: the second open loop, then a logo so close you only see its edge -->
        <div class="sc" id="sN">
          <div class="world black"></div>
          <img id="giant" src="assets/logos/apple.svg" style="position:absolute; z-index:5; left:0; top:0; width:3600px; filter:invert(1); opacity:0; transform-origin:0 0" />
        </div>

        <!-- O · red: the real apple drops in, then the bite is taken out of it -->
        <div class="sc" id="sO">
          <div class="world red"><i class="lt" style="left:150px; top:500px; width:820px; height:820px; background:rgba(214,40,58,.6)"></i><i class="lt" style="left:400px; top:1300px; width:700px; height:600px; background:rgba(40,0,6,.7)"></i></div>
          <div class="drop" id="drop2" data-src="assets/obj/apple.png" data-f="drop-shadow(0 40px 36px rgba(0,0,0,.55))" style="position:absolute; left:280px; top:680px; width:520px; z-index:12"></div>
          <div class="logo wht" id="lgAppleO" style="left:620px; top:860px; width:300px"><img src="assets/logos/apple.svg" /></div>
        </div>

        <!-- P · paper: the six things, then each turns into its logo -->
        <div class="sc inkt" id="sP">
          <div class="world paper"><i class="lt" style="left:200px; top:600px; width:800px; height:800px; background:rgba(255,250,240,.6)"></i></div>
          <div id="six"></div>
        </div>

        <!-- Q · orange: the ask -->
        <div class="sc" id="sQ">
          <div class="world orange"><i class="lt" style="left:300px; top:-100px; width:900px; height:800px; background:rgba(255,150,80,.5)"></i><i class="lt" style="left:-300px; top:1200px; width:900px; height:700px; background:rgba(120,30,0,.45)"></i></div>
          <div class="cap" id="handle" style="top:1240px; font-size:92px; direction:ltr"><span class="w">@allawi.psd</span></div>
        </div>
      </div>
      <div id="fx"><div id="grain"></div><div id="vig"></div></div>
<!--AUDIO-->
    </div>
    <script>
window.REEL = /*REEL*/;
/*TIMELINE*/
    </script>
  </body>
</html>
