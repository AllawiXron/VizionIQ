<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شغف للحلويات</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --cream: #f1e3cc; --caramel: #d9a46a; --soft: #b8987c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #444; font-family: 'El Messiri', serif; color: var(--cream); }
  .f { position: relative; width: 1080px; height: 1920px; overflow: hidden; margin: 30px;
    background: url(art/table.jpg) 0 0 / 1080px 1920px; }
  /* window light from the top left over the cloth, falling off to the corners */
  .light { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 30% 30%, rgba(255,200,150,.10), transparent 70%),
                radial-gradient(55% 35% at 75% 75%, rgba(255,200,150,.06), transparent 70%),
                radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(10,4,2,.45)); }
  .obj { position: absolute; }
  .obj.round { filter: drop-shadow(2px 3px 2px rgba(8,3,1,.65)) drop-shadow(14px 22px 22px rgba(8,3,1,.45))
                       drop-shadow(26px 44px 60px rgba(8,3,1,.35)); }
  .obj.round img { display: block; width: 100%; }
  .obj.print img { display: block; width: 100%;
    box-shadow: 1px 2px 2px rgba(8,3,1,.6), 12px 20px 26px rgba(8,3,1,.42), 24px 40px 70px rgba(8,3,1,.3); }
  .txt { position: absolute; line-height: 1.15; }
  .txt .n { font-weight: 700; white-space: nowrap; }
  .txt .s { font-weight: 500; color: var(--soft); white-space: nowrap; margin-top: .25em; }
  .txt .p { font-weight: 700; color: var(--caramel); white-space: nowrap; direction: ltr; unicode-bidi: isolate; margin-top: .1em; }
  .txt .p small { font-size: .42em; font-weight: 500; color: var(--soft); margin-left: .3em; }
  .note { position: absolute; font-weight: 500; color: var(--soft); line-height: 1.4; font-size: 28px; }
  /* preview copies only */
  .mark { position: absolute; inset: 0; pointer-events: none; direction: ltr; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .5; }
</style>
</head>
<body>
<div id="frames"></div>
<script>
// o: [photo, kind, x, y, width, rotation, clip]; t: [edge x, y, align, name, sub, price, size]
// align is the side the text hangs from: 'right' ends at x (text to the left of a dish), 'left' starts at x
const STORIES = {
  'story-1': {
    note: [60, 210, 'left'],
    o: [
      ['basbousa', 'round', 430, 400, 760, -6, 'circle(48.6% at 50% 50.3%)'],
      ['honeycomb-mix', 'round', 50, 1100, 470, 4, 'ellipse(48% 44.3% at 50.4% 49.8%)'],
      ['honeycomb', 'round', 600, 1440, 460, 0, 'circle(48.6% at 50% 50%)'],
    ],
    t: [
      [420, 600, 'right', 'بسبوسة', 'البوكس', '8,000', 96],
      [575, 1200, 'left', 'خلية النحل الثلاثية', 'محشية بالصوصات', '8,000', 56],
      [555, 1620, 'right', 'خلية النحل سادة', '', '5,000', 56],
    ],
  },
  'story-2': {
    note: [60, 210, 'left'],
    o: [
      ['cinnabon', 'print', 440, 420, 590, -3],
      ['cake', 'print', 60, 1110, 440, 3],
      ['marble-cake', 'print', 600, 1420, 410, -2.5],
    ],
    t: [
      [405, 610, 'right', 'سينابون', 'البوكس 4 قطع', '6,000', 92],
      [560, 1250, 'left', 'كيكة', '', '8,000', 76],
      [565, 1640, 'right', 'كيكة الرخام', '', '10,000', 64],
    ],
  },
  'story-3': {
    note: [540, 1540, 'center'],
    head: true,
    o: [['cups', 'print', 200, 560, 680, -1.2]],
    // each name sits on the side of the photo where its cup is
    t: [
      [569, 478, 'center', 'تراميسو', '', '', 44],
      [182, 850, 'right', 'حلا<br>اللوتس', '', '', 40],
      [898, 910, 'left', 'حلا<br>الخشخش', '', '', 40],
      [541, 1365, 'center', 'حلا بالشوكولا الدارك', '', '', 44],
    ],
  },
};

function grain(seed) {
  return `<svg class="grain" viewBox="0 0 1080 1920"><filter id="g${seed}"><feTurbulence type="fractalNoise"
    baseFrequency="1.05" numOctaves="2" seed="${seed}"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1920" filter="url(#g${seed})" opacity=".35"/></svg>`;
}

function obj([img, kind, x, y, w, r, clip]) {
  return `<div class="obj ${kind}" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg)">
    <img src="art/photos/${img}.jpg" style="${clip ? `clip-path:${clip}` : ''}"></div>`;
}

function txt([x, y, align, n, s, p, size]) {
  const pos = align === 'right' ? `right:${1080 - x}px;text-align:right`
    : align === 'center' ? `left:${x - 300}px;width:600px;text-align:center` : `left:${x}px;text-align:left`;
  return `<div class="txt" style="${pos};top:${y}px;font-size:${size}px"><div class="n">${n}</div>
    ${s ? `<div class="s" style="font-size:${Math.max(28, size * .34)}px">${s}</div>` : ''}
    ${p ? `<div class="p" style="font-size:${size * .8}px">${p}</div>` : ''}</div>`;
}

function note([x, y, align]) {
  const pos = align === 'center' ? 'left:0;right:0;text-align:center' : `left:${x}px;text-align:left`;
  return `<div class="note" style="${pos};top:${y}px">التوصيل داخل الفلوجة<br>وللطلب راسلونا بالخاص</div>`;
}

const PREVIEW = location.search.includes('preview');

// preview mark: a large one in the middle, a few faint small ones behind, spaced loosely and not in a strict grid
const SMALL = [[-60, 120], [520, 40], [180, 520], [760, 430], [-120, 900], [470, 980], [880, 1180], [120, 1420],
  [640, 1500], [-40, 1880], [420, 1940], [900, 1760]];

function mark() {
  const small = SMALL.map(([x, y]) => `<text x="${x}" y="${y}">@allawi.psd</text>`).join('');
  return `<svg class="mark" viewBox="0 0 1080 1920">
    <g transform="rotate(-24 540 960)" fill="#fff" fill-opacity=".13" font-family="El Messiri" font-weight="700" font-size="40">${small}</g>
    <g font-family="El Messiri" font-weight="700" text-anchor="middle" fill="#fff">
      <text x="540" y="990" font-size="120" fill-opacity=".3">@allawi.psd</text>
      <text x="540" y="1060" font-size="40" fill-opacity=".55" style="direction:rtl;unicode-bidi:embed">نسخة للمعاينة، تصميم علاوي</text></g></svg>`;
}

let html = '';
Object.entries(STORIES).forEach(([id, st], k) => {
  html += `<div class="f" id="${id}"><div class="light"></div>
    ${st.o.map(obj).join('')}
    <img style="position:absolute;right:60px;top:165px;width:250px" src="art/logo-cream.png">
    ${st.head ? `<div class="txt" style="left:60px;top:200px;font-size:96px;text-align:left"><div class="n">علب الحلا</div>
      <div class="p" style="font-size:72px">3,000<small>للعلبة</small></div></div>` : ''}
    ${st.t.map(txt).join('')}
    ${note(st.note)}
    ${grain(k + 4)}${PREVIEW ? mark() : ''}</div>`;
});
document.getElementById('frames').innerHTML = html;
Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode())]).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
