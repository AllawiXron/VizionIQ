<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شغف للحلويات</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink: #5b3a28; --soft: #8c6a54; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #666; font-family: 'El Messiri', serif; color: var(--ink); }
  .f { position: relative; width: 1080px; height: 1920px; overflow: hidden; margin: 30px;
    background: url(art/cloth.jpg) 0 0 / 1080px 1920px; }
  .light { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(70% 45% at 85% 6%, rgba(255,250,240,.35), transparent 70%),
                radial-gradient(90% 60% at 5% 100%, rgba(70,40,20,.13), transparent 70%); }
  .logo { position: absolute; left: 50%; transform: translateX(-50%); }
  .tile { position: absolute; }
  .tile img { display: block; width: 100%;
    box-shadow: 0 1px 2px rgba(45,25,12,.35), 0 10px 26px rgba(45,25,12,.16); }
  .line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }
  .n { font-weight: 700; white-space: nowrap; }
  .p { font-weight: 700; white-space: nowrap; direction: ltr; }
  .s { font-weight: 500; color: var(--soft); margin-top: 2px; }
  .cups-head { position: absolute; display: flex; justify-content: space-between; align-items: baseline; }
  .cup { position: absolute; text-align: center; }
  .cup img { display: block; width: 100%; box-shadow: 0 1px 2px rgba(45,25,12,.35), 0 8px 20px rgba(45,25,12,.14); }
  .cup .n { white-space: normal; margin-top: 14px; line-height: 1.25; }
  .foot { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500; color: var(--soft); }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .45; }
</style>
</head>
<body>
<div id="frames"></div>
<script>
// two columns, 470 wide, 40 apart; the first item of a row sits on the right (Arabic order)
const COL = [560, 50], W = 470;
const STORIES = {
  'story-1': [
    ['basbousa', 'بسبوسة', 'البوكس', '8,000'],
    ['honeycomb-mix', 'خلية النحل الثلاثية', 'محشية بالصوصات', '8,000'],
    ['honeycomb', 'خلية النحل سادة', '', '5,000'],
    ['cinnabon', 'سينابون', 'البوكس 4 قطع', '6,000'],
  ],
  'story-2': [
    ['cake', 'كيكة', '', '8,000'],
    ['marble-cake', 'كيكة الرخام', '', '10,000'],
  ],
};
const CUPS = [['cup-tiramisu', 'تراميسو'], ['cup-lotus', 'حلا اللوتس'], ['cup-khashkhash', 'حلا الخشخش'],
  ['cup-chocolate', 'حلا بالشوكولا الدارك']];
const TOP = 440, ROW = 640;

function grain(seed) {
  return `<svg class="grain" viewBox="0 0 1080 1920"><filter id="g${seed}"><feTurbulence type="fractalNoise"
    baseFrequency="1.1" numOctaves="2" seed="${seed}"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .55 -.18"/></filter>
    <rect width="1080" height="1920" filter="url(#g${seed})"/></svg>`;
}

function tile([img, n, s, p], i) {
  const x = COL[i % 2], y = TOP + Math.floor(i / 2) * ROW;
  return `<div class="tile" style="left:${x}px;top:${y}px;width:${W}px">
    <img src="art/photos/${img}.jpg">
    <div class="line"><span class="n" style="font-size:${n.length > 14 ? 38 : 44}px">${n}</span><span class="p" style="font-size:44px">${p}</span></div>
    ${s ? `<div class="s" style="font-size:26px">${s}</div>` : ''}</div>`;
}

function cups(y) {
  const w = 230, gap = 20;
  return `<div class="cups-head" style="left:50px;width:980px;top:${y}px">
      <span class="n" style="font-size:44px">علب الحلا</span>
      <span class="s" style="font-size:28px">العلبة <span class="p" style="font-size:44px;color:var(--ink)">3,000</span></span></div>
    ${CUPS.map(([img, n], i) => `<div class="cup" style="right:${50 + i * (w + gap)}px;top:${y + 100}px;width:${w}px">
      <img src="art/photos/${img}.jpg"><div class="n" style="font-size:30px">${n}</div></div>`).join('')}`;
}

let html = '';
Object.entries(STORIES).forEach(([id, items], k) => {
  html += `<div class="f" id="${id}"><div class="light"></div>
    <img class="logo" src="art/logo.png" style="top:170px;width:270px">
    ${items.map(tile).join('')}
    ${id === 'story-2' ? cups(TOP + ROW + 10) : ''}
    <div class="foot" style="top:1735px;font-size:30px">التوصيل داخل الفلوجة، وللطلب راسلونا بالخاص</div>
    ${grain(k + 4)}</div>`;
});
document.getElementById('frames').innerHTML = html;
Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode())]).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
