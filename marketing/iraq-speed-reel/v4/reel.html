<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سرعة الإنترنت في العراق</title>
<style>
  @font-face { font-family: Rubik; src: url(../../iraq-internet-map/site/fonts/Rubik-Arabic-500.woff2) format('woff2'); font-weight: 500; unicode-range: U+0600-06FF, U+200C-200F, U+FE70-FEFF; }
  @font-face { font-family: Rubik; src: url(../../iraq-internet-map/site/fonts/Rubik-Arabic-700.woff2) format('woff2'); font-weight: 700; unicode-range: U+0600-06FF, U+200C-200F, U+FE70-FEFF; }
  @font-face { font-family: Rubik; src: url(../../iraq-internet-map/site/fonts/Rubik-Arabic-800.woff2) format('woff2'); font-weight: 800; unicode-range: U+0600-06FF, U+200C-200F, U+FE70-FEFF; }
  @font-face { font-family: Rubik; src: url(../../iraq-internet-map/site/fonts/Rubik-Latin-400.woff2) format('woff2'); font-weight: 400 500; unicode-range: U+0000-00FF; }
  @font-face { font-family: Rubik; src: url(../../iraq-internet-map/site/fonts/Rubik-Latin-700.woff2) format('woff2'); font-weight: 700 800; unicode-range: U+0000-00FF; }
  html, body { margin: 0; background: #f7f8fa; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; direction: ltr; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="fg" width="1080" height="1920"></canvas>
</div>
<script src="../data.js"></script>
<script type="module">
// The 37 s reel for everything the site does now, one stop per idea on one long page the camera moves down, over a
// light data grid: the shock, the line test on the phone, the share card, ping for gamers, home or mobile, two areas
// before renting, the ministry's view with the zoom into the green, the name. Every style is a function of time.
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const W = 1080, H = 1920, FPS = 60, DUR = 37;
window.DUR = DUR;

const BG = '#f7f8fa', INK = '#14202b', INK2 = '#46525e', SOFT = '#6c7783', WHITE = '#ffffff';
const RED = '#d2483f', ORANGE = '#ea8a2e', AMBER = '#e3b021', LEAF = '#5aa85e', GREEN = '#12795a';
const bgc = document.getElementById('bg'), bgx = bgc.getContext('2d', { willReadFrequently: true });
const fgc = document.getElementById('fg'), fgx = fgc.getContext('2d', { willReadFrequently: true });
const glc = document.getElementById('gl');
let ctx = bgx;
const D = window.DATA;

// ---------- time ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, t0, d) => clamp((t - t0) / d);
const expo = x => x <= 0 ? 0 : x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10));
const expoIn = x => x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x) - 1) / 1023;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (6 * x - 15) + 10);
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - (1 + 9 * x) * Math.exp(-9 * x);      // settles without overshoot
const wobble = (x, k = 7, w = 11) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-k * x) * Math.cos(w * x);   // overshoots once, then settles
const lerp = (a, b, k) => a + (b - a) * k;
const AR = n => String(Math.round(n)).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const bandFill = v => v < 10 ? RED : v < 25 ? ORANGE : v < 50 ? AMBER : v < 100 ? LEAF : GREEN;
const bandText = v => v < 10 ? '#b3362e' : v < 25 ? '#a8561a' : v < 50 ? '#866608' : v < 100 ? '#2f7d45' : '#10664c';
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const rand = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- the camera: one long page, one stop per idea ----------
const STOPS = [[0, 0], [2.85, 1920], [10.85, 3840], [16.85, 5760], [21.85, 7680], [25.85, 9600]];
function camY(t) {
  let y = 0;
  for (const [t0, to] of STOPS) if (t >= t0) y = to - (to - y) * (1 - smooth(seg(t, t0, 0.65)));
  return y;
}

// ---------- type, with a light motion blur that follows the move (copies averaged on their own layer) ----------
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d', { willReadFrequently: true });
function text(str, x, y, o = {}) {
  const a = o.alpha == null ? 1 : o.alpha;
  if (a <= 0.003 || !str) return;
  const vx = o.vx || 0, vy = o.vy || 0, sm = Math.hypot(vx, vy) * 0.5;
  const n = Math.max(1, Math.min(24, Math.round(sm / 1.5)));
  const g = n === 1 && !o.blur ? ctx : lctx;
  if (g === lctx) { lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, W, H); lctx.globalCompositeOperation = n > 1 ? 'lighter' : 'source-over'; }
  g.save();
  if (o.clip) { g.beginPath(); g.rect(...o.clip); g.clip(); }
  g.font = `${o.weight || 800} ${o.size}px Rubik`;
  g.textAlign = o.align || 'right'; g.direction = o.dir || 'rtl'; g.textBaseline = 'alphabetic';
  g.fillStyle = o.color || INK;
  g.globalAlpha = n === 1 ? (g === lctx ? 1 : a) : (g === lctx && o.blur ? 1 : a) / n;
  for (let i = 0; i < n; i++) {
    const k = n === 1 ? 0 : i / (n - 1) - 0.5;
    g.save(); g.translate(x - vx * 0.5 * k, y - vy * 0.5 * k);
    if (o.s != null) g.scale(o.s, o.s);
    g.fillText(str, 0, 0); g.restore();
  }
  g.restore();
  if (g === lctx) {
    lctx.globalCompositeOperation = 'source-over';
    const w = tw(str, o.size, o.weight || 800) * (o.s || 1), al = o.align || 'right';
    const x0 = al === 'right' ? x - w : al === 'center' ? x - w / 2 : x, pad = (o.blur || 0) * 3 + Math.abs(vx) + Math.abs(vy) + o.size * 0.3;
    const r = [Math.floor(x0 - pad), Math.floor(y - o.size * 1.1 * (o.s || 1) - pad), Math.ceil(w + 2 * pad), Math.ceil(o.size * 1.5 * (o.s || 1) + 2 * pad)];
    r[2] = Math.min(r[2], W - Math.max(0, r[0])); r[3] = Math.min(r[3], H - Math.max(0, r[1])); r[0] = Math.max(0, r[0]); r[1] = Math.max(0, r[1]);
    if (r[2] > 0 && r[3] > 0) { ctx.save(); ctx.globalAlpha = o.blur ? a : 1; if (o.blur) ctx.filter = `blur(${o.blur}px)`; ctx.drawImage(layer, r[0], r[1], r[2], r[3], r[0], r[1], r[2], r[3]); ctx.restore(); }
  }
}
const tw = (str, size, weight = 800) => { bgx.font = `${weight} ${size}px Rubik`; bgx.direction = 'rtl'; return bgx.measureText(str).width; };
function rrect(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, Math.abs(h) / 2, Math.abs(w) / 2)); g.beginPath(); g.roundRect(x, y, w, h, r); }
const vel = (f, t) => { const a = f(t), b = f(t - 1 / FPS); return [a[0] - b[0], a[1] - b[1]]; };

function layoutWords(str, size, maxW, x, y, lh, weight = 800, slot = null) {
  const words = str.split(' '), sp = tw(' ', size, weight), lines = [[]];
  let w = 0;
  for (const wd of words) {
    const ww = slot && slot(wd) || tw(wd, size, weight);
    if (lines[lines.length - 1].length && w + sp + ww > maxW) { lines.push([]); w = 0; }
    lines[lines.length - 1].push({ wd, ww }); w += (w ? sp : 0) + ww;
  }
  const out = [];
  lines.forEach((ln, li) => { let xr = x; ln.forEach(o => { out.push({ wd: o.wd, x: xr, y: y + li * lh, ww: o.ww }); xr -= o.ww + sp; }); });
  return out;
}
function sentence(t, laid, t0, step, size, o = {}) {
  laid.forEach((w, i) => {
    const e = spring(seg(t, t0 + i * step, 0.42));
    if (e <= 0) return;
    const f = tt => [w.x, w.y + o.dy + (1 - spring(seg(tt, t0 + i * step, 0.42))) * 46];
    const p = f(t), v = vel(f, t), cv = o.cam || [0, 0];
    text(w.wd, p[0], p[1], { size, weight: o.weight, color: o.color, alpha: e * (o.alpha == null ? 1 : o.alpha), blur: (1 - e) * 16, vx: v[0] + cv[0], vy: v[1] + cv[1] });
  });
}

// ---------- the room: off-white, a light from the middle, and the data grid moving at a third of the camera ----------
function background(cy, rt) {
  bgx.setTransform(1, 0, 0, 1, 0, 0); bgx.globalAlpha = 1; bgx.filter = 'none';
  bgx.fillStyle = BG; bgx.fillRect(0, 0, W, H);
  const g = bgx.createRadialGradient(560, 880, 30, 540, 960, 1180);
  g.addColorStop(0, 'rgba(255,255,255,0.96)'); g.addColorStop(0.5, 'rgba(255,255,255,0.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
  const C = 72, oy = -((cy / 3 + rt * 5) % C), ox = 36 - ((rt * 2) % C);
  bgx.fillStyle = 'rgba(20,32,43,0.04)';
  for (let x = ox; x < W; x += C) bgx.fillRect(Math.round(x), 0, 1, H);
  for (let y = oy; y < H; y += C) bgx.fillRect(0, Math.round(y), W, 1);
  // a small mark on every fourth crossing, like the corners of the tiles the speeds are measured on
  bgx.fillStyle = 'rgba(20,32,43,0.05)';
  const i0 = Math.round((cy / 3 + rt * 5 + oy) / C);
  for (let y = oy, j = 0; y < H; y += C, j++) for (let x = ox, i = 0; x < W; x += C, i++) {
    if ((i + j + i0) % 4) continue;
    bgx.fillRect(Math.round(x) - 5, Math.round(y), 11, 1); bgx.fillRect(Math.round(x), Math.round(y) - 5, 1, 11);
  }
}

// ---------- the phone, in 3D, with the real site on its screen ----------
const IMG = {};
const NAMES = ['home', 'result', 'share', 'home-full', 'bar', 'tabs', 'ping-0', 'ping-done', ...Array.from({ length: 14 }, (_, i) => 'test-' + String(i).padStart(2, '0')), ...Array.from({ length: 10 }, (_, i) => 'ping-' + String(i + 1).padStart(2, '0'))];
const MARKS = {};
const SW = 600, SH = Math.round(600 * 844 / 390), K1 = SW / 390, SC = 3;   // the captures are 3x a 390 px phone
const scr = document.createElement('canvas'); scr.width = 390 * SC; scr.height = 844 * SC;
const sg = scr.getContext('2d', { willReadFrequently: true });
const renderer = new THREE.WebGLRenderer({ canvas: glc, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x000000, 0);
const world = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
world.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-900, 1400, 1600); world.add(key);
const FOV = 30, DIST = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
const cam = new THREE.PerspectiveCamera(FOV, W / H, 50, 30000); cam.position.set(0, 0, DIST); cam.lookAt(0, 0, 0);

function rrShape(w, h, r) {
  const s = new THREE.Shape(), x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2;
  s.moveTo(x0 + r, y0); s.lineTo(x1 - r, y0); s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x1, y1 - r); s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
  s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x0, y0 + r); s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
const BEZ = 14, BV = 9, OW = SW + 2 * (BEZ + BV), OH = SH + 2 * (BEZ + BV), OR = 80;
const phoneG = new THREE.Group(); world.add(phoneG);
const metal = new THREE.MeshPhysicalMaterial({ color: 0x3b414a, metalness: 0.92, roughness: 0.3 });
const bodyGeo = new THREE.ExtrudeGeometry(rrShape(OW - 2 * BV, OH - 2 * BV, OR - BV), { depth: 34, bevelEnabled: true, bevelThickness: BV, bevelSize: BV, bevelSegments: 6, curveSegments: 40 });
bodyGeo.computeBoundingBox(); bodyGeo.translate(0, 0, -bodyGeo.boundingBox.max.z);
phoneG.add(new THREE.Mesh(bodyGeo, metal));
const glass = new THREE.Mesh(new THREE.ShapeGeometry(rrShape(OW - 2 * BV, OH - 2 * BV, OR - BV), 40),
  new THREE.MeshPhysicalMaterial({ color: 0x050608, metalness: 0, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.06 }));
glass.position.z = 0.6; phoneG.add(glass);
[[OW / 2 + 1.5, 300, 150], [-OW / 2 - 1.5, 330, 90], [-OW / 2 - 1.5, 200, 90]].forEach(([x, y, h]) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(5, h, 14), metal); b.position.set(x, y, -26); phoneG.add(b);
});
const scrGeo = new THREE.ShapeGeometry(rrShape(SW, SH, 58), 40);
const uv = scrGeo.attributes.uv, pos = scrGeo.attributes.position;
for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + SW / 2) / SW, (pos.getY(i) + SH / 2) / SH);
const scrTex = new THREE.CanvasTexture(scr);
scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const screenMesh = new THREE.Mesh(scrGeo, new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false }));
screenMesh.position.z = 1.2; phoneG.add(screenMesh);

// place the phone so the screen point (u, v) in CSS px lands on the frame at (sx, sy), magnified m times
const DEG = Math.PI / 180;
function placePhone(u, v, m, sx, sy, rx, ry, rz) {
  phoneG.rotation.set(rx * DEG, ry * DEG, rz * DEG);
  const p = new THREE.Vector3((u - 195) * K1, (422 - v) * K1, 1.2).applyEuler(phoneG.rotation);
  const Z = DIST * (1 - 1 / m);
  phoneG.position.set((sx - 540) * (DIST - Z) / DIST - p.x, (960 - sy) * (DIST - Z) / DIST - p.y, Z - p.z);
  phoneG.updateMatrixWorld(true);
}
const toFrame = (x, y, z) => { const v = new THREE.Vector3(x, y, z).applyMatrix4(phoneG.matrixWorld).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const OUTLINE = (() => { const pts = rrShape(OW, OH, OR).getPoints(24); return pts.map(p => [p.x, p.y]); })();
const screenPt = (u, v) => toFrame((u - 195) * K1, (422 - v) * K1, 1.2);

// three shadows: tight at the edge, one cast away from the light (top left), one wide and soft under everything
const shc = document.createElement('canvas'); shc.width = W / 2; shc.height = H / 2;
const shx = shc.getContext('2d', { willReadFrequently: true });
function phoneShadow(m, fade, alpha = 1) {
  const pts = OUTLINE.map(([x, y]) => toFrame(x, y, -30));
  const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cyy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  shx.setTransform(0.5, 0, 0, 0.5, 0, 0); shx.clearRect(0, 0, W, H);
  const lay = (dx, dy, blur, a2, grow) => {
    shx.save(); shx.filter = `blur(${blur / 2}px)`; shx.globalAlpha = a2 * alpha; shx.fillStyle = '#1a2430';
    shx.beginPath(); pts.forEach(([x, y], i) => { const X = cx + (x - cx) * grow + dx, Y = cyy + (y - cyy) * grow + dy; i ? shx.lineTo(X, Y) : shx.moveTo(X, Y); });
    shx.closePath(); shx.fill(); shx.restore();
  };
  const s = Math.max(0.6, m);
  lay(5 * s, 9 * s, 8 * s, 0.34, 0.995);
  lay(38 * s, 66 * s, 34 * s, 0.22, 1.0);
  lay(12 * s, 90 * s, 110 * s, 0.15, 1.07);
  if (fade) {
    shx.save(); shx.setTransform(0.5, 0, 0, 0.5, 0, 0); shx.globalCompositeOperation = 'destination-in';
    const g = shx.createLinearGradient(0, fade[0], 0, fade[1]); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
    shx.fillStyle = g; shx.fillRect(0, 0, W, H); shx.restore();
  }
  bgx.save(); bgx.setTransform(1, 0, 0, 1, 0, 0); bgx.drawImage(shc, 0, 0, W, H); bgx.restore();
}

// the screen: a capture (a tall one scrolls under the fixed header and tabs), a finger's touch, and the badge that
// says the result is a sample test
function badge(g, s) {
  const txt = 'نموذج فحص'; g.save(); g.font = `700 ${13 * s}px Rubik`; g.direction = 'rtl';
  const w = g.measureText(txt).width + 20 * s, x = 14 * s, y = 64 * s, h = 26 * s;
  g.fillStyle = 'rgba(20,32,43,0.86)'; g.beginPath(); g.roundRect(x, y, w, h, 7 * s); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, x + w / 2, y + h / 2 + 1 * s); g.restore();
}
let scrKey = '';
function drawScreen(st) {
  const k = JSON.stringify(st); if (k === scrKey) return; scrKey = k;
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.globalAlpha = 1;
  sg.fillStyle = WHITE; sg.fillRect(0, 0, scr.width, scr.height);
  const im = IMG[st.img];
  if (st.S != null) { sg.drawImage(im, 0, st.S * SC, scr.width, scr.height, 0, 0, scr.width, scr.height); sg.drawImage(IMG.bar, 0, 0); sg.drawImage(IMG.tabs, 0, scr.height - IMG.tabs.height); }
  else sg.drawImage(im, 0, 0, scr.width, scr.height);
  if (st.tap) {
    const [cx, cy, k2] = st.tap, x = cx * SC, y = cy * SC;
    sg.fillStyle = `rgba(255,255,255,${0.45 * (1 - smooth(seg(k2, 0.35, 0.65)))})`;
    sg.beginPath(); sg.arc(x, y, (19 + 5 * spring(k2 * 3)) * SC, 0, 7); sg.fill();
    const r = seg(k2, 0.15, 0.85);
    if (r > 0) { sg.strokeStyle = `rgba(255,255,255,${0.5 * (1 - r)})`; sg.lineWidth = 2.5 * SC; sg.beginPath(); sg.arc(x, y, (24 + 46 * expo(r)) * SC, 0, 7); sg.stroke(); }
  }
  if (st.pulse && st.pulse !== 1) {
    const [x, y, w, h] = MARKS.go.map(v => v * SC), cx = x + w / 2, cy = y + h / 2;
    sg.save(); sg.translate(cx, cy); sg.scale(st.pulse, st.pulse); sg.translate(-cx, -cy);
    sg.drawImage(im, x, y, w, h, x, y, w, h); sg.restore();
  }
  if (st.tapGo != null) {
    const [x, y, w, h] = MARKS.go.map(v => v * SC), cx = x + w * 0.68, cy = y + h / 2, k2 = st.tapGo;
    sg.fillStyle = `rgba(255,255,255,${0.42 * (1 - smooth(seg(k2, 0.3, 0.7)))})`;
    sg.beginPath(); sg.arc(cx, cy, (17 + 4 * spring(k2 * 3)) * SC, 0, 7); sg.fill();
    const r = seg(k2, 0.12, 0.88);
    if (r > 0) { sg.strokeStyle = `rgba(255,255,255,${0.5 * (1 - r)})`; sg.lineWidth = 2.5 * SC; sg.beginPath(); sg.arc(cx, cy, (22 + 40 * expo(r)) * SC, 0, 7); sg.stroke(); }
  }
  if (st.badge) badge(sg, SC);
  scrTex.needsUpdate = true;
}

let mask = '';
function setMask(s) { if (s === mask) return; mask = s; glc.style.webkitMaskImage = s; glc.style.maskImage = s; }
let glShown = null, glAlpha = 1, glA = null;
function renderPhone(on, fgUsed) {
  if (on !== glShown) { glShown = on; glc.style.display = on ? 'block' : 'none'; }
  if (glAlpha !== glA) { glA = glAlpha; glc.style.opacity = String(glAlpha); }
  fgc.style.display = fgUsed ? 'block' : 'none';
  if (on) renderer.render(world, cam);
}
// ---------- shared parts ----------
function keyAt(K, t) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) { const k = smooth(seg(t, K[i][0], K[i + 1][0] - K[i][0])); return K[i].slice(1).map((a, j) => lerp(a, K[i + 1][j + 1], k)); }
  return K[K.length - 1].slice(1);
}
// keyframes given by the top edge of the screen: the frame y of point v follows from the top and the magnification
const atTop = (t, u, v, m, top, rx, ry, rz = 0, sx = 540) => [t, u, v, m, sx, top + v * K1 * m, rx, ry, rz];
// captions at the top of a stop push each other up and out of a fixed window
function captions(t, list, oy, cv, o = {}) {
  const size = o.size || 76, lh = size * 1.26, y0 = oy + (o.y || 312), color = o.color || INK;
  list.forEach(([t0, str], i) => {
    const e = spring(seg(t, t0, 0.45)), next = list[i + 1] ? spring(seg(t, list[i + 1][0], 0.45)) : 0;
    if (e <= 0 || next >= 1) return;
    const slotW = o.count ? Math.max(tw(o.count[0], size), 130) + 16 : 0;
    const lines = layoutWords(str, size, o.maxW || 900, 960, 0, lh, 800, o.count ? wd => wd === o.count[0] ? slotW : 0 : null);

    govPath(byId.diyala, oy); ctx.save(); ctx.globalAlpha = focus * lerp(0.6, 1, pu); ctx.lineWidth = lerp(3.5, 6.5, pu) / Math.sqrt(z); ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
  }
  const sw = seg(t, 26.35, 0.9);
  if (sw > 0 && sw < 1) {
    ctx.save(); ctx.beginPath(); govs.forEach(g => { for (const p of g.polys) { p.forEach(([x, y], i) => i ? ctx.lineTo(GX + x * GZ, oy + GY + y * GZ) : ctx.moveTo(GX + x * GZ, oy + GY + y * GZ)); ctx.closePath(); } }); ctx.clip();
    const by = oy + GY - 120 + (GM.h * GZ + 240) * sw, gr = ctx.createLinearGradient(0, by - 100, 0, by + 100);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, by - 100, W, 200); ctx.restore();
  }
  // the key, in the empty corner by the Saudi border
  KEYS.forEach(([w, col], i) => {
    const e = spring(seg(t, 26.9 + 0.05 * i, 0.35)) * clear; if (e <= 0) return;
    const y = oy + GY + 320 * GZ + i * 40, xr = GX + 120;
    ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = col; rrect(ctx, xr - 32, y - 18, 32, 12, 2); ctx.fill(); ctx.restore();
    text(w, xr - 44, y, { size: 28, weight: 700, color: INK2, alpha: e });
  });
  // Diyala's card over Anbar, with its leader
  const ce = seg(t, 27.75, 0.75);
  if (ce > 0 && clear > 0) {
    const s = 0.4 + 0.6 * wobble(ce, 7, 12), al = clamp(ce * 4) * clear, x = 84, y = oy + 830, w = 430, h = 300;
    const ax = GX + byId.diyala.x * GZ, ay = oy + GY + byId.diyala.y * GZ, lk = smooth(seg(t, 27.9, 0.35));
    ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + w, y + 150); ctx.lineTo(lerp(x + w, ax, lk), lerp(y + 150, ay, lk)); ctx.stroke();
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(ax, ay, 9 * lk, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s); ctx.translate(-(x + w / 2), -(y + h / 2));
    softCard(ctx, x, y, w, h, 24, al);
    text('ديالى', x + w - 34, y + 74, { size: 50, weight: 800, alpha: al });
    text(AR(DIY) + '٪', x + w - 34, y + 192, { size: 120, weight: 800, color: '#a8561a', alpha: al });
    const lines = layoutWords('من مناطقها تعاني من بطء الإنترنت', 30, w - 68, x + w - 34, 0, 38, 500);
    lines.forEach(l => text(l.wd, l.x, y + 238 + l.y, { size: 30, weight: 500, color: INK2, alpha: al }));
    ctx.restore();
  }
  ctx.restore();
  const cover = smooth(seg(t, 29.8, 0.15));
  if (cover > 0) { ctx.save(); ctx.globalAlpha = cover; ctx.fillStyle = FIELD; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
const LINE_Y = 666;
function scene7(t, rt) {
  if (t < 29.9 || t > 33.3) return;
  const fold = smooth(seg(t, 32.75, 0.38));
  const x = lerp(0, 120, fold), y = lerp(0, LINE_Y - 4, fold), w = lerp(W, 840, fold), h = lerp(H, 8, fold);
  ctx.fillStyle = FIELD; rrect(ctx, x, y, w, h, lerp(0, 4, fold)); ctx.fill();
  if (fold > 0.7) return;
  ctx.save(); rrect(ctx, x, y, w, h, 0); ctx.clip();
  captions(t, [[29.95, 'رغم قفزة العراق من ١٧ إلى ٦٢ ميغابت.. العدالة الرقمية بين المناطق هي الخطوة الجاية']], 0, [0, 0], { size: 62, y: 290, color: WHITE });
  const yrs = D.years, BW = 76, GAP = 30, X0 = 960, BOT = 1500, HMAX = 470;
  const STEP_AT = [30.35, 30.6, 30.72, 30.84, 30.96, 31.08, 31.2, 31.4];
  let step = -1; STEP_AT.forEach((s, i) => { if (t >= s) step = i; });
  const tops = [];
  yrs.forEach((v, i) => {
    const e = wobble(seg(t, 30.3 + 0.05 * i, 0.9), 6, 11); if (e <= 0) return;
    const bh = HMAX * v / yrs[yrs.length - 1] * e, bx = X0 - (i + 1) * BW - i * GAP;
    tops.push([bx + BW / 2, BOT - HMAX * v / yrs[yrs.length - 1] - 36]);
    ctx.save(); ctx.globalAlpha = i <= step ? 1 : 0.38; ctx.fillStyle = WHITE; rrect(ctx, bx, BOT - bh, BW, bh, 4); ctx.fill(); ctx.restore();
    text(AR(2019 + i), bx + BW / 2, BOT + 48, { size: 30, weight: 500, color: WHITE, align: 'center', alpha: 0.85 * clamp(e) });
  });
  const L = smooth(seg(t, 31.4, 0.6));
  if (L > 0 && tops.length === yrs.length) {
    let tot = 0; tops.slice(1).forEach((p, i) => { tot += Math.hypot(p[0] - tops[i][0], p[1] - tops[i][1]); });
    ctx.save(); ctx.strokeStyle = WHITE; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.setLineDash([tot * L, tot + 10]); ctx.beginPath(); tops.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.stroke(); ctx.restore();
    if (L >= 1) { const [px, py] = tops[tops.length - 1]; ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(px, py, 14, 0, 7); ctx.fill(); ctx.fillStyle = FIELD; ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.fill();
      const f = ((rt - 32.0) / 0.9) % 1; if (rt > 32) { ctx.save(); ctx.strokeStyle = WHITE; ctx.lineWidth = 3; ctx.globalAlpha = 0.7 * (1 - f); ctx.beginPath(); ctx.arc(px, py, 16 + 28 * expo(f), 0, 7); ctx.stroke(); ctx.restore(); } }
  }
  if (step >= 0) {
    const v = yrs[step], e = spring(seg(t, 30.35, 0.35)), pop = step === yrs.length - 1 ? 1 + 0.05 * (1 - spring(seg(t, 31.4, 0.35))) : 1;
    text(AR(v), 960, 790 + (1 - e) * 40, { size: 230, color: WHITE, alpha: e, s: pop, blur: (1 - e) * 10 });
    text(`ميغابت بصيف ${AR(2019 + step)}`, 960, 880, { size: 52, weight: 700, color: WHITE, alpha: e });
  }
  ctx.restore();
}

// ---------- 8. the end: the platform's name, the phone behind, its search box pulsing ----------
const END = [
  atTop(33.3, 195, 422, 0.78, 1750, -14, -24),
  atTop(34.1, 195, 422, 0.78, 1010, -10, -18),
  atTop(37.0, 195, 422, 0.78, 996, -7, -11),
];
function scene8(t, rt) {
  if (t < 32.9) return;
  const name = ['منصة سرعة الإنترنت', 'في العراق'], size = Math.min(124, 860 / (tw(name[0], 100) / 100));
  [[name[0], 33.0, 470], [name[1], 33.08, 470 + size * 1.2]].forEach(([s, t0, yb]) => {
    const f = tt => [960, yb + (1 - spring(seg(tt, t0, 0.42))) * 170];
    const p = f(t), v = vel(f, t);
    text(s, p[0], p[1], { size, vx: v[0], vy: v[1], alpha: spring(seg(t, t0, 0.3)), clip: [0, 0, W, LINE_Y - 4] });
  });
  const lines = layoutWords('افحص خطك وقارن منطقتك مجانا الآن — الرابط بالبايو', 48, 860, 960, 0, 62, 500);
  lines.forEach((l, i) => {
    const t0 = 33.3 + i * 0.06, f2 = tt => [l.x, 760 + l.y - (1 - spring(seg(tt, t0, 0.42))) * 80];
    const p2 = f2(t), v2 = vel(f2, t);
    text(l.wd, p2[0], p2[1], { size: 48, weight: 500, color: INK2, vx: v2[0], vy: v2[1], alpha: spring(seg(t, t0, 0.3)), clip: [0, LINE_Y + 12, W, H] });
  });
  const cr = spring(seg(t, 33.7, 0.45)), cy0 = 760 + Math.max(...lines.map(l => l.y)) + 84;
  text('تطوير وتصميم', 960, cy0, { size: 40, weight: 500, color: SOFT, alpha: cr });
  text('@allawi.psd', 960 - tw('تطوير وتصميم ', 40, 500), cy0, { size: 40, weight: 500, color: SOFT, alpha: cr, dir: 'ltr', align: 'right' });
  ctx.fillStyle = INK; ctx.globalAlpha = expo(seg(t, 33.1, 0.3)); rrect(ctx, 120, LINE_Y - 4, 840, 8, 4); ctx.fill(); ctx.globalAlpha = 1;
  if (t < 33.3) return;
  // the start button inside the phone grows a little and settles, again and again, with a finger's tap now and then
  const ph = Math.max(0, (rt - 34.3) / 1.1), pk = ph % 1, n = Math.floor(ph);
  const pulse = ph > 0 ? Math.round((1 + 0.06 * Math.sin(Math.PI * clamp(pk / 0.55))) * 200) / 200 : 1;
  const tap = ph > 0 && n % 2 === 0 ? Math.round(clamp(pk / 0.7) * 30) / 30 : null;
  showPhone(END, t, 0, { img: 'home-full', S: 0, pulse, tapGo: tap }, false);
}

// ---------- seek ----------
window.seek = function (rtIn) {
  const rt = clamp(rtIn, 0, DUR - 1e-6), t = rt;
  ctx = bgx; phoneOn = false; cardG.visible = false; glAlpha = 1;
  background(camY(t), rt);
  fgx.setTransform(1, 0, 0, 1, 0, 0); fgx.clearRect(0, 0, W, H);
  const cy = camY(t), cv = [0, -(camY(t) - camY(t - 1 / FPS))];
  scene1(t, cy, cv, rt); scene2(t, cy, cv, rt); scene3(t, cy, cv, rt); scene4(t, cy, cv, rt); scene5(t, cy, cv, rt); scene6(t, cy, cv, rt);
  scene7(t, rt);
  scene8(t, rt);
  renderPhone(phoneOn || cardG.visible, true);
};
const SITE = '../../iraq-internet-map/site/data/';

  fetch('site/marks.json').then(r => r.json()).then(m => Object.assign(MARKS, m)),
