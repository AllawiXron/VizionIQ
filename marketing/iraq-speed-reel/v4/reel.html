<script type="module">
// The 37 s reel for everything the site does now, shot by one camera over a big world: each line of the script stands
// alone in the middle of its own frame, then the camera whips or pulls back to what it is about (the shock, the line
// test on the phone, the share card, ping for gamers, home or mobile, two areas before renting, the ministry's view
// with the zoom into the green, the name). The camera never stops: every hold creeps in. Every style is a function of time.
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const W = 1080, H = 1920, FPS = 60, DUR = 37;
window.DUR = DUR;

const BG = '#f7f8fa', INK = '#14202b', INK2 = '#46525e', SOFT = '#6c7783', WHITE = '#ffffff';
const RED = '#d2483f', ORANGE = '#ea8a2e', AMBER = '#e3b021', LEAF = '#5aa85e', GREEN = '#12795a';
const bgc = document.getElementById('bg'), bgx = bgc.getContext('2d', { willReadFrequently: true });
const fgc = document.getElementById('fg'), fgx = fgc.getContext('2d', { willReadFrequently: true });
const glc = document.getElementById('gl');
const tpc = document.getElementById('top'), tpx = tpc.getContext('2d');
let ctx = bgx;
const D = window.DATA;

// ---------- time ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, t0, d) => clamp((t - t0) / d);
const expo = x => x <= 0 ? 0 : x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10));
const expoIn = x => x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x) - 1) / 1023;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (6 * x - 15) + 10);
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - (1 + 9 * x) * Math.exp(-9 * x);      // settles without overshoot
const wobble = (x, k = 7, w = 11) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-k * x) * Math.cos(w * x);   // overshoots once, then settles
const lerp = (a, b, k) => a + (b - a) * k;
// cubic-bezier(0.85, 0, 0.15, 1): a slow start, a very fast middle, a long soft landing
const bez = (() => { const x1 = 0.85, y1 = 0, x2 = 0.15, y2 = 1;
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = u => ((ax * u + bx) * u + cx) * u, Y = u => ((ay * u + by) * u + cy) * u, dX = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let u = x; for (let i = 0; i < 8; i++) { const d = dX(u); if (Math.abs(d) < 1e-6) break; u -= (X(u) - x) / d; u = Math.min(1, Math.max(0, u)); } return Y(u); };
})();
const AR = n => String(Math.round(n)).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const bandFill = v => v < 10 ? RED : v < 25 ? ORANGE : v < 50 ? AMBER : v < 100 ? LEAF : GREEN;
const bandText = v => v < 10 ? '#b3362e' : v < 25 ? '#a8561a' : v < 50 ? '#866608' : v < 100 ? '#2f7d45' : '#10664c';
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const rand = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- the camera: a 2D rig over one big world; the 3D phone and card are put under it in 3D ----------
// keys: [time, focus x, focus y, zoom, roll in degrees, how it goes to the next key]: 'B' a move on the bezier,
// 'L' a slow creep (a hold is never a still frame), 'Z' a zoom into a point (expo in) that grows from where it sits on
// screen into the middle. Two keys at the same time are a cut.
let CAMK = [];
const cam2 = { fx: 540, fy: 960, s: 1, r: 0 };
function camAt(t) {
  const K = CAMK; let i = 0;
  while (i < K.length - 1 && t >= K[i + 1][0]) i++;
  const A = K[i], B = K[i + 1];
  if (!B || t <= A[0]) return { fx: A[1], fy: A[2], s: A[3], r: A[4] };
  const x = (t - A[0]) / (B[0] - A[0]), e = A[5];
  if (e === 'Z') {
    const s = A[3] + (B[3] - A[3]) * expoIn(x), r = A[4] * Math.PI / 180, c = Math.cos(r), n = Math.sin(r), dx = B[1] - A[1], dy = B[2] - A[2];
    const q = 1 - smooth(x), qx = A[3] * (c * dx - n * dy) * q, qy = A[3] * (n * dx + c * dy) * q;
    return { fx: B[1] - (c * qx + n * qy) / s, fy: B[2] - (-n * qx + c * qy) / s, s, r: A[4] };
  }
  const k = e === 'B' ? bez(x) : x;
  return { fx: lerp(A[1], B[1], k), fy: lerp(A[2], B[2], k), s: lerp(A[3], B[3], k), r: lerp(A[4], B[4], k) };
}
// hits: the frame shakes and dies down; a punch is a sudden small push in that settles
const SHAKES = [[2.2, 6, 0.25, 0.3], [6.4, 11, 0.5, 0.35], [13.17, 30, 1.4, 0.75], [19.6, 7, 0.3, 0.3]];
const PUNCH = [[6.4, 0.04], [13.17, 0.07]];
function shake(t) {
  let dx = 0, dy = 0, dr = 0, p = 1;
  for (const [t0, a, ra, d] of SHAKES) {
    const x = (t - t0) / d; if (x < 0 || x > 1) continue;
    const k = (1 - x) * (1 - x), u = t - t0;
    dx += a * k * Math.sin(u * 71 + t0); dy += a * k * Math.sin(u * 89 + 2 * t0 + 1); dr += ra * k * Math.sin(u * 61 + 3);
  }
  // while the ping stays high the frame keeps a small tremor
  const tr = clamp((t - 13.17) / 0.2) * (1 - smooth(seg(t, 14.6, 0.4)));
  if (tr > 0) { dx += 2.5 * tr * Math.sin(t * 97); dy += 2.5 * tr * Math.sin(t * 113 + 1); }
  for (const [t0, a] of PUNCH) if (t >= t0) p *= 1 + a * Math.exp(-(t - t0) * 10);
  return { dx, dy, dr, p };
}
let VM = [1, 0, 0, 1, 0, 0], VS = 1, VR = 0;
function setView(v) {
  const r = v.r * Math.PI / 180, a = v.s * Math.cos(r), b = v.s * Math.sin(r);
  VS = v.s; VR = v.r; VM = [a, b, -b, a, 540 + v.dx - (a * v.fx - b * v.fy), 960 + v.dy - (b * v.fx + a * v.fy)];
}
const vpt = (x, y) => [VM[0] * x + VM[2] * y + VM[4], VM[1] * x + VM[3] * y + VM[5]];

// ---------- type, with a light motion blur that follows the move (copies averaged on their own layer) ----------
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d', { willReadFrequently: true });
function text(str, x, y, o = {}) {
  const a = o.alpha == null ? 1 : o.alpha;
  if (a <= 0.003 || !str) return;
  const vx = 0, vy = 0, n = 1;
  o.blur = 0;
  const g = n === 1 && !o.blur ? ctx : lctx;
  if (g === lctx) { lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, W, H); lctx.globalCompositeOperation = n > 1 ? 'lighter' : 'source-over'; }
  g.save();
  if (o.clip) { g.beginPath(); g.rect(...o.clip); g.clip(); }

  g.textAlign = o.align || 'right'; g.direction = o.dir || 'rtl'; g.textBaseline = 'alphabetic';
  g.fillStyle = o.color || INK;
  g.globalAlpha = n === 1 ? (g === lctx ? 1 : a) : (g === lctx && o.blur ? 1 : a) / n;
  for (let i = 0; i < n; i++) {
    const k = n === 1 ? 0 : i / (n - 1) - 0.5;
    g.save(); g.translate(x - vx * 0.5 * k, y - vy * 0.5 * k);
    if (o.s != null) g.scale(o.s, o.s);
    g.fillText(str, 0, 0); g.restore();
  }
  g.restore();
  if (g === lctx) {
    lctx.globalCompositeOperation = 'source-over';
    const w = tw(str, o.size, o.weight || 800) * (o.s || 1), al = o.align || 'right';
    const x0 = al === 'right' ? x - w : al === 'center' ? x - w / 2 : x, pad = (o.blur || 0) * 3 + Math.abs(vx) + Math.abs(vy) + o.size * 0.3;
    const r = [Math.floor(x0 - pad), Math.floor(y - o.size * 1.1 * (o.s || 1) - pad), Math.ceil(w + 2 * pad), Math.ceil(o.size * 1.5 * (o.s || 1) + 2 * pad)];
    r[2] = Math.min(r[2], W - Math.max(0, r[0])); r[3] = Math.min(r[3], H - Math.max(0, r[1])); r[0] = Math.max(0, r[0]); r[1] = Math.max(0, r[1]);
    if (r[2] > 0 && r[3] > 0) { ctx.save(); ctx.globalAlpha = o.blur ? a : 1; if (o.blur) ctx.filter = `blur(${o.blur}px)`; ctx.drawImage(layer, r[0], r[1], r[2], r[3], r[0], r[1], r[2], r[3]); ctx.restore(); }
  }
}
const tw = (str, size, weight = 800) => { bgx.font = `${weight} ${size}px Rubik, RubikL`; bgx.direction = 'rtl'; return bgx.measureText(str).width; };
function rrect(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, Math.abs(h) / 2, Math.abs(w) / 2)); g.beginPath(); g.roundRect(x, y, w, h, r); }
const vel = (f, t) => { const a = f(t), b = f(t - 1 / FPS); return [a[0] - b[0], a[1] - b[1]]; };

function layoutWords(str, size, maxW, x, y, lh, weight = 800, slot = null) {
  const words = str.split(' '), sp = tw(' ', size, weight), lines = [[]];
  let w = 0;
  for (const wd of words) {
    const ww = slot && slot(wd) || tw(wd, size, weight);
    if (lines[lines.length - 1].length && w + sp + ww > maxW) { lines.push([]); w = 0; }
    lines[lines.length - 1].push({ wd, ww }); w += (w ? sp : 0) + ww;
  }
  const out = [];
  lines.forEach((ln, li) => { let xr = x; ln.forEach(o => { out.push({ wd: o.wd, x: xr, y: y + li * lh, ww: o.ww }); xr -= o.ww + sp; }); });
  return out;
}
// lines of type rise through a mask of their own, one after another, sharp all the way
const groupLines = laid => { const m = new Map(); laid.forEach(w => { if (!m.has(w.y)) m.set(w.y, []); m.get(w.y).push(w); }); return [...m.values()]; };
function maskLine(words, y, size, k, draw) {
  const box = size * 1.5, off = (1 - k) * box * 1.15;
  if (k <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 1.08, W, box); ctx.clip();
  words.forEach(w => draw(w, off)); ctx.restore();
}
function sentence(t, laid, t0, step, size, o = {}) {
  groupLines(laid).forEach((ws, li) => {
    const k = bez(seg(t, t0 + li * 0.06, 0.55)), y = ws[0].y + o.dy;
    maskLine(ws, y, size, k, (w, off) => text(w.wd, w.x, y + off, { size, weight: o.weight, color: o.color, alpha: o.alpha == null ? 1 : o.alpha }));
  });
}

// ---------- the studio: a warm backdrop, a spotlight a little above the middle, the floor falling off, two soft
// shadows drifting at the sides as if from things just out of shot, and a vignette; the grain sits over everything
function background(cy, rt) {
  bgx.setTransform(1, 0, 0, 1, 0, 0); bgx.globalAlpha = 1; bgx.filter = 'none';
  bgx.fillStyle = '#f5f4f0'; bgx.fillRect(0, 0, W, H);
  let g = bgx.createRadialGradient(480, 700, 40, 540, 820, 1250);
  g.addColorStop(0, 'rgba(255,254,250,0.95)'); g.addColorStop(0.45, 'rgba(255,253,248,0.45)'); g.addColorStop(1, 'rgba(255,253,248,0)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
  g = bgx.createLinearGradient(0, 1150, 0, H); g.addColorStop(0, 'rgba(72,60,46,0)'); g.addColorStop(1, 'rgba(72,60,46,0.075)');
  bgx.fillStyle = g; bgx.fillRect(0, 1150, W, H - 1150);
  const blob = (x, y, rx, ry, a) => { bgx.save(); bgx.translate(x, y); bgx.scale(1, ry / rx); const r = bgx.createRadialGradient(0, 0, 0, 0, 0, rx);
    r.addColorStop(0, `rgba(58,46,34,${a})`); r.addColorStop(1, 'rgba(58,46,34,0)'); bgx.fillStyle = r; bgx.fillRect(-rx, -rx, 2 * rx, 2 * rx); bgx.restore(); };
  blob(-60 + 26 * Math.sin(rt * 0.23), 1380 + 40 * Math.sin(rt * 0.17), 520, 300, 0.06);
  blob(1150 + 22 * Math.sin(rt * 0.19 + 1), 420 + 36 * Math.sin(rt * 0.13 + 2), 460, 260, 0.045);
  g = bgx.createRadialGradient(540, 900, 620, 540, 960, 1300); g.addColorStop(0, 'rgba(40,32,24,0)'); g.addColorStop(1, 'rgba(40,32,24,0.11)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
}
// film grain, 2.5 %: four fixed tiles of noise, changed twelve times a second, laid over the whole frame
const GRAIN = Array.from({ length: 4 }, (_, k) => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = 128 + (rand(i * 7.31 + k * 1013) - 0.5) * 2 * 40; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
function grain(rt) {
  const tile = GRAIN[Math.floor(rt * 12) % 4];
  fgx.save(); fgx.globalAlpha = 0.16; fgx.fillStyle = fgx.createPattern(tile, 'repeat'); fgx.fillRect(0, 0, W, H); fgx.restore();
}

// ---------- the phone, in 3D, with the real site on its screen ----------
const IMG = {};
const NAMES = ['home', 'result', 'share', 'home-full', 'bar', 'tabs', 'ping-0', 'ping-done', ...Array.from({ length: 14 }, (_, i) => 'test-' + String(i).padStart(2, '0')), ...Array.from({ length: 10 }, (_, i) => 'ping-' + String(i + 1).padStart(2, '0'))];
const MARKS = {};
const SW = 600, SH = Math.round(600 * 844 / 390), K1 = SW / 390, SC = 3;   // the captures are 3x a 390 px phone
const scr = document.createElement('canvas'); scr.width = 390 * SC; scr.height = 844 * SC;
const sg = scr.getContext('2d', { willReadFrequently: true });
const renderer = new THREE.WebGLRenderer({ canvas: glc, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x000000, 0);
const world = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
world.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-900, 1400, 1600); world.add(key);
const FOV = 30, DIST = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
const cam = new THREE.PerspectiveCamera(FOV, W / H, 50, 30000); cam.position.set(0, 0, DIST); cam.lookAt(0, 0, 0);

function rrShape(w, h, r) {
  const s = new THREE.Shape(), x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2;

  s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);

  return s;
}
const BEZ = 14, BV = 9, OW = SW + 2 * (BEZ + BV), OH = SH + 2 * (BEZ + BV), OR = 80;
const phoneG = new THREE.Group(); world.add(phoneG);
const metal = new THREE.MeshPhysicalMaterial({ color: 0x3b414a, metalness: 0.92, roughness: 0.3 });
const bodyGeo = new THREE.ExtrudeGeometry(rrShape(OW - 2 * BV, OH - 2 * BV, OR - BV), { depth: 34, bevelEnabled: true, bevelThickness: BV, bevelSize: BV, bevelSegments: 6, curveSegments: 40 });
bodyGeo.computeBoundingBox(); bodyGeo.translate(0, 0, -bodyGeo.boundingBox.max.z);
phoneG.add(new THREE.Mesh(bodyGeo, metal));
const glass = new THREE.Mesh(new THREE.ShapeGeometry(rrShape(OW - 2 * BV, OH - 2 * BV, OR - BV), 40),
  new THREE.MeshPhysicalMaterial({ color: 0x050608, metalness: 0, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.06 }));
glass.position.z = 0.6; phoneG.add(glass);
[[OW / 2 + 1.5, 300, 150], [-OW / 2 - 1.5, 330, 90], [-OW / 2 - 1.5, 200, 90]].forEach(([x, y, h]) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(5, h, 14), metal); b.position.set(x, y, -26); phoneG.add(b);
});
const scrGeo = new THREE.ShapeGeometry(rrShape(SW, SH, 58), 40);
const uv = scrGeo.attributes.uv, pos = scrGeo.attributes.position;
for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + SW / 2) / SW, (pos.getY(i) + SH / 2) / SH);
const scrTex = new THREE.CanvasTexture(scr);
scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const screenMesh = new THREE.Mesh(scrGeo, new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false }));
screenMesh.position.z = 1.2; phoneG.add(screenMesh);
// a soft diagonal sheen on the glass that slides a little as the phone turns
const sheenC = document.createElement('canvas'); sheenC.width = 256; sheenC.height = 512;
{ const g = sheenC.getContext('2d'), lg = g.createLinearGradient(0, 0, 256, 512);
  lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.34, 'rgba(255,255,255,0)'); lg.addColorStop(0.42, 'rgba(255,255,255,0.11)');
  lg.addColorStop(0.47, 'rgba(255,255,255,0.03)'); lg.addColorStop(0.53, 'rgba(255,255,255,0.07)'); lg.addColorStop(0.6, 'rgba(255,255,255,0)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = lg; g.fillRect(0, 0, 256, 512); }
const sheenTex = new THREE.CanvasTexture(sheenC); sheenTex.wrapS = THREE.RepeatWrapping;
const sheen = new THREE.Mesh(scrGeo, new THREE.MeshBasicMaterial({ map: sheenTex, transparent: true, depthWrite: false, toneMapped: false }));
sheen.position.z = 1.8; phoneG.add(sheen);

// place the phone so the screen point (u, v) in CSS px lands on the frame at (sx, sy), magnified m times; the roll is
// the camera's, turned about the view after the phone's own turn
const DEG = Math.PI / 180, QZ = new THREE.Quaternion(), ZAX = new THREE.Vector3(0, 0, 1);
function placePhone(u, v, m, sx, sy, rx, ry, rz, roll = 0) {
  phoneG.rotation.set(rx * DEG, ry * DEG, rz * DEG);
  if (roll) phoneG.quaternion.premultiply(QZ.setFromAxisAngle(ZAX, -roll * DEG));
  sheenTex.offset.x = -ry * 0.014;
  const p = new THREE.Vector3((u - 195) * K1, (422 - v) * K1, 1.2).applyQuaternion(phoneG.quaternion);
  const Z = DIST * (1 - 1 / m);

const toFrame = (x, y, z) => { const v = new THREE.Vector3(x, y, z).applyMatrix4(phoneG.matrixWorld).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };

const screenPt = (u, v) => toFrame((u - 195) * K1, (422 - v) * K1, 1.2);

window.seek = function (rtIn) {
  const rt = clamp(rtIn, 0, DUR - 1e-6), t = rt;

  renderPhone(phoneOn || cardG.visible);
};
const SITE = '../../iraq-internet-map/site/data/';
let SAQ, KAR, MAN, PG = {}, DIY;
window.ready = Promise.all([
  ...['500', '700', '800'].map(w => document.fonts.load(`${w} 80px Rubik, RubikL`, 'العراق ٨٧ گ')),
  ...['500', '700', '800'].map(w => document.fonts.load(`${w} 56px Rubik, RubikL`, '@allawi.psd ms 4G')),
  ...[['400 500', 'Rubik-Latin-400'], ['700 800', 'Rubik-Latin-700']].map(([w, f]) => new FontFace('RubikL', `url(../../iraq-internet-map/site/fonts/${f}.woff2)`, { weight: w }).load().then(ff => document.fonts.add(ff))),
  ...NAMES.map(n => new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = rej; im.src = `site/${n}.png`; })),
  fetch('site/marks.json').then(r => r.json()).then(m => Object.assign(MARKS, m)),
  fetch(SITE + 'places.json').then(r => r.json()).then(d => {
    const by = id => d.places.find(p => p.id === id);
    KAR = by('r2964648'); MAN = by('n12044401997'); SAQ = by('pnode/2486318357');
    const ok = d.places.filter(p => p.g === 'diyala' && p.f && p.f.t >= 30);
    DIY = Math.round(ok.filter(p => p.f.d < 25).length / ok.length * 100);
  }),
  fetch(SITE + 'govs.json').then(r => r.json()).then(d => { d.govs.forEach(g => { PG[g.id] = g.f.l; }); }),
]).then(() => {
  // the share picture, with the same small badge as the test screens
  const g = cardCanvas.getContext('2d'); g.drawImage(IMG.share, 0, 0, 1080, 1920); badge(g, 3.0 * 0.92);
  cardTex.needsUpdate = true;
  buildCam(); setMask('none');
  window.seek(0); return true;
});
