<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>allawi.psd — جمعة مباركة</title>
<style>
@font-face { font-family:'DG Sahabah'; font-weight:400; font-display:block; src:url(assets/fonts/DG-Sahabah-Reg.ttf) format('truetype') }
/* the @allawi.psd look (his highlights): the brown desk under the paper texture, a torn cream strip, light grain */
:root { --ink:#1f1510; --cream:#fbf3e6; --oink:#c2441a; --orange:#e2541b }
* { margin:0; padding:0; box-sizing:border-box }
body { background:#111; font-synthesis:none }
#post { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; font-family:'DG Sahabah'; font-weight:400;
  background:radial-gradient(110% 80% at 50% 45%, #33241b, var(--ink) 62%, #140d09) }
#post::before { content:''; position:absolute; inset:0; background:url(assets/paper.jpg) center/cover; mix-blend-mode:screen; opacity:.1 }
#grain { position:absolute; inset:0; background:url(assets/grain.png) repeat; background-size:420px; mix-blend-mode:overlay; opacity:.07; z-index:20 }
#vig { position:absolute; inset:0; background:radial-gradient(100% 75% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); z-index:19 }
.strip { position:absolute; left:0; right:0; display:flex; justify-content:center; z-index:8 }
.strip > span { position:relative; display:inline-block; color:var(--ink); white-space:nowrap; background:var(--cream) 0 0 / 100% 100% no-repeat;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.45)) }
.strip .k { color:var(--oink) }
.strip img { position:absolute; pointer-events:none }
#tea { position:absolute; left:40px; top:535px; width:1040px; z-index:5 }
#pencil { position:absolute; left:-200px; top:1170px; width:760px; transform:rotate(-20deg); z-index:4 }
#steam { position:absolute; left:0; top:0; z-index:6; overflow:visible; filter:blur(7px) }
#steam path { fill:none; stroke:#fff; stroke-linecap:round; stroke-width:16 }
.ktag { position:absolute; width:370px; height:150px; z-index:7; filter:drop-shadow(0 12px 14px rgba(0,0,0,.45)) }
.ktag .tg { position:absolute; inset:0; background:var(--cream); clip-path:polygon(0 50%, 17% 0, 100% 0, 100% 100%, 17% 100%) }
.ktag .hole { position:absolute; left:10%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; background:var(--orange) }
.ktag div { position:absolute; left:70px; right:14px; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
  font:400 46px/1 'DG Sahabah'; color:var(--ink); direction:ltr }
</style>
</head>
<body>
<div id="post">
  <div class="strip" style="top:120px; transform:rotate(-2deg)"><span style="padding:30px 70px 44px; font-size:150px; line-height:1.2">جمعة <span class="k">مباركة</span><img src="assets/pin-orange.png" alt="" style="right:10px; top:-14px; width:90px" /></span></div>
  <div class="strip" style="top:375px; transform:rotate(1.5deg)"><span style="padding:18px 48px 28px; font-size:60px; line-height:1.3">استريحوا اليوم.. والأفكار علينا<img src="assets/clip-silver.png" alt="" style="right:16px; top:-58px; width:60px; transform:rotate(-8deg)" /></span></div>
  <img id="pencil" src="assets/pencil.png" alt="" />
  <img id="tea" src="assets/tea.png" alt="" />
  <svg id="steam" width="1080" height="1350" viewBox="0 0 1080 1350">
    <path d="M500 600 C 478 570, 528 548, 505 515 S 520 470, 498 440" style="opacity:.18" />
    <path d="M532 604 C 560 575, 515 552, 545 522 S 530 480, 555 450" style="opacity:.13" />
    <path d="M516 610 C 503 590, 535 572, 517 548" style="opacity:.22" />
  </svg>
  <div class="ktag" style="right:40px; bottom:60px; transform:rotate(6deg)"><i class="tg"></i><i class="hole"></i><div>@allawi.psd</div></div>
  <div id="vig"></div><div id="grain"></div>
</div>
<script src="tear.js"></script>
<script>
document.fonts.ready.then(() => {
  document.querySelectorAll('.strip > span').forEach((el, i) => window.tear(el, 211 + i * 37));
  Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => { document.body.dataset.ready = '1'; });
});
</script>
</body>
</html>
