<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Saj Al-Reef — لحم لو دجاج؟ ثنينهم.</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root { --gold: #cfad57; --black: #070707; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: #1c1c1c; font-family: "Alexandria", sans-serif; }
  /* Saj Al-Reef's own «قوزي مكس» photo, upscaled, extended and graded in photo/plate.py */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(0deg, rgba(7, 7, 7, 0.85) 0%, rgba(7, 7, 7, 0.4) 7%, rgba(7, 7, 7, 0) 14%); }
  .grain {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0.2; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* headline */
  .kick { position: absolute; z-index: 10; top: 70px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px; direction: rtl; color: var(--gold); font-weight: 600; font-size: 24px; letter-spacing: 0.02em; }
  .kick i { width: 56px; height: 2px; background: var(--gold); opacity: 0.7; }
  .q { position: absolute; z-index: 10; top: 112px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 800; font-size: 76px; line-height: 1.3; white-space: nowrap; }
  .a { position: absolute; z-index: 10; top: 196px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 900; font-size: 178px; line-height: 1.25; color: var(--gold); white-space: nowrap; letter-spacing: -0.01em; text-shadow: 0 18px 46px rgba(0, 0, 0, 0.55); }

  /* the offer, pinned onto the tray */
  .pin { position: absolute; z-index: 10; left: 36px; top: 560px; direction: rtl; }
  .card { display: flex; align-items: center; gap: 16px; background: #fff; color: #141414; border-radius: 22px; padding: 14px 18px 14px 18px; box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55); white-space: nowrap; }
  .card img { width: 62px; height: 62px; border-radius: 6px; flex: none; }
  .card .t small { display: block; font-weight: 600; font-size: 15px; color: #9a7a2b; line-height: 1.3; }
  .card .t b { display: block; font-weight: 800; font-size: 28px; line-height: 1.3; }
  .card .t span { display: block; font-weight: 500; font-size: 16px; color: #5c5c5c; line-height: 1.4; }
  .card .price { flex: none; background: var(--black); color: var(--gold); border-radius: 14px; padding: 9px 14px; text-align: center; line-height: 1.05; }
  .card .price b { display: block; font-weight: 900; font-size: 34px; }
  .card .price small { font-weight: 600; font-size: 13px; color: #e8dcc0; }
  .pin .tail { position: absolute; left: 404px; bottom: -12px; width: 26px; height: 26px; background: #fff; transform: rotate(45deg); border-radius: 4px; }
  .pin .dot { position: absolute; left: 408px; top: calc(100% + 30px); width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 8px rgba(207, 173, 87, 0.3), 0 0 0 18px rgba(207, 173, 87, 0.12); }

  /* footer */
  .foot { position: absolute; z-index: 10; left: 56px; right: 56px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
  .foot .brand { display: flex; align-items: center; gap: 20px; }
  .foot .brand img { height: 70px; width: 70px; display: block; }
  .foot .brand span { font-weight: 600; font-size: 20px; line-height: 1.5; color: rgba(255, 255, 255, 0.88); padding-right: 20px; border-right: 2px solid rgba(207, 173, 87, 0.55); }
  .foot .cta { background: var(--gold); color: var(--black); font-weight: 800; font-size: 22px; padding: 14px 28px; border-radius: 16px; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad [data-l="bg"], body.m-card .ad [data-l="card"], body.m-txt .ad [data-l="txt"],
  body.m-logo .ad [data-l="logo"] { visibility: visible; }
</style>
</head>
<body>
<section class="ad" id="ad">
  <img class="hero" data-l="bg" src="img/hero.png" alt="" />
  <div class="shade" data-l="bg"></div>
  <div class="grain" data-l="bg"></div>

  <div class="kick" data-l="txt"><i></i>غدا الجمعة<i></i></div>
  <div class="q" data-l="txt">لحم لو دجاج؟</div>
  <div class="a" data-l="txt">ثنينهم.</div>

  <div class="pin" data-l="card">
    <div class="card">
      <img src="img/logo.png" alt="" />
      <div class="t"><small>عرض لفترة محدودة</small><b>قوزي مكس</b><span>قوزي لحم، قوزي دجاج، مقبلات وسط، ٢ شنينة</span></div>
      <div class="price"><b>٣٧</b><small>ألف دينار</small></div>
    </div>
    <i class="tail"></i>
    <i class="dot"></i>
  </div>

  <div class="foot">
    <div class="brand"><img data-l="logo" src="img/logo.png" alt="Saj Alreef" /><span data-l="txt">الكرادة، شارع ٦٢<br>المنصور، شارع ١٤ رمضان</span></div>
    <div class="cta" data-l="txt">اطلب هسة</div>
  </div>
</section>
</body>
</html>
