<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Saj Al-Reef — هاي بصمة الصاج</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root { --gold: #cfad57; --black: #060606; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  /* the poster takes the structure of their logo: a striped gold square on top, a black bar underneath */
  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: var(--gold); font-family: "Alexandria", sans-serif; }
  .stripes { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; }
  .paper {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0.35; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.2  0 0 0 0.6 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }
  .bar { position: absolute; left: 0; right: 0; top: 900px; bottom: 0; z-index: 3; background: var(--black); }

  /* the saj: real photo, cut out; its grill marks run with the stripes */
  .saj { position: absolute; z-index: 5; left: 92px; top: 214px; width: 920px; transform: rotate(-4deg); filter: drop-shadow(0 34px 34px rgba(0, 0, 0, 0.55)) drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35)); }

  .q { position: absolute; z-index: 10; top: 958px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 800; font-size: 54px; line-height: 1.35; color: #fff; white-space: nowrap; }
  .a { position: absolute; z-index: 10; top: 1030px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 900; font-size: 96px; line-height: 1.3; color: var(--gold); white-space: nowrap; letter-spacing: -0.01em; }

  .foot { position: absolute; z-index: 10; left: 56px; right: 56px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
  .foot .brand { display: flex; align-items: center; gap: 20px; }
  .foot .brand img { height: 72px; width: 72px; display: block; }
  .foot .brand span { font-weight: 600; font-size: 20px; line-height: 1.5; color: rgba(255, 255, 255, 0.86); padding-right: 20px; border-right: 2px solid rgba(207, 173, 87, 0.5); }
  .foot .cta { background: var(--gold); color: var(--black); font-weight: 800; font-size: 22px; padding: 14px 28px; border-radius: 4px; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad [data-l="bg"], body.m-food .ad [data-l="food"], body.m-bar .ad [data-l="bar"],
  body.m-txt .ad [data-l="txt"], body.m-logo .ad [data-l="logo"] { visibility: visible; }
</style>
</head>
<body>
<section class="ad" id="ad">
  <svg class="stripes" data-l="bg" viewBox="0 0 1080 900" preserveAspectRatio="none"><g id="st" fill="#060606"></g></svg>
  <div class="paper" data-l="bg"></div>
  <div class="bar" data-l="bar"></div>

  <img class="saj" data-l="food" src="img/saj.png" alt="" />

  <div class="q" data-l="txt">هاي الخطوط مو ديزاين</div>
  <div class="a" data-l="txt">هاي بصمة الصاج.</div>

  <div class="foot">
    <div class="brand"><img data-l="logo" src="img/logo.png" alt="Saj Alreef" /><span data-l="txt">الكرادة، شارع ٦٢<br>المنصور، شارع ١٤ رمضان</span></div>
    <div class="cta" data-l="txt">اطلب هسة</div>
  </div>
</section>

<script>
  // brush stripes like the ones in their logo: thick, slightly wavy diagonals, running top-left to bottom-right
  (function () {
    const g = document.getElementById('st');
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const ANG = 52 * Math.PI / 180;            // angle of the stripes against the horizontal
    const dx = Math.cos(ANG), dy = Math.sin(ANG), nx = -dy, ny = dx;
    const SPACING = 118, W = 62, LEN = 1500;
    let html = '';
    for (let k = -8; k <= 14; k++) {
      const cx = 540 + nx * k * SPACING, cy = 450 + ny * k * SPACING;
      const pts = [];
      const steps = 16;
      for (let i = 0; i <= steps; i++) {
        const t = -LEN / 2 + LEN * i / steps;
        const wob = Math.sin(i * 0.9 + k) * 7 + (rnd() - 0.5) * 6;
        pts.push([cx + dx * t + nx * wob, cy + dy * t + ny * wob]);
      }
      const half = (i) => W / 2 * (0.82 + 0.3 * Math.sin(i * 0.7 + k * 1.3) + (rnd() - 0.5) * 0.12);
      const L = pts.map((p, i) => [p[0] + nx * half(i), p[1] + ny * half(i)]);
      const R = pts.map((p, i) => [p[0] - nx * half(i), p[1] - ny * half(i)]).reverse();
      const d = 'M' + L.concat(R).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
      html += `<path d="${d}" />`;
    }
    g.innerHTML = html;
  })();
</script>
</body>
</html>
