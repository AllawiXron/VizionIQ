<!doctype html>

    <style>
@font-face { font-family:'DG Sahabah'; font-style:normal; font-weight:400; font-display:block; src:url(assets/fonts/DG-Sahabah-Reg.ttf) format('truetype') }
/* my ad for the page: one colour world per line of the voice, my real posts as prints, my real reels on phones, my
   real profile; the motion is the reel standard (camera per shot, blur pulse on cuts, letters out of a blur, motion
   blur, 15 fps steps) */
* { margin:0; padding:0; box-sizing:border-box }
html, body { width:1080px; height:1920px; overflow:hidden; background:#1c120d }
#root { position:relative; width:100%; height:100%; overflow:hidden; direction:rtl; font-family:'DG Sahabah'; font-weight:400; font-synthesis:none; color:#f6ead8 }
#stage { filter:url(#mb) }
/* the stage runs 100 px past the frame so the motion blur never pulls in the empty page at the edges */
.sc { position:absolute; inset:100px }
.world { position:absolute; inset:-220px; transform-origin:50% 50% }
.world::after { content:''; position:absolute; inset:0; background:url(assets/img/paper.jpg) center/cover; mix-blend-mode:multiply; opacity:.38 }
.world .lt { margin:160px 0 0 160px }
.cam { position:absolute; inset:0; transform-origin:540px 960px }
.lt { position:absolute; border-radius:50%; filter:blur(120px) }
#dirt { position:absolute; inset:100px; z-index:40; pointer-events:none; background:url(assets/img/paper.jpg) center/cover; mix-blend-mode:multiply; opacity:.5; filter:grayscale(1) brightness(1.9) contrast(1.6) }
#fx { position:absolute; inset:0; pointer-events:none; z-index:50 }
#grain { position:absolute; inset:0; background:url(assets/img/grain.png) 0 0/420px; mix-blend-mode:overlay; opacity:.07 }
#vig { position:absolute; inset:0; box-shadow:inset 0 0 280px 70px rgba(0,0,0,.5) }

.cap { position:absolute; left:50px; right:50px; text-align:center; white-space:nowrap; z-index:20; text-shadow:0 6px 18px rgba(0,0,0,.45); line-height:1.2 }
.w { display:inline-block }
.l { opacity:0 }
.k { color:#f08a4b }
.inkt .cap { color:#1f1510; text-shadow:0 4px 14px rgba(255,240,220,.35) } .inkt .k { color:#b9461c }
.dk .cap { color:#2a1208; text-shadow:none } .dk .k { color:#fff6e8; text-shadow:0 3px 12px rgba(90,20,0,.55) }
.dim { color:#8c8a84 !important }
.print { position:absolute; z-index:10; padding:14px; background:#efe7d8; box-shadow:0 30px 50px rgba(0,0,0,.5) }
.print img { display:block; width:100%; height:100% }
.shot { position:absolute; z-index:10; overflow:hidden; border-radius:34px; box-shadow:0 40px 70px rgba(0,0,0,.55) }
.shot > img, .shot video { display:block; width:100%; height:100%; object-fit:cover; object-position:top }
.phone { border:12px solid #0b0b0b; border-radius:46px }
.sheet { position:absolute; z-index:9; background:#9a968e url(assets/img/paper.jpg) center/cover; background-blend-mode:multiply; filter:grayscale(1) brightness(.62); box-shadow:0 20px 40px rgba(0,0,0,.5) }
.tag { position:absolute; left:0; right:0; z-index:12; text-align:center; font-size:40px; color:#f6ead8; opacity:.85 }
.obj { position:absolute; z-index:10 }
.ph img { position:relative; z-index:2; filter:drop-shadow(0 40px 40px rgba(0,0,0,.55)) }
.ph .scr { position:absolute; z-index:1; left:9.03%; top:1.84%; width:88.04%; height:96.21%; object-fit:cover; -webkit-mask:url(assets/el/phone-screen.png) 0 0/100% 100% no-repeat; mask:url(assets/el/phone-screen.png) 0 0/100% 100% no-repeat }
.caps { position:absolute; inset:0; z-index:30; transform-origin:540px 960px }
.scrim { position:absolute; z-index:15; left:-200px; right:-200px; top:-200px; height:1100px; background:linear-gradient(rgba(10,6,4,.96), rgba(10,6,4,.92) 55%, rgba(10,6,4,0)) }
.obj img { display:block; width:100%; filter:drop-shadow(0 46px 40px rgba(0,0,0,.6)) drop-shadow(0 10px 10px rgba(0,0,0,.4)) }
    </style>

          <div id="bags"></div>

        <div class="sc" id="sN">
          <div class="world" style="background:#1d1612"><i class="lt" style="left:160px; top:600px; width:800px; height:900px; background:rgba(226,84,27,.28)"></i></div>
          <div class="obj" id="watcher" style="left:370px; top:400px; width:340px"><img src="assets/el/binoculars-man.png" /></div>
