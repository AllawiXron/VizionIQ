<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../ig-brand-posts/fonts/src.css" />
<link rel="stylesheet" href="../ig-food-brands/fonts/fonts.css" />
<!-- allawi.psd highlight cover for the «كاكتوس» case study (showcase.html #st1-#st6), 1080x1920, motif inside the ~700px centre circle.
     #a #b #c follow the three «الأسعار» options in ../ig-offer/covers.html, so it matches whichever one is on the profile.
     #preview pairs each with its «الأسعار» cover; it reads the PNGs, so render twice. -->
<style>
:root { --paper:#ece3d4; --ink:#1f1510; --orange:#e2541b; --orange-2:#f07a2e; --cream:#fbf3e6 }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#333; display:flex; flex-wrap:wrap; gap:40px; padding:40px; width:3500px; align-items:flex-start }
.art { flex:none; position:relative; width:1080px; height:1920px; overflow:hidden }
.c { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) }

/* A: the cactus selected like a Photoshop layer, on paper */
#a { background:var(--paper) }
#a .sel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:26px }
#a .sel > .ico { display:block; width:580px; height:757px; color:var(--ink) }
.frame { position:absolute; inset:0; border:5px solid var(--ink) }
.frame i { position:absolute; width:34px; height:34px; background:var(--cream); border:5px solid var(--ink) }
.frame .tl { left:-20px; top:-20px } .frame .tr { right:-20px; top:-20px } .frame .bl { left:-20px; bottom:-20px } .frame .br { right:-20px; bottom:-20px }
.frame .tm { left:calc(50% - 17px); top:-20px } .frame .bm { left:calc(50% - 17px); bottom:-20px } .frame .ml { left:-20px; top:calc(50% - 17px) } .frame .mr { right:-20px; top:calc(50% - 17px) }
#a .cursor { position:absolute; right:-80px; bottom:-96px; width:110px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)) }

/* B: a cream cactus sticker on orange */
#b { background:radial-gradient(circle at 50% 45%, var(--orange-2) 0%, var(--orange) 55%, #c4440f 100%) }
#b svg.st { width:640px; height:640px; filter:drop-shadow(0 30px 40px rgba(90,25,0,.35)) }

/* C: dark, orange ring, cream outline */
#c { background:var(--ink) }
#c .ring { width:820px; height:820px; border-radius:50%; border:30px solid var(--orange); display:flex; align-items:center; justify-content:center }
#c .ring svg { width:520px; height:520px; color:var(--cream) }

/* preview */
#preview { width:1300px; height:620px; background:#000; color:#f5f5f5; font-family:'Readex Pro'; direction:rtl; padding:60px 80px }
#preview h4 { font:500 26px 'IBM Plex Mono'; direction:ltr; text-align:left; color:#8a8a8a; margin-bottom:40px }
#preview .row { display:flex; justify-content:space-around }
#preview .pair { display:flex; gap:26px }
#preview .hl { text-align:center; font:400 26px 'Readex Pro' }
#preview .ci { width:170px; height:170px; border-radius:50%; padding:6px; border:3px solid #3a3a3a; margin-bottom:18px }
#preview .ci div { width:100%; height:100%; border-radius:50%; background-size:cover; background-position:center }
#preview .k { margin-top:26px; font:500 24px 'IBM Plex Mono'; color:#e2541b; direction:ltr; text-align:center }
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5 6.3-.3z" fill="#1f1510" stroke="#fbf3e6" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <!-- cactus in a pot on the «الأسعار» tag icon's 24px grid (1.5 stroke, since the arms leave less air); the V marks are knit stitches, the dot is the flower -->
  <path id="cactus-body" d="M9.6 14V11.6H6.8a2 2 0 0 1-2-2V6.4a1.2 1.2 0 0 1 2.4 0V9.2H9.6V5a2.4 2.4 0 0 1 4.8 0V7.2h2.4V4.6a1.2 1.2 0 0 1 2.4 0V7.6a2 2 0 0 1-2 2H14.4V14" />
  <path id="cactus-knit" d="M11.15 7.5l.85.8.85-.8M11.15 10.4l.85.8.85-.8" />
  <symbol id="i-cactus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#cactus-body" />
    <use href="#cactus-knit" stroke-width=".85" />
    <rect x="6.2" y="14" width="11.6" height="2.6" rx=".8" />
    <path d="M7.4 16.6L8.4 21H15.6L16.6 16.6" />
    <circle cx="12" cy="1.35" r="1" fill="#e2541b" stroke="none" />
  </symbol>
</defs></svg>

<div class="art" id="a">
  <div class="sel"><svg class="ico" viewBox="4.05 -.2 15.9 20.75"><use href="#i-cactus" width="24" height="24" /></svg>
    <div class="frame"><i class="tl"></i><i class="tm"></i><i class="tr"></i><i class="ml"></i><i class="mr"></i><i class="bl"></i><i class="bm"></i><i class="br"></i></div>
    <svg class="cursor" viewBox="0 0 24 24"><use href="#i-cursor" /></svg></div>
</div>

<div class="art" id="b">
  <svg class="st c" viewBox="0 0 24 24">
    <g transform="rotate(-8 12 12)" stroke-linecap="round" stroke-linejoin="round">
      <use href="#cactus-body" fill="#fbf3e6" stroke="#fbf3e6" stroke-width="1.5" />
      <use href="#cactus-knit" fill="none" stroke="#1f1510" stroke-width=".8" />
      <path d="M7.4 16.2L8.4 21H15.6L16.6 16.2Z" fill="#fbf3e6" stroke="#fbf3e6" stroke-width="1.5" />
      <rect x="6.2" y="14" width="11.6" height="2.6" rx=".8" fill="#fbf3e6" stroke="#fbf3e6" stroke-width="1.5" />
      <path d="M7.6 15.3H16.4" stroke="#1f1510" stroke-width=".6" stroke-dasharray="1 .85" />
      <path d="M9 18.7H15" stroke="#e2541b" stroke-width=".6" stroke-dasharray="1 .85" />
      <g transform="translate(12 1.5)" fill="#fbf3e6"><circle r=".72" cx="0" cy="-.85" /><circle r=".72" cx=".81" cy="-.26" /><circle r=".72" cx=".5" cy=".69" /><circle r=".72" cx="-.5" cy=".69" /><circle r=".72" cx="-.81" cy="-.26" /><circle r=".5" fill="#e2541b" /></g>
    </g>
  </svg>
</div>

<div class="art" id="c"><div class="ring c"><svg><use href="#i-cactus" /></svg></div></div>

<div class="art" id="preview" style="height:480px">
  <h4>HOW IT LOOKS ON YOUR PROFILE</h4>
  <div class="row">
    <div><div class="pair">
      <div class="hl"><div class="ci"><div style="background-image:url(../ig-offer/out/covers-a.png)"></div></div>الأسعار</div>
      <div class="hl"><div class="ci"><div style="background-image:url(out/cover-a.png)"></div></div>كاكتوس</div>
    </div><div class="k">A</div></div>
    <div><div class="pair">
      <div class="hl"><div class="ci"><div style="background-image:url(../ig-offer/out/covers-b.png)"></div></div>الأسعار</div>
      <div class="hl"><div class="ci"><div style="background-image:url(out/cover-b.png)"></div></div>كاكتوس</div>
    </div><div class="k">B</div></div>
    <div><div class="pair">
      <div class="hl"><div class="ci"><div style="background-image:url(../ig-offer/out/covers-c.png)"></div></div>الأسعار</div>
      <div class="hl"><div class="ci"><div style="background-image:url(out/cover-c.png)"></div></div>كاكتوس</div>
    </div><div class="k">C</div></div>
  </div>
</div>

<script>
Promise.all([
  document.fonts.load("400 26px 'Readex Pro'", 'الأسعار كاكتوس'),
  document.fonts.load("500 24px 'IBM Plex Mono'", 'HOW IT LOOKS ON YOUR PROFILE ABC'),
  ...['../ig-offer/out/covers-a', '../ig-offer/out/covers-b', '../ig-offer/out/covers-c', 'out/cover-a', 'out/cover-b', 'out/cover-c']
    .map((u) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u + '.png'; })),
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
