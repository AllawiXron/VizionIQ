<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<title>Pepsi — بالعراق ما نگول كولا.. نگول ببسي</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<!-- Concept ad for Pepsi in Iraq, where every cola is «ببسي». The can is a real photo ("Pepsi Can" by Michael Thomas,
     CC BY 2.0), cut out in photo/can.py; the rest is type, a dictionary entry and some fizz. -->
<style>
:root { --blue:#0a3fa8; --deep:#04195a; --red:#d61f3a; --ice:#cfe2ff }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#111; display:flex; justify-content:center; padding:40px }
#ad { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:#fff; font-family:'Alexandria';
  background:
    radial-gradient(560px 640px at 300px 700px, rgba(120,170,255,.45), rgba(120,170,255,0) 70%),
    radial-gradient(1200px 1100px at 40% 40%, #1150c8 0%, #0a3fa8 40%, #062a78 75%, #04195a 100%) }
#ad::after { content:""; position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.16; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.8'/></svg>") }
.fizz { position:absolute; inset:0; z-index:1 }
.can { position:absolute; z-index:5; left:60px; top:300px; width:560px; transform:rotate(-8deg);
  filter:drop-shadow(0 50px 50px rgba(0,10,50,.55)) drop-shadow(0 0 30px rgba(160,200,255,.25)) }
.floor { position:absolute; z-index:4; left:110px; top:1000px; width:470px; height:70px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,8,40,.6), rgba(0,8,40,0)); filter:blur(6px) }

.txt { position:absolute; z-index:10; right:64px; top:96px; width:520px; text-align:right }
.lead { font:500 44px/1.35 'Readex Pro'; color:rgba(255,255,255,.86); white-space:nowrap }
.lead s { text-decoration:none; position:relative; color:rgba(255,255,255,.55) }
.lead s::after { content:""; position:absolute; left:-6px; right:-6px; top:54%; height:5px; border-radius:3px; background:var(--red); transform:rotate(-4deg) }
.hero { font:900 112px/1.08 'Alexandria'; margin-top:18px }
.hero b { display:block; font:400 230px/0.95 'Lalezar'; color:#fff; letter-spacing:-2px; text-shadow:0 18px 40px rgba(0,10,60,.45) }
.swoosh { display:block; width:430px; height:40px; margin:26px 0 0 auto }

/* dictionary entry */
.dict { position:absolute; z-index:12; right:64px; top:830px; width:520px; transform:rotate(2deg); background:#fbf8f1; color:#141821; border-radius:18px;
  padding:26px 30px 28px; box-shadow:0 30px 60px rgba(0,10,50,.45) }
.dict .w { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap }
.dict .w b { font:900 48px 'Alexandria' }
.dict .w i { font-style:normal; font:500 24px 'Readex Pro'; color:#6a7385 }
.dict .w code { font:500 22px 'IBM Plex Mono'; color:#6a7385; direction:ltr; margin-inline-start:auto }
.dict p { font:400 28px/1.55 'Readex Pro'; margin-top:10px }
.dict p.ex { color:#3b4558; border-top:2px dashed rgba(20,24,33,.16); padding-top:12px; margin-top:14px }
.dict p.ex em { font-style:normal; color:var(--blue); font-weight:600 }
.dict .lab { position:absolute; top:-18px; left:26px; background:var(--red); color:#fff; font:600 18px 'IBM Plex Mono'; letter-spacing:.14em; padding:6px 14px 7px; border-radius:8px; direction:ltr }

.foot { position:absolute; z-index:10; left:64px; right:64px; bottom:52px; display:flex; justify-content:space-between; align-items:center }
.foot .cta { font:600 27px 'Readex Pro'; background:#fff; color:var(--blue); padding:15px 32px 17px; border-radius:999px; display:flex; align-items:center; gap:12px }
.foot .cta svg { width:24px; height:24px }
.foot small { font:500 22px 'IBM Plex Mono'; letter-spacing:.2em; color:rgba(255,255,255,.6); direction:ltr }
</style></head>
<body>
<section id="ad">
  <svg class="fizz" viewBox="0 0 1080 1350" fill="none" stroke="rgba(220,235,255,.55)">
    <g stroke-width="2.5"><circle cx="120" cy="300" r="9" /><circle cx="160" cy="240" r="5" /><circle cx="560" cy="330" r="7" /><circle cx="600" cy="260" r="4" /><circle cx="90" cy="520" r="6" />
      <circle cx="660" cy="640" r="7" /><circle cx="70" cy="760" r="8" /><circle cx="590" cy="700" r="6" /><circle cx="520" cy="210" r="5" /></g>
    <g stroke-width="2" opacity=".6"><circle cx="210" cy="180" r="4" /><circle cx="470" cy="150" r="3" /><circle cx="40" cy="380" r="4" /><circle cx="640" cy="620" r="3" /><circle cx="110" cy="660" r="3" /></g>
  </svg>
  <div class="floor"></div>
  <img class="can" src="img/pepsi-can.png" alt="Pepsi" />

  <div class="txt">
    <div class="lead">بالعراق ما نگول <s>كولا</s>..</div>
    <div class="hero">نگول<b>ببسي.</b></div>
    <svg class="swoosh" viewBox="0 0 430 40" fill="none"><path d="M8 28 C 120 6, 300 6, 422 22" stroke="#d61f3a" stroke-width="9" stroke-linecap="round" /></svg>
  </div>

  <div class="dict">
    <span class="lab">IRAQI DICTIONARY</span>
    <div class="w"><b>ببسي</b><i>(اسم)</i><code>/bib·si/</code></div>
    <p>أي مشروب غازي أسود بالعراق.</p>
    <p class="ex">مثال: <em>"جيبلي ببسي بارد ويا العشا."</em></p>
  </div>

  <div class="foot">
    <small>PEPSI · IRAQ</small>
    <div class="cta">اطلبها باردة<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7" /></svg></div>
  </div>
</section>
<script>
const imgs = [...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
Promise.all([
  document.fonts.load("500 44px 'Readex Pro'", 'بالعراق ما نگول كولا..'),
  document.fonts.load("900 112px 'Alexandria'", 'نگول ببسي'),
  document.fonts.load("400 230px 'Lalezar'", 'ببسي.'),
  document.fonts.load("400 28px 'Readex Pro'", 'أي مشروب غازي أسود، بأي مكان بالعراق. مثال: جيبلي ببسي بارد ويا العشا. (اسم) اطلبها باردة'),
  document.fonts.load("500 22px 'IBM Plex Mono'", 'IRAQI DICTIONARY /bib·si/ PEPSI · IRAQ'),
  ...imgs,
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
