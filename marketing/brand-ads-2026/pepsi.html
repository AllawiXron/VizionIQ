<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<title>Pepsi — بالعراق ما نگول كولا.. نگول ببسي</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<!-- Concept ad for Pepsi in Iraq, where every cola is «ببسي». A real glass bottle with the current Pepsi globe
     ("Top-down View of a Burger Meal with Two Pepsi Bottles" by Iwaqarhashmi, CC BY-SA 4.0), cut out in photo/bottle.py
     and bled off the right edge, under a hard spotlight on electric blue. -->
<style>
:root { --blue:#1146ff; --deep:#0626a6; --night:#020c3c; --red:#ff2a3d }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#111; display:flex; justify-content:center; padding:40px }
#ad { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:#fff; font-family:'Alexandria';
  background:
    radial-gradient(520px 900px at 860px 520px, rgba(120,170,255,.55), rgba(120,170,255,0) 70%),
    linear-gradient(160deg, #1d55ff 0%, #1146ff 34%, #0a32d6 62%, #041a7a 100%) }
#ad::after { content:""; position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.18; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.8'/></svg>") }
/* big pulse lines behind everything, the way Pepsi's own artwork uses them */
.pulse { position:absolute; inset:0; z-index:1 }

.bottle { position:absolute; z-index:5; right:-36px; top:46px; width:540px; transform:rotate(3deg); transform-origin:50% 0;
  filter:drop-shadow(-24px 30px 40px rgba(2,8,50,.55)) drop-shadow(0 0 2px rgba(200,225,255,.6)) }
.sheen { position:absolute; z-index:6; right:-36px; top:46px; width:540px; height:1911px; transform:rotate(3deg); transform-origin:50% 0; pointer-events:none;
  background:linear-gradient(90deg, rgba(255,255,255,0) 8%, rgba(255,255,255,.16) 13%, rgba(255,255,255,0) 19%);
  -webkit-mask:url(img/pepsi-bottle.png) 0 0 / 540px auto no-repeat; mask:url(img/pepsi-bottle.png) 0 0 / 540px auto no-repeat }

.txt { position:absolute; z-index:10; left:64px; width:540px; top:200px; text-align:left; direction:rtl }
.lead { font:600 52px/1.3 'Readex Pro'; color:#dbe6ff; white-space:nowrap; text-align:right }
.lead s { text-decoration:none; position:relative; color:#8fa9ff }
.lead s svg { position:absolute; left:-10px; right:-10px; top:6px; width:calc(100% + 20px); height:70px; overflow:visible }
.say { font:900 96px/1 'Alexandria'; margin-top:46px; text-align:right }
.word { font:400 236px/0.9 'Lalezar'; letter-spacing:-4px; color:#fff; text-align:right; margin-top:10px; white-space:nowrap;
  text-shadow:0 24px 60px rgba(2,10,70,.45) }
.under { display:block; width:500px; height:46px; margin:40px 0 0 auto }
.sub { font:500 36px/1.55 'Readex Pro'; color:#dbe6ff; text-align:right; margin-top:30px }
.sub b { color:#fff; font-weight:700 }

.foot { position:absolute; z-index:10; left:64px; bottom:60px; display:flex; align-items:center; gap:26px; direction:rtl }
.foot .cta { font:700 30px 'Readex Pro'; background:#fff; color:var(--deep); padding:16px 36px 18px; border-radius:999px; display:flex; align-items:center; gap:12px;
  box-shadow:0 18px 40px rgba(2,10,70,.35) }
.foot .cta svg { width:26px; height:26px }
.foot .cold { font:600 22px 'IBM Plex Mono'; letter-spacing:.18em; color:#b9ccff; direction:ltr }
</style></head>
<body>
<section id="ad">
  <svg class="pulse" viewBox="0 0 1080 1350" fill="none">
    <path d="M-40 1130 C 220 1040, 420 1220, 700 1110 S 1000 980, 1140 1040" stroke="rgba(255,255,255,.10)" stroke-width="44" stroke-linecap="round" />
    <path d="M-40 1220 C 240 1140, 460 1300, 760 1190 S 1040 1080, 1140 1120" stroke="rgba(255,42,61,.55)" stroke-width="14" stroke-linecap="round" />
  </svg>

  <img class="bottle" src="img/pepsi-bottle.png" alt="Pepsi" />
  <div class="sheen"></div>

  <div class="txt">
    <div class="lead">بالعراق ما نگول <s>كولا<svg viewBox="0 0 100 70" preserveAspectRatio="none"><path d="M4 44 C 30 34, 60 30, 96 22" stroke="#ff2a3d" stroke-width="7" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke" /></svg></s>..</div>
    <div class="say">نگول</div>
    <div class="word">ببسي.</div>
    <svg class="under" viewBox="0 0 520 46" fill="none"><path d="M10 30 C 140 8, 360 6, 510 24" stroke="#ff2a3d" stroke-width="11" stroke-linecap="round" /></svg>
    <div class="sub">ويا العشا، ويا الكص،<br /><b>ويا كلشي.</b></div>
  </div>

  <div class="foot">
    <div class="cta">اطلبها باردة<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7" /></svg></div>
  </div>
</section>
<script>
const imgs = [...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
Promise.all([
  document.fonts.load("600 52px 'Readex Pro'", 'بالعراق ما نگول كولا..'),
  document.fonts.load("900 96px 'Alexandria'", 'نگول'),
  document.fonts.load("400 300px 'Lalezar'", 'ببسي.'),
  document.fonts.load("500 36px 'Readex Pro'", 'ويا العشا، ويا الكص، ويا كلشي.'),
  document.fonts.load("700 30px 'Readex Pro'", 'ويا كلشي. اطلبها باردة'),
  ...imgs,
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
