<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<title>Pepsi — بالعراق ما نگول كولا.. نگول ببسي</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<!-- Concept ad for Pepsi in Iraq, where every cola is «ببسي», and has been since the 90s. The can is the 1990s design,
     a real photo ("Pepsi Can Retro Design" by Ominae, CC BY-SA 3.0) cut out in photo/retro_can.py, standing on a glossy
     floor under a spotlight on electric blue. -->
<style>
:root { --blue:#1146ff; --deep:#0626a6; --red:#ff2a3d; --pale:#dbe6ff }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#111; display:flex; justify-content:center; padding:40px }
#ad { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:#fff; font-family:'Alexandria';
  background:
    radial-gradient(420px 640px at 800px 640px, rgba(150,190,255,.55), rgba(150,190,255,0) 72%),
    linear-gradient(180deg, #1a50ff 0%, #1146ff 40%, #0a33d8 68%, #06208f 100%) }
#ad::after { content:""; position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.18; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.8'/></svg>") }
/* depth: out-of-focus lights far behind, and a spotlight cone falling on the can */
.bokeh { position:absolute; z-index:1; inset:0 }
.bokeh i { position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(190,215,255,.55) 0%, rgba(190,215,255,.22) 55%, rgba(190,215,255,0) 72%); filter:blur(3px) }
.cone { position:absolute; z-index:2; left:400px; top:-60px; width:800px; height:1240px; pointer-events:none; mix-blend-mode:screen;
  background:radial-gradient(70% 100% at 52% 0%, rgba(215,230,255,.30), rgba(215,230,255,.12) 55%, rgba(215,230,255,0) 80%);
  -webkit-mask:linear-gradient(98deg, transparent 28%, #000 44%, #000 58%, transparent 74%); mask:linear-gradient(98deg, transparent 28%, #000 44%, #000 58%, transparent 74%) }
/* glossy floor the can stands on */
.floor { position:absolute; z-index:2; left:0; right:0; top:1140px; bottom:0; background:linear-gradient(180deg, #0a2fc6 0%, #061d86 100%) }
.floor::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.35) 60%, rgba(255,255,255,0)) }
.pool { position:absolute; z-index:3; left:520px; top:1080px; width:600px; height:130px; border-radius:50%; background:radial-gradient(closest-side, rgba(190,215,255,.6), rgba(190,215,255,0)) }
.contact { position:absolute; z-index:4; left:612px; top:1112px; width:430px; height:48px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,5,35,.9), rgba(0,5,35,.4) 60%, rgba(0,5,35,0)); filter:blur(2px) }

.can { position:absolute; z-index:5; left:616px; top:418px; width:412px; display:block;
  -webkit-box-reflect:below -6px linear-gradient(transparent 72%, rgba(255,255,255,.34));
  filter:drop-shadow(-18px 28px 30px rgba(2,10,60,.35)) }

.txt { position:absolute; z-index:10; left:64px; width:500px; top:190px; text-align:right }
.lead { font:600 50px/1.3 'Readex Pro'; color:var(--pale); white-space:nowrap }
.lead s { text-decoration:none; position:relative; color:#8fa9ff }
.lead s svg { position:absolute; left:-10px; top:6px; width:calc(100% + 20px); height:70px; overflow:visible }
.say { font:900 96px/1 'Alexandria'; margin-top:46px }
.word { font:400 236px/0.9 'Lalezar'; letter-spacing:-4px; margin-top:10px; white-space:nowrap; text-shadow:0 24px 60px rgba(2,10,70,.45) }
.under { display:block; width:480px; height:46px; margin:40px 0 0 auto }
.sub { font:500 38px/1.5 'Readex Pro'; color:var(--pale); margin-top:28px }
.sub b { color:#fff; font-weight:700 }
.tag90 { display:inline-block; margin-top:22px; font:600 22px 'IBM Plex Mono'; letter-spacing:.2em; color:#fff; border:2px solid rgba(255,255,255,.55); border-radius:999px; padding:8px 18px 9px; direction:ltr }

.foot { position:absolute; z-index:10; left:64px; bottom:62px; display:flex; align-items:center }
.foot .cta { font:700 30px 'Readex Pro'; background:#fff; color:var(--deep); padding:16px 36px 18px; border-radius:999px; display:flex; align-items:center; gap:12px;
  box-shadow:0 18px 40px rgba(2,10,70,.35) }
.foot .cta svg { width:26px; height:26px }
</style></head>
<body>
<section id="ad">
  <div class="bokeh"><i style="left:640px;top:96px;width:120px;height:120px;opacity:.55"></i><i style="left:880px;top:180px;width:70px;height:70px;opacity:.5"></i>
    <i style="left:980px;top:60px;width:150px;height:150px;opacity:.35"></i><i style="left:760px;top:250px;width:46px;height:46px;opacity:.5"></i>
    <i style="left:40px;top:960px;width:110px;height:110px;opacity:.35"></i><i style="left:300px;top:1010px;width:60px;height:60px;opacity:.35"></i>
    <i style="left:-40px;top:40px;width:180px;height:180px;opacity:.25"></i></div>
  <div class="cone"></div>
  <div class="floor"></div>
  <div class="pool"></div>
  <div class="contact"></div>
  <img class="can" src="img/pepsi-retro-can-lit.png" alt="Pepsi" />

  <div class="txt">
    <div class="lead">بالعراق ما نگول <s>كولا<svg viewBox="0 0 100 70" preserveAspectRatio="none"><path d="M4 44 C 30 34, 60 30, 96 22" stroke="#ff2a3d" stroke-width="7" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke" /></svg></s>..</div>
    <div class="say">نگول</div>
    <div class="word">ببسي.</div>
    <svg class="under" viewBox="0 0 480 46" fill="none"><path d="M10 30 C 130 8, 330 6, 470 24" stroke="#ff2a3d" stroke-width="11" stroke-linecap="round" /></svg>
    <div class="sub">من أيام التسعينات..<br /><b>لهسه.</b></div>
  </div>

  <div class="foot">
    <div class="cta">اطلبها باردة<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7" /></svg></div>
  </div>
</section>
<script>
const imgs = [...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
Promise.all([
  document.fonts.load("600 50px 'Readex Pro'", 'بالعراق ما نگول كولا..'),
  document.fonts.load("900 96px 'Alexandria'", 'نگول'),
  document.fonts.load("400 236px 'Lalezar'", 'ببسي.'),
  document.fonts.load("500 38px 'Readex Pro'", 'من أيام التسعينات.. لهسه.'),
  document.fonts.load("700 38px 'Readex Pro'", 'لهسه. اطلبها باردة'),
  ...imgs,
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
