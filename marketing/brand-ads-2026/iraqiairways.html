<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<title>Iraqi Airways — مهما طالت الغربة.. بغداد قريبة</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<!-- Concept ad for Iraqi Airways (الخطوط الجوية العراقية). A real plane window; through it, Baghdad, the Tigris and its palm
     groves (img/iqa-window.jpg, built by photo/window.py). Brand green #12470D from iraqiairways.com.iq. -->
<style>
:root { --green:#12470d; --green-2:#1d6b16; --cream:#f6f1e7; --ink:#0f1612 }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#111; display:flex; justify-content:center; padding:40px }
#ad { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:#fff; font-family:'Readex Pro';
  background:#0d1117 url(img/iqa-window.jpg) 50% -52px / 1080px auto no-repeat }
/* cabin falls off to dark at the top and bottom so the type sits on it */
#ad::before { content:""; position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg, rgba(8,11,16,.92) 0%, rgba(8,11,16,.55) 24%, rgba(8,11,16,0) 34%, rgba(8,11,16,0) 76%, rgba(8,11,16,.7) 90%, rgba(8,11,16,.95) 100%) }
#ad::after { content:""; position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.16; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.7'/></svg>") }

.head { position:absolute; z-index:10; top:70px; left:0; right:0; text-align:center }
.lead { font:300 46px/1.3 'Readex Pro'; color:rgba(246,241,231,.86); letter-spacing:.01em }
.hero { font:700 158px/1.15 'Aref Ruqaa'; color:#fff; margin-top:2px; text-shadow:0 10px 40px rgba(0,0,0,.45) }
.hero b { font-weight:700; color:#bfe3a5 }
.rule { width:88px; height:4px; border-radius:2px; background:#bfe3a5; margin:18px auto 0; opacity:.9 }

/* boarding pass, tucked on the window sill */
.pass { position:absolute; z-index:12; left:64px; top:1006px; width:470px; transform:rotate(-5deg); direction:rtl;
  border-radius:20px; overflow:hidden; background:var(--cream); color:var(--ink);
  box-shadow:0 30px 50px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.25) }
.pass .top { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--green); color:#fff }
.pass .top img { height:44px; display:block }
.pass .top span { font:500 17px 'IBM Plex Mono'; letter-spacing:.14em; direction:ltr; opacity:.85 }
.pass .route { display:flex; align-items:center; justify-content:space-between; padding:20px 26px 6px; direction:ltr }
.pass .route div { text-align:center }
.pass .route b { display:block; font:600 52px/1 'IBM Plex Mono'; letter-spacing:.02em }
.pass .route small { display:block; font:500 21px 'Readex Pro'; color:rgba(15,22,18,.65); margin-top:6px }
.pass .route svg { width:120px; height:30px }
.pass .meta { display:flex; justify-content:space-between; padding:14px 26px 22px; border-top:2px dashed rgba(15,22,18,.18); margin-top:14px; direction:rtl }
.pass .meta div small { display:block; font:500 16px 'Readex Pro'; color:rgba(15,22,18,.55) }
.pass .meta div b { display:block; font:600 26px 'Readex Pro'; margin-top:2px }
.pass .meta div b i { font-style:normal; font-family:'IBM Plex Mono'; font-weight:600 }
.pass { -webkit-mask:radial-gradient(circle 15px at 0 calc(100% - 92px), transparent 96%, #000 100%), radial-gradient(circle 15px at 100% calc(100% - 92px), transparent 96%, #000 100%);
  -webkit-mask-composite:source-in; mask-composite:intersect }

.foot { position:absolute; z-index:10; right:64px; bottom:52px; display:flex; flex-direction:column; align-items:flex-start; gap:22px }
.foot .brand img { height:88px; display:block }
.foot .cta { font:600 24px 'Readex Pro'; color:var(--ink); background:#fff; padding:14px 28px 16px; border-radius:999px; display:flex; align-items:center; gap:12px }
.foot .cta svg { width:22px; height:22px }
</style></head>
<body>
<section id="ad">
  <div class="head">
    <div class="lead">مهما طالت الغربة..</div>
    <div class="hero">بغداد قريبة</div>
    <div class="rule"></div>
  </div>

  <div class="pass">
    <div class="top"><img src="img/iqa-logo-white.png" alt="Iraqi Airways" /><span>BOARDING PASS</span></div>
    <div class="route">
      <div><b>IST</b><small>إسطنبول</small></div>
      <svg viewBox="0 0 120 30" fill="none" stroke="#12470d" stroke-width="2.5" stroke-linecap="round"><path d="M6 15 H44" stroke-dasharray="2 7" /><path d="M76 15 H114" stroke-dasharray="2 7" />
        <path d="M60 4 l3 0 l8 9 h9 a2 2 0 0 1 0 4 h-9 l-8 9 h-3 l4 -9 h-7 l-2.5 3 h-2.5 l1.5 -5 l-1.5 -5 h2.5 l2.5 3 h7 z" fill="#12470d" stroke="none" /></svg>
      <div><b>BGW</b><small>بغداد</small></div>
    </div>
    <div class="meta">
      <div><small>المسافر</small><b>راجع للأهل</b></div>
      <div><small>المقعد</small><b><i>12A</i> · شبّاك</b></div>
    </div>
  </div>

  <div class="foot">
    <div class="brand"><img src="img/iqa-logo-white.png" alt="الخطوط الجوية العراقية" /></div>
    <div class="cta">احجز رحلتك<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7" /></svg></div>
  </div>
</section>
<script>
const imgs = [...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
const bg = new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = 'img/iqa-window.jpg'; });
Promise.all([
  document.fonts.load("700 158px 'Aref Ruqaa'", 'بغداد قريبة'),
  document.fonts.load("300 46px 'Readex Pro'", 'مهما طالت الغربة..'),
  document.fonts.load("600 26px 'Readex Pro'", 'راجع للأهل شبّاك احجز رحلتك'),
  document.fonts.load("500 21px 'Readex Pro'", 'إسطنبول بغداد المسافر المقعد الخطوط الجوية العراقية'),
  document.fonts.load("600 52px 'IBM Plex Mono'", 'IST BGW 12A BOARDING PASS'),
  bg, ...imgs,
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
