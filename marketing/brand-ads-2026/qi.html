<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<title>Qi Card — أحلى إشعار بالشهر</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<!-- Concept ad for Qi Card (كي كارد). The whole post is a phone lock screen on the first of the month: the salary
     notification on top, and the usual Iraqi notifications under it. Brand yellow #F3CD00 and the Q mark from qi.iq.
     1 November 2026 is a Sunday. All vector, no photos. -->
<style>
:root { --y:#f3cd00; --y-2:#ffd917; --y-d:#e2b900; --ink:#141414 }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#111; display:flex; justify-content:center; padding:40px }
#ad { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:var(--ink); font-family:'IBM Plex Sans Arabic';
  background:radial-gradient(900px 800px at 30% 20%, #ffdc2b, #f3cd00 55%, #e6bf00 100%) }
#ad::after { content:""; position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.12; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.7'/></svg>") }
/* wallpaper: the Q mark, huge, tone on tone */
.wall { position:absolute; left:-300px; top:560px; width:1100px; opacity:.26; transform:rotate(-12deg); z-index:0 }

.status { position:absolute; z-index:5; top:34px; left:64px; right:64px; display:flex; justify-content:space-between; align-items:center; direction:ltr;
  font:600 30px 'IBM Plex Sans Arabic' }
.status .r { display:flex; gap:14px; align-items:center }
.status svg { height:26px }
.lock { position:absolute; z-index:5; top:104px; left:0; right:0; display:flex; justify-content:center }
.lock svg { width:30px; height:36px }
.date { position:absolute; z-index:5; top:150px; left:0; right:0; text-align:center; font:500 38px 'IBM Plex Sans Arabic'; color:rgba(20,20,20,.78) }
.clock { position:absolute; z-index:5; top:184px; left:0; right:0; text-align:center; font:700 196px/1 'IBM Plex Sans Arabic'; letter-spacing:-2px }

.stack { position:absolute; z-index:6; left:56px; right:56px; top:436px; display:flex; flex-direction:column; gap:16px }
.nt { display:flex; gap:22px; align-items:flex-start; padding:24px 26px; border-radius:34px; background:rgba(255,255,255,.62);
  backdrop-filter:blur(18px); box-shadow:0 10px 30px rgba(120,90,0,.12) }
.nt .ic { width:76px; height:76px; border-radius:18px; flex:none; display:grid; place-items:center }
.nt .ic svg, .nt .ic img { width:46px; height:46px }
.nt .t { flex:1; min-width:0 }
.nt .h { display:flex; justify-content:space-between; align-items:baseline }
.nt .h b { font:700 30px 'IBM Plex Sans Arabic' }
.nt .h span { font:400 24px 'IBM Plex Sans Arabic'; color:rgba(20,20,20,.5) }
.nt p { font:400 29px/1.45 'IBM Plex Sans Arabic'; margin-top:2px; color:rgba(20,20,20,.86) }
.nt p strong { font-weight:700 }
/* the one that matters */
.nt.hero { background:#fff; padding:30px 30px 32px; box-shadow:0 30px 60px rgba(110,80,0,.30), 0 0 0 3px #141414 }
.nt.hero .ic { width:96px; height:96px; border-radius:24px; background:var(--ink) }
.nt.hero .ic img { width:60px; height:60px }
.nt.hero .h b { font-size:34px }
.nt.hero p { font-size:34px; color:var(--ink) }
.nt.hero .amt { display:inline-block; margin-top:12px; font:700 46px/1 'IBM Plex Sans Arabic'; background:var(--y); padding:10px 18px 12px; border-radius:14px }
.nt.dim { opacity:.55; transform:scale(.97) }
.nt.dim2 { opacity:.38; transform:scale(.94); margin-top:-6px }

.txt { position:absolute; z-index:10; left:64px; right:64px; top:1004px }
.hl { font:900 88px/1.15 'Alexandria'; white-space:nowrap }
.sub { font:500 32px/1.5 'IBM Plex Sans Arabic'; color:rgba(20,20,20,.75); margin-top:12px }

.foot { position:absolute; z-index:10; left:64px; right:64px; bottom:50px; display:flex; justify-content:space-between; align-items:center }
.foot .brand { display:flex; align-items:center; gap:18px }
.foot .brand img { height:64px; display:block }
.foot .brand span { font:700 38px 'IBM Plex Sans Arabic' }
.foot .cta { font:600 27px 'IBM Plex Sans Arabic'; background:var(--ink); color:var(--y); padding:15px 32px 17px; border-radius:999px; display:flex; align-items:center; gap:12px }
.foot .cta svg { width:24px; height:24px }
.home { position:absolute; z-index:10; left:50%; bottom:16px; width:240px; height:8px; margin-left:-120px; border-radius:4px; background:rgba(20,20,20,.55) }
</style></head>
<body>
<section id="ad">
  <img class="wall" src="img/qi-logo-white.svg" alt="" />

  <div class="status">
    <span>٩:٤١</span>
    <span class="r">
      <svg viewBox="0 0 36 24"><rect x="0" y="16" width="6" height="8" rx="1.5" /><rect x="10" y="11" width="6" height="13" rx="1.5" /><rect x="20" y="6" width="6" height="18" rx="1.5" /><rect x="30" y="0" width="6" height="24" rx="1.5" /></svg>
      <svg viewBox="0 0 52 24"><rect x="1" y="1" width="44" height="22" rx="6" fill="none" stroke="#141414" stroke-width="2" opacity=".5" /><rect x="4" y="4" width="34" height="16" rx="3.5" /><rect x="47" y="8" width="3.5" height="8" rx="1.5" opacity=".5" /></svg>
    </span>
  </div>
  <div class="lock"><svg viewBox="0 0 30 36" fill="none" stroke="#141414" stroke-width="3.2" stroke-linecap="round"><rect x="2" y="15" width="26" height="19" rx="5" fill="#141414" stroke="none" /><path d="M8 15 V10 a7 7 0 0 1 14 0 V15" /></svg></div>
  <div class="date">الأحد، ١ تشرين الثاني</div>
  <div class="clock">٩:٤١</div>

  <div class="stack">
    <div class="nt hero">
      <div class="ic"><img src="img/qi-logo.svg" alt="" /></div>
      <div class="t">
        <div class="h"><b>كي كارد</b><span>الآن</span></div>
        <p>تم إيداع راتبك بحسابك</p>
        <span class="amt">+ ٩٥٠٬٠٠٠ د.ع</span>
      </div>
    </div>
    <div class="nt dim">
      <div class="ic" style="background:#2f7d32"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L5 13 h6 l-1 9 8-11 h-6 z" fill="#fff" stroke="none" /></svg></div>
      <div class="t"><div class="h"><b>المولّدة</b><span>قبل ساعة</span></div><p>تذكير: اشتراك الأمبير يخلص باچر</p></div>
    </div>
    <div class="nt dim2">
      <div class="ic" style="background:#25a35a"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C7 3 3 6.6 3 11c0 2.4 1.2 4.6 3.2 6.1L5.5 21l4-2.2c.8.2 1.6.2 2.5.2 5 0 9-3.6 9-8s-4-8-9-8z" /></svg></div>
      <div class="t"><div class="h"><b>ماما</b><span>قبل ساعتين</span></div><p>جيب خبز وانت راجع</p></div>
    </div>
  </div>

  <div class="txt">
    <div class="hl">أحلى إشعار بالشهر.</div>
    <div class="sub">راتبك ينزل على كي كارد، وتدفع وتحوّل بيه من التطبيق.</div>
  </div>

  <div class="foot">
    <div class="brand"><img src="img/qi-logo-ink.svg" alt="" /><span>كي كارد</span></div>
    <div class="cta">حمّل التطبيق<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7" /></svg></div>
  </div>
  <i class="home"></i>
</section>
<script>
const imgs = [...document.images].map((i) => (i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
Promise.all([
  document.fonts.load("700 196px 'IBM Plex Sans Arabic'", '٩:٤١ كي كارد + ٩٥٠٬٠٠٠ د.ع'),
  document.fonts.load("400 29px 'IBM Plex Sans Arabic'", 'الآن تم إيداع راتبك بحسابك المولّدة قبل ساعة تذكير: اشتراك الأمبير يخلص باچر ماما قبل ساعتين جيب خبز وانت راجع'),
  document.fonts.load("500 38px 'IBM Plex Sans Arabic'", 'الأحد، ١ تشرين الثاني راتبك ينزل على كي كارد، وتدفع وتحوّل بيه من التطبيق.'),
  document.fonts.load("600 27px 'IBM Plex Sans Arabic'", 'حمّل التطبيق'),
  document.fonts.load("900 88px 'Alexandria'", 'أحلى إشعار بالشهر.'),
  ...imgs,
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
