<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>allawi.psd reel — layer by layer</title>
<link rel="stylesheet" href="fonts/alexandria.css" />
<link rel="stylesheet" href="fonts/portfolio.css" />
<style>
  :root { --paper: #ece3d4; --paper-2: #e3d6c2; --ink: #1f1510; --orange: #e2541b; --orange-2: #f07a2e; --cream: #fbf3e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Alexandria", sans-serif; color: var(--ink);
    background: radial-gradient(120% 80% at 50% 10%, #f1e9dc 0%, var(--paper) 55%, var(--paper-2) 100%); }
  .dark { position: absolute; inset: 0; z-index: 1; opacity: 0; background: radial-gradient(80% 60% at 50% 45%, #33251c 0%, #1c130d 60%, #120c08 100%); }
  .ring { position: absolute; z-index: 2; border-radius: 50%; border: 20px solid var(--orange); filter: blur(2.2px); }
  .grain { position: absolute; inset: 0; z-index: 40; pointer-events: none; opacity: 0.3; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0.55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  .flash { position: absolute; inset: 0; z-index: 35; background: #fff; opacity: 0; pointer-events: none; }

  /* top: hook (build), file label (3D), signature (end) */
  .top { position: absolute; z-index: 20; left: 70px; right: 70px; top: 228px; text-align: center; direction: rtl; }
  .top .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.16em; text-transform: uppercase; direction: ltr; color: rgba(31, 21, 16, 0.62); }
  .top .mono i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); margin-right: 14px; vertical-align: 2px; }
  .top .big { font-weight: 800; font-size: 76px; line-height: 1.3; margin-top: 8px; white-space: nowrap; }
  .top .big em { font-style: normal; color: var(--orange); }
  .hook, .label3d, .sign { position: absolute; left: 0; right: 0; top: 0; }
  .label3d .mono { color: rgba(251, 243, 230, 0.75); }
  .label3d .big { color: var(--cream); font-size: 64px; }

  /* the artboard */
  .board { position: absolute; z-index: 10; }
  .board .shadow { position: absolute; inset: 0; box-shadow: 18px 30px 60px rgba(70, 30, 10, 0.28), 0 3px 8px rgba(70, 30, 10, 0.15); }
  .board .checker { position: absolute; inset: 0; background: #fff conic-gradient(#d9d9d9 25%, #fff 0 50%, #d9d9d9 0 75%, #fff 0) 0 0 / 40px 40px; }
  .board .edge { position: absolute; inset: 0; outline: 2px solid var(--ink); }
  .pl { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  .pl img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* layers panel */
  .panel { position: absolute; z-index: 20; left: 40px; top: 1150px; width: 330px; border-radius: 16px; overflow: hidden; direction: ltr; color: var(--cream);
    background: #241912; box-shadow: 16px 26px 50px rgba(60, 25, 8, 0.38), inset 0 0 0 1px rgba(251, 243, 230, 0.1); }
  .panel .hd { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(251, 243, 230, 0.14);
    font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.12em; }
  .panel .hd span:last-child { opacity: 0.55; letter-spacing: 0.04em; }
  .row { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid rgba(251, 243, 230, 0.07); font-family: "Readex Pro"; font-size: 17px; font-weight: 500; white-space: nowrap; }
  .row svg { width: 20px; height: 20px; flex: none; }
  .row .th { width: 32px; height: 40px; flex: none; outline: 1px solid rgba(251, 243, 230, 0.3);
    background: conic-gradient(#999 25%, #bfbfbf 0 50%, #999 0 75%, #bfbfbf 0) 0 0 / 10px 10px; position: relative; overflow: hidden; }
  .row .th img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cursor { position: absolute; z-index: 25; width: 56px; filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35)); transform-origin: 20% 10%; }

  /* end card */
  .cta { position: absolute; z-index: 20; left: 60px; right: 60px; top: 1440px; display: flex; justify-content: center; align-items: center; gap: 20px; direction: rtl; }
  .cta b { font-weight: 800; font-size: 44px; }
  .cta span { height: 64px; padding: 0 26px; border-radius: 16px; display: flex; align-items: center; color: var(--cream); font-weight: 600; font-size: 28px;
    background: linear-gradient(180deg, var(--orange-2), var(--orange)); box-shadow: 0 12px 24px rgba(150, 50, 10, 0.3); direction: ltr; font-family: "Readex Pro"; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></symbol>
    <symbol id="eyeoff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><path d="M3 3l18 18" /></symbol>
  </defs>
</svg>
<div class="stage" id="stage">
  <div class="dark" id="dark"></div>
  <div class="ring" id="ring"></div>

  <div class="top">
    <div class="hook" id="hook"><div class="mono"><i></i><span id="hookLabel"></span></div><div class="big" id="hookText"></div></div>
    <div class="label3d" id="label3d"><div class="mono"><i></i><span id="fileLabel"></span></div><div class="big">طبقة فوق طبقة</div></div>
    <div class="sign" id="sign"><div class="mono"><i></i>@allawi.psd</div><div class="big">طبقة فوق <em>طبقة</em></div></div>
  </div>

  <div class="board" id="board"><div class="shadow"></div><div class="checker" id="checker"></div><div id="planes"></div><div class="edge" id="edge"></div></div>

  <div class="panel" id="panel"><div class="hd"><span>LAYERS</span><span id="panelFile"></span></div><div id="rows"></div></div>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5 6.3-.3z" fill="#1f1510" stroke="#fbf3e6" stroke-width="1.4" stroke-linejoin="round" /></svg>

  <div class="cta" id="cta"><b>تحب إعلان مثله؟</b><span>DM @allawi.psd</span></div>
  <div class="flash" id="flash"></div>
  <div class="grain"></div>
</div>

<script>
  // ---- the ad (bottom layer first), from ../<ad>/layers ----
  const ADS = {
    sala: { file: 'sala_ad.psd', label: 'allawi.psd — sala ad', hook: '٥ طبقات… <em>وإعلان كامل</em>', tint: '200, 16, 28',
      layers: [['bg', 'Red + doodles', 'fade'], ['food', 'Egg basket (photo)', 'drop'], ['card', 'App card', 'pop'], ['txt', 'Headline & footer', 'wipe'], ['logo', 'Logo', 'pop']] },
  };
  const AD = ADS[new URLSearchParams(location.search).get('ad') || 'sala'];
  const KEY = new URLSearchParams(location.search).get('ad') || 'sala';
  const N = AD.layers.length;

  // ---- timeline (seconds) ----
  const T0 = 0.8, STEP = 1.1;                                   // layer i lands at T0 + i*STEP
  const EXP0 = T0 + N * STEP + 0.1, EXP1 = EXP0 + 1.1, HOLD1 = EXP1 + 1.2, COL1 = HOLD1 + 0.45, END = COL1 + 4.3;
  window.TIMELINE = { fps: 30, duration: END, layers: AD.layers.map((l, i) => T0 + i * STEP), exp0: EXP0, exp1: EXP1, hold1: HOLD1, impact: COL1 };

  // ---- geometry ----
  const B0 = { x: 170, y: 440, w: 740, h: 925 }, B1 = { x: 130, y: 390, w: 820, h: 1025 };

  // ---- build DOM ----
  document.getElementById('hookLabel').textContent = AD.label;
  document.getElementById('hookText').innerHTML = AD.hook;
  document.getElementById('fileLabel').textContent = `${AD.file} · ${N} layers`;
  document.getElementById('panelFile').textContent = AD.file;
  const planes = document.getElementById('planes'), rows = document.getElementById('rows');
  const P = AD.layers.map(([k]) => { const d = document.createElement('div'); d.className = 'pl'; d.innerHTML = `<img src="img/${KEY}/${k}.png" alt="" />`; planes.appendChild(d); return d; });
  const R = [];
  for (let i = N - 1; i >= 0; i--) {                            // Photoshop lists the top layer first
    const [k, name] = AD.layers[i]; const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<svg><use href="#eyeoff" /></svg><div class="th"><img src="img/${KEY}/${k}.png" alt="" /></div><span></span>`;
    r.querySelector('span').textContent = name; rows.appendChild(r); R[i] = r;
  }

  // ---- easing ----
  const cl = (x) => Math.min(1, Math.max(0, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const inOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const out3 = (t) => 1 - Math.pow(1 - t, 3);
  const in3 = (t) => t * t * t;
  const back = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const seg = (t, a, b) => cl((t - a) / (b - a));

  const el = (id) => document.getElementById(id);
  window.setTime = (t) => {
    const a = inOut(seg(t, EXP0, EXP1)) * (1 - in3(seg(t, HOLD1, COL1)));   // 0 flat -> 1 exploded -> 0
    const h = seg(t, EXP1, HOLD1);                                            // slow drift while exploded
    const g = out3(seg(t, COL1, COL1 + 0.65));                                // grow into the end card
    const exploded = t >= EXP0 && t < COL1;

    // board
    const bx = lerp(B0.x, B1.x, g), by = lerp(B0.y, B1.y, g) - 70 * a, bw = lerp(B0.w, B1.w, g), bh = lerp(B0.h, B1.h, g);
    const bump = 1 + 0.035 * Math.sin(Math.PI * seg(t, COL1, COL1 + 0.3));
    const board = el('board');
    Object.assign(board.style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px', transform: `scale(${bump})` });
    board.querySelector('.shadow').style.opacity = 1 - a;
    el('edge').style.opacity = (1 - a) * (1 - g);
    el('checker').style.opacity = 1 - a;

    // layers
    AD.layers.forEach(([k, name, fx], i) => {
      const ti = T0 + i * STEP, u = seg(t, ti, ti + (fx === 'wipe' ? 0.8 : 0.55));
      const p = P[i]; let op = 1, tf = '', clip = 'none';
      if (fx === 'fade') { op = out3(u); tf = `scale(${lerp(1.05, 1, out3(u))})`; }
      if (fx === 'drop') { op = cl(u * 3); tf = `translateY(${lerp(-160, 0, back(u))}px)`; }
      if (fx === 'pop') { op = cl(u * 2.5); tf = `scale(${lerp(0.6, 1, back(u))})`; }
      if (fx === 'wipe') { op = u > 0 ? 1 : 0; clip = `inset(0 0 0 ${(1 - inOut(u)) * 100}%)`; }
      if (t < ti) op = 0;
      const z = (i - (N - 1) / 2) * 170 * a;
      const rz = (-38 - 10 * h) * a, rx = 56 * a, sc = 1 - 0.3 * a;
      p.style.opacity = op;
      p.style.clipPath = clip;
      p.style.transform = `perspective(2600px) rotateX(${rx}deg) rotateZ(${rz}deg) translate3d(0, 0, ${z}px) scale(${sc}) ${a > 0.001 ? '' : tf}`;
      p.style.backgroundColor = i > 0 ? `rgba(${AD.tint}, ${0.3 * a})` : 'transparent';
      p.style.outline = a > 0.001 ? `${2}px solid rgba(251, 243, 230, ${0.6 * a})` : 'none';
      p.style.boxShadow = a > 0.001 ? `0 0 0 0 transparent, 30px 40px 60px rgba(0, 0, 0, ${0.35 * a})` : 'none';
      // panel row
      const r = R[i], on = t >= ti, active = on && t < ti + STEP && t < EXP0;
      r.querySelector('use').setAttribute('href', on ? '#eye' : '#eyeoff');
      r.style.opacity = on ? 1 : 0.42;
      r.style.background = active ? 'linear-gradient(180deg, #f07a2e, #e2541b)' : 'transparent';
    });

    // panel + cursor
    const pf = 1 - seg(t, EXP0, EXP0 + 0.4);
    el('panel').style.opacity = pf; el('panel').style.transform = `translateY(${(1 - pf) * 40}px)`;
    let ci = 0; for (let i = 0; i < N; i++) if (t >= T0 + i * STEP - 0.45) ci = i;
    const rowY = (i) => 1150 + 44 + (N - 1 - i) * 54 + 27, prevY = ci > 0 ? rowY(ci - 1) : 1500;
    const mv = out3(seg(t, T0 + ci * STEP - 0.45, T0 + ci * STEP - 0.12));
    const click = Math.sin(Math.PI * seg(t, T0 + ci * STEP - 0.1, T0 + ci * STEP + 0.08));
    const cur = el('cursor');
    Object.assign(cur.style, { left: '58px', top: lerp(prevY, rowY(ci), mv) - 6 + 'px', opacity: pf * cl(t / 0.3 + 0.6), transform: `scale(${1 - 0.18 * click})` });

    // background, ring, flash
    el('dark').style.opacity = a;
    const rr = lerp(470, 540, g), cx = bx + bw / 2, cy = by + bh / 2 + 70 * a;
    Object.assign(el('ring').style, { left: cx - rr + 'px', top: cy - rr + 'px', width: rr * 2 + 'px', height: rr * 2 + 'px',
      opacity: 1 - 0.65 * a, boxShadow: `0 0 ${60 * a}px rgba(240, 122, 46, ${0.6 * a})` });
    el('flash').style.opacity = 0.85 * (1 - out3(seg(t, COL1, COL1 + 0.35))) * (t >= COL1 ? 1 : 0);

    // top texts + end card
    el('hook').style.opacity = 1 - seg(t, EXP0, EXP0 + 0.35);
    el('label3d').style.opacity = exploded ? Math.min(seg(t, EXP0 + 0.3, EXP0 + 0.7), 1 - seg(t, HOLD1, HOLD1 + 0.2)) : 0;
    const e = out3(seg(t, COL1 + 0.35, COL1 + 0.85));
    el('sign').style.opacity = e; el('sign').style.transform = `translateY(${(1 - e) * 24}px)`;
    const c = out3(seg(t, COL1 + 0.55, COL1 + 1.05));
    el('cta').style.opacity = c; el('cta').style.transform = `translateY(${(1 - c) * 30}px)`;
  };
  setTime(Number(new URLSearchParams(location.search).get('t') || 0));
</script>
</body>
</html>
