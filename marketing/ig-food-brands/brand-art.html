<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../identity-concepts/fonts/fonts.css" />
<!-- The four parody brands' marks, white on transparent; brand.py prints them onto the AI product photos as gold
     foil (or ink). Each is sized to the surface it goes on. -->
<style>
body{margin:0;background:transparent}
.t{position:relative;color:#fff;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.en{font-family:'Cormorant Garamond';font-weight:600;letter-spacing:.3em;padding-left:.3em;line-height:1}
.ar{font-family:'Aref Ruqaa';font-weight:700;direction:rtl;line-height:1.1}
.small{font-family:'Cormorant Garamond';font-weight:500;letter-spacing:.42em;padding-left:.42em;line-height:1}
.rule{background:#fff}
.row{display:flex;align-items:center;gap:34px}
</style></head><body>

<!-- samoon: a wide lockup for the band inside the lid -->
<div class="t" id="samoon" style="width:1500px;height:330px">
  <div class="row">
    <svg width="70" height="70" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"><path d="M50 6 L94 50 L50 94 L6 50 Z" /><path d="M50 26 L74 50 L50 74 L26 50 Z" stroke-width="3" /></svg>
    <div class="en" style="font-size:150px">SAMOON</div>
    <svg width="70" height="70" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"><path d="M50 6 L94 50 L50 94 L6 50 Z" /><path d="M50 26 L74 50 L50 74 L26 50 Z" stroke-width="3" /></svg>
  </div>
  <div class="row" style="margin-top:26px; gap:26px">
    <div class="small" style="font-size:44px">MAISON DE BAGDAD</div>
    <div style="width:8px;height:8px;border-radius:50%;background:#fff"></div>
    <div class="ar" style="font-size:58px">صمّون</div>
  </div>
</div>

<!-- istikan: stacked, for the front of the tin -->
<div class="t" id="istikan" style="width:900px;height:760px">
  <svg width="74" height="110" viewBox="0 0 40 60" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M8 4 H32 C 31 14, 26 20, 26 28 C 26 36, 31 42, 30 50 H10 C 9 42, 14 36, 14 28 C 14 20, 9 14, 8 4 Z" /><path d="M1 55 H39" /></svg>
  <div class="en" style="font-size:132px;margin-top:30px">ISTIKAN</div>
  <div class="ar" style="font-size:118px;margin-top:0">استكان</div>
  <div class="rule" style="width:300px;height:3px;margin:26px 0 30px"></div>
  <div class="small" style="font-size:38px">THÉ NOIR · CARDAMOME</div>
  <div class="small" style="font-size:28px;margin-top:18px;opacity:.9">BAGDAD</div>
</div>

<!-- amba: a perfume label -->
<div class="t" id="amba" style="width:600px;height:800px">
  <svg width="70" height="92" viewBox="0 0 60 80" fill="none" stroke="#fff" stroke-width="2.6"><path d="M30 6 C 48 14, 56 34, 52 52 C 48 70, 32 76, 22 72 C 8 66, 4 50, 10 34 C 15 20, 22 12, 30 6 Z" /><path d="M30 6 C 30 2, 33 0, 37 0" /></svg>
  <div class="en" style="font-size:122px;margin-top:30px;font-family:'Playfair Display';font-weight:400;letter-spacing:.16em;padding-left:.16em">AMBA</div>
  <div class="ar" style="font-size:86px;margin-top:6px">عمبة</div>
  <div class="rule" style="width:150px;height:2px;margin:30px 0 28px"></div>
  <div class="small" style="font-size:30px">EAU DE PARFUM</div>
  <div class="small" style="font-size:22px;margin-top:18px;opacity:.9">100 ML · 3.4 FL.OZ</div>
</div>

<!-- dolma: stacked, for the inside of the lid -->
<div class="t" id="dolma" style="width:1500px;height:1000px">
  <svg width="140" height="140" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50 92 C 50 80, 50 70, 50 58 M50 58 C 34 64, 14 58, 8 44 C 16 42, 20 38, 18 30 C 28 32, 34 26, 34 16 C 42 22, 46 20, 50 8 C 54 20, 58 22, 66 16 C 66 26, 72 32, 82 30 C 80 38, 84 42, 92 44 C 86 58, 66 64, 50 58 Z" />
    <path d="M50 58 L 50 20 M50 52 L 28 38 M50 52 L 72 38 M50 44 L 38 28 M50 44 L 62 28" stroke-width="1.6" /></svg>
  <div class="en" style="font-size:170px;margin-top:34px">DOLMA</div>
  <div class="ar" style="font-size:130px;margin-top:4px">دولمة</div>
  <div class="rule" style="width:420px;height:3px;margin:34px 0 34px"></div>
  <div class="small" style="font-size:50px">PRALINES DE BAGDAD</div>
  <div class="small" style="font-size:34px;margin-top:20px;opacity:.9">12 PIÈCES</div>
</div>

<script>
Promise.all([
  document.fonts.load("700 100px 'Aref Ruqaa'", 'صمّون عمبة استكان دولمة'),
  document.fonts.load("600 100px 'Cormorant Garamond'", 'SAMOON'),
  document.fonts.load("500 40px 'Cormorant Garamond'", 'MAISON'),
  document.fonts.load("400 100px 'Playfair Display'", 'AMBA'),
]).then(() => (document.body.dataset.ready = 1));
</script></body></html>
