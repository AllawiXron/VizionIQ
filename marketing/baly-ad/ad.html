<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Baly — سفرطاس الجيل الجديد</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: #0043ff; }
  /* the 3D render (Blender/Cycles) */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(70% 38% at 50% 14%, rgba(120, 160, 255, 0.25) 0%, rgba(120, 160, 255, 0) 70%),
      radial-gradient(95% 78% at 50% 52%, rgba(0, 10, 70, 0) 55%, rgba(0, 10, 70, 0.5) 100%);
  }
  .grain {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0.24; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  .logo { position: absolute; z-index: 10; top: 46px; left: 50%; transform: translateX(-50%); }
  .logo img { height: 74px; display: block; }

  /* headline: Ruqaa, two lines, Iraqi dialect */
  .h1 {
    position: absolute; z-index: 10; top: 150px; left: 0; right: 0; text-align: center; direction: rtl;
    font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 84px; line-height: 1.26; word-spacing: 0.1em;
    text-shadow: 0 8px 30px rgba(0, 12, 80, 0.45);
  }
  .h1 .b { color: #ffe15e; }
  .h1 .dn { position: relative; }

  /* callout to the tag on the handle (the hidden joke, enlarged) */
  .callout { position: absolute; z-index: 10; direction: rtl; font-family: "Alexandria"; }
  .callout .card {
    background: #f1e6cc; color: #2a2116; border-radius: 10px 26px 26px 10px; padding: 14px 20px 14px 18px;
    box-shadow: 0 14px 28px rgba(0, 12, 80, 0.35); font-size: 21px; font-weight: 600; line-height: 1.5; transform: rotate(-3deg);
  }
  .callout .card b { color: #0043ff; font-weight: 800; }
  .callout svg { position: absolute; }

  .foot { position: absolute; z-index: 10; bottom: 36px; left: 0; right: 0; text-align: center; font-family: "Alexandria"; font-weight: 500; font-size: 14px; letter-spacing: 0.06em; line-height: 1.6; color: rgba(255, 255, 255, 0.9); direction: rtl; }
  .foot b { font-weight: 800; color: #ffe15e; letter-spacing: 0; font-size: 17px; }
  .foot small { display: block; direction: ltr; font-family: "IBM Plex Mono"; font-size: 13px; letter-spacing: 0.18em; opacity: .8; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad > [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad > [data-l="bg"], body.m-logo .ad > [data-l="logo"], body.m-txt .ad > [data-l="txt"],
  body.m-tag .ad > [data-l="tag"] { visibility: visible; }
</style>
</head>
<body>
<section class="ad" id="ad">
  <img class="hero" data-l="bg" src="img/hero.png" alt="" />
  <div class="grade" data-l="bg"></div>
  <div class="grain" data-l="bg"></div>

  <div class="logo" data-l="logo"><img src="img/logo-white.svg" alt="بلي" /></div>

  <h1 class="h1" data-l="txt">سفرطاس أمك صار بيه<br><span class="b"><span class="dn" style="top: .2em">تكسي</span> وأكل وبوكس</span></h1>

  <div class="callout" data-l="tag" style="left: 772px; top: 470px; width: 248px">
    <svg style="left: -118px; top: 52px; width: 128px; height: 40px" viewBox="0 0 128 40"><path d="M4 30 C40 32 80 14 124 10" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" /><circle cx="4" cy="30" r="5" fill="#ffe15e" /></svg>
    <div class="card">من: <b>أمك</b><br>إلى: <b>الدوام</b><br>التوصيل: <b>٢٧ دقيقة</b></div>
  </div>

  <div class="foot" data-l="txt"><b>أسهل، أوفر، بَلي يمك</b><small>TAXI · FOOD · BOX · DIGITAL — BALY.IQ</small></div>
</section>
</body>
</html>
