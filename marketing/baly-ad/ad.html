<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Baly — تكسي بنص الليل؟ بَلي.</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: #000a2e; font-family: "Alexandria", sans-serif; }
  /* real photo: Arasat al-Hindiya, Baghdad, at night (graded in photo/grade.py) */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0, 8, 40, 0.75) 0%, rgba(0, 8, 40, 0.35) 30%, rgba(0, 8, 40, 0) 46%),
      linear-gradient(0deg, rgba(0, 8, 40, 0.8) 0%, rgba(0, 8, 40, 0.35) 8%, rgba(0, 8, 40, 0) 15%);
  }
  .grain {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0.22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* headline */
  .q { position: absolute; z-index: 10; top: 92px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 900; font-size: 74px; line-height: 1.3; letter-spacing: -0.01em; }
  .a { position: absolute; z-index: 10; top: 178px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 900; font-size: 210px; line-height: 1.25; color: #ffe15e; letter-spacing: -0.02em; text-shadow: 0 18px 50px rgba(0, 10, 60, 0.45); }

  /* app card pinned above the car */
  .pin { position: absolute; z-index: 10; left: 530px; top: 896px; transform: translateX(-50%); direction: rtl; }
  .card { display: flex; align-items: center; gap: 16px; background: #fff; color: #0a1428; border-radius: 22px; padding: 14px 18px 14px 22px; box-shadow: 0 18px 40px rgba(0, 10, 60, 0.45); white-space: nowrap; }
  .card .ic { width: 58px; height: 58px; border-radius: 16px; background: #0043ff; display: grid; place-items: center; flex: none; }
  .card .ic svg { width: 34px; height: 34px; }
  .card .t b { display: block; font-weight: 800; font-size: 25px; line-height: 1.3; }
  .card .t span { display: block; font-weight: 500; font-size: 18px; color: #4a5672; line-height: 1.4; }
  .card .t span i { font-style: normal; color: #0043ff; font-weight: 700; }
  .card .eta { flex: none; background: #ffe15e; color: #0a1428; border-radius: 14px; padding: 8px 12px; text-align: center; line-height: 1.05; }
  .card .eta b { display: block; font-weight: 900; font-size: 28px; }
  .card .eta small { font-weight: 600; font-size: 14px; }
  .pin .tail { position: absolute; left: 50%; bottom: -12px; width: 26px; height: 26px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 4px; }
  .pin .dot { position: absolute; left: 50%; top: calc(100% + 34px); width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #ffe15e; box-shadow: 0 0 0 8px rgba(255, 225, 94, 0.3), 0 0 0 18px rgba(255, 225, 94, 0.12); }

  /* footer */
  .foot { position: absolute; z-index: 10; left: 56px; right: 56px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
  .foot .brand { display: flex; align-items: center; gap: 22px; }
  .foot .brand img { height: 66px; }
  .foot .brand span { font-weight: 600; font-size: 22px; color: rgba(255, 255, 255, 0.92); padding-right: 22px; border-right: 2px solid rgba(255, 255, 255, 0.35); line-height: 1.5; }
  .foot .cta { background: #ffe15e; color: #0a1428; font-weight: 800; font-size: 22px; padding: 14px 26px; border-radius: 16px; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad [data-l="bg"], body.m-logo .ad [data-l="logo"], body.m-txt .ad [data-l="txt"],
  body.m-card .ad [data-l="card"] { visibility: visible; }
</style>
</head>
<body>
<section class="ad" id="ad">
  <img class="hero" data-l="bg" src="img/hero.png" alt="" />
  <div class="shade" data-l="bg"></div>
  <div class="grain" data-l="bg"></div>

  <div class="q" data-l="txt">تكسي بنص الليل؟</div>
  <div class="a" data-l="txt">بَلي.</div>

  <div class="pin" data-l="card">
    <div class="card">
      <div class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11h.5A1.5 1.5 0 0 1 21 12.5V17a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1v-4.5A1.5 1.5 0 0 1 4.5 11zm2.1 0h9.8l-1.2-3.3a.6.6 0 0 0-.6-.4H8.9a.6.6 0 0 0-.6.4zM6.5 15.2a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm11 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg></div>
      <div class="t"><b>كابتنك بالطريق</b><span>سوبر · <i>٣٬٠٠٠ د</i> · سعر ثابت</span></div>
      <div class="eta"><b>٣</b><small>دقائق</small></div>
    </div>
    <i class="tail"></i>
    <i class="dot"></i>
  </div>

  <div class="foot">
    <div class="brand"><img data-l="logo" src="img/logo-white.svg" alt="بلي" /><span data-l="txt">أسهل، أوفر، بَلي يمك</span></div>
    <div class="cta" data-l="txt">حمّل التطبيق</div>
  </div>
</section>
</body>
</html>
