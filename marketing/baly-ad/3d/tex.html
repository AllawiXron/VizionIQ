<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/src.css"><style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000}
.t{position:relative;overflow:hidden;margin-bottom:16px}
/* enamel band: white with a ring of flowers, cobalt edge lines (wraps around a tier) */
#band{width:2048px;height:330px;background:#f7f5ef}
#band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b2bb8 0 18px,transparent 18px calc(100% - 18px),#0b2bb8 calc(100% - 18px))}
#band svg{position:absolute;left:0;top:6px}
/* paper tag */
#tag{width:600px;height:300px;background:#e9dcc0;border-radius:18px 60px 60px 18px;color:#2a2116;direction:rtl;font-family:"Alexandria"}
#tag .hole{position:absolute;right:34px;top:126px;width:44px;height:44px;border-radius:50%;background:#7a6a50;box-shadow:inset 0 0 0 9px #d8c8a5}
#tag .l{position:absolute;right:110px;left:24px;font-size:40px;font-weight:600;line-height:1.35;white-space:nowrap}
#tag .l b{color:#0043ff;font-weight:800}
#tag::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .5 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
/* gift card */
#card{width:856px;height:540px;border-radius:44px;background:linear-gradient(135deg,#1a5cff 0%,#0043ff 55%,#0030c8 100%);color:#fff;font-family:"Alexandria"}
#card img{position:absolute;right:60px;top:56px;height:150px}
#card .k{position:absolute;left:64px;bottom:60px;font-family:"IBM Plex Mono";font-size:44px;letter-spacing:.14em}
#card .g{position:absolute;left:64px;top:64px;font-weight:800;font-size:64px;letter-spacing:.1em}
#card .chip{position:absolute;left:64px;top:190px;width:120px;height:90px;border-radius:16px;background:linear-gradient(135deg,#ffe15e,#e9b93a)}
/* car door decal + roof sign */
#decal{width:600px;height:240px;background:#0043ff;display:flex;align-items:center;justify-content:center}
#decal img{height:150px}
#sign{width:480px;height:160px;background:#ffe15e;display:flex;align-items:center;justify-content:center}
#sign img{height:110px}
/* parcel tape */
#tape{width:256px;height:2048px;background:#0043ff;display:flex;flex-direction:column;align-items:center;justify-content:space-around}
#tape img{width:180px;transform:rotate(-90deg)}
/* parcel face */
#pface{width:1024px;height:1024px;background:#f2f1ec}
#pface img{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:520px}
</style></head><body>
<div class="t" id="band"><svg width="2048" height="320" viewBox="0 0 2048 320">
  <defs><g id="fl">
    <g fill="#d6262f"><circle cx="0" cy="-34" r="26"/><circle cx="32" cy="-10" r="26"/><circle cx="20" cy="28" r="26"/><circle cx="-20" cy="28" r="26"/><circle cx="-32" cy="-10" r="26"/></g>
    <circle r="18" fill="#f2b632"/><circle r="8" fill="#a8161e"/>
    <path d="M40 30 C80 40 100 80 92 110 C70 90 52 70 40 30Z" fill="#2f8a3a"/><path d="M-40 30 C-80 40 -100 80 -92 110 C-70 90 -52 70 -40 30Z" fill="#2f8a3a"/>
  </g></defs>
  <g transform="translate(128 150)"><use href="#fl"/></g><g transform="translate(384 170) scale(.7)"><use href="#fl"/></g>
  <g transform="translate(640 150)"><use href="#fl"/></g><g transform="translate(896 170) scale(.7)"><use href="#fl"/></g>
  <g transform="translate(1152 150)"><use href="#fl"/></g><g transform="translate(1408 170) scale(.7)"><use href="#fl"/></g>
  <g transform="translate(1664 150)"><use href="#fl"/></g><g transform="translate(1920 170) scale(.7)"><use href="#fl"/></g>
</svg></div>
<div class="t" id="tag"><i class="hole"></i>
  <div class="l" style="top:34px">من: <b>أمك</b></div>
  <div class="l" style="top:112px">إلى: <b>الدوام</b></div>
  <div class="l" style="top:190px">التوصيل: <b>٢٧ دقيقة</b></div>
</div>
<div class="t" id="card"><img src="../img/logo-white.svg"><div class="g">GIFT</div><i class="chip"></i><div class="k">•••• 4218</div></div>
<div class="t" id="decal"><img src="../img/logo-white.svg"></div>
<div class="t" id="sign"><img src="../img/logo-blue.svg"></div>
<div class="t" id="tape"><img src="../img/logo-white.svg"><img src="../img/logo-white.svg"><img src="../img/logo-white.svg"><img src="../img/logo-white.svg"><img src="../img/logo-white.svg"></div>
<div class="t" id="pface"><img src="../img/logo-blue.svg"></div>
</body></html>
