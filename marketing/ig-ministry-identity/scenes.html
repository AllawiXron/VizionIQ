<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Gate trace</title>
<style>
  /* The idea slide's photo: the real gate (Pergamon Museum) with the parts the mark keeps traced over it in gold, the
     two towers, the wall between them and the bands of the arch. Measured on photos/gate-front.jpg (3840x2739);
     the frame shows a 4:5 crop of it. scenes.cjs prints it at 1.5x to plates/gate-front.png. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .f { width: 1080px; height: 1350px; position: relative; overflow: hidden; }
  .ph { position: absolute; left: 0; top: 0; width: 3840px; height: 2739px; transform-origin: 0 0;
    background: url(photos/gate-front.jpg) 0 0 / 100% 100%; transform: scale(0.49288) translateX(-750px); }
</style>
</head>
<body>
<section class="f" data-name="gate-front"><div class="ph"><svg width="3840" height="2739" id="trace"></svg></div></section>
<script>
const cx = 1840, cy = 1515, G = 2390;
const arc = (r) => `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`;
const d = [`M 500 ${G} V 400 H 1340 V ${G}`, `M 3300 530 H 2400 V ${G}`, `M 1390 ${G} V 1030 H 2220 V ${G}`,
  `M ${cx - 210} ${G} V ${cy} A 210 210 0 0 1 ${cx + 210} ${cy} V ${G}`, arc(268), arc(325), `M 500 ${G} H 3300`].join(' ');
document.getElementById('trace').innerHTML = `
  <defs><filter id="gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter></defs>
  <rect width="3840" height="2739" fill="#08102a" opacity=".22"/>
  <path d="${d}" fill="none" stroke="#000" stroke-width="10" opacity=".45" filter="url(#gl)" transform="translate(0,4)"/>
  <path d="${d}" fill="none" stroke="#e8c46a" stroke-width="6.5"/>`;
</script>
</body>
</html>
