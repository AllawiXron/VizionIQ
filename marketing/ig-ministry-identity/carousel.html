<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوابة عشتار</title>
<style>
  /* The identity carousel, 10 slides of 1080x1350 (render.cjs prints them at 1.5x). Each slide is one render from
     shots.py, with its words placed in that photo's empty space. carousel.html?preview uses the quick renders. */
  @font-face { font-family: 'DG Sahabah'; src: url(../brand-fonts/DG-Sahabah-Reg.ttf) format('truetype'); font-weight: 400; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; }
  .s { width: 1080px; height: 1350px; position: relative; overflow: hidden; margin: 0 0 30px; background: #bdb7ad center / cover no-repeat;
    font: 400 38px/1.35 'DG Sahabah', sans-serif; font-synthesis: none; }
  .s::after { content: ""; position: absolute; inset: 0; background: url(grain.png); mix-blend-mode: soft-light; opacity: .55; pointer-events: none; }
  .t { position: absolute; }
  .t h1 { font: 400 104px/1.18 'DG Sahabah'; }
  .t h2 { font: 400 84px/1.2 'DG Sahabah'; }
  .t p { margin-top: 18px; opacity: .82; }
  .ink { color: #13203f; } .paper { color: #f3ece0; }
</style>
</head>
<body>
<script>
const P = location.search.includes('preview') ? '-preview' : '';
const r = (n) => `renders/${n}${P}.png`;
const S = [
  // [image, text html, position css, colour class, background position]
  [r('sign'), `<h1>بوابة عشتار<br>بوابة العراق الرقمية</h1><p>مقترح هوية بصرية قدمته لمسابقة<br>وزارة الاقتصاد الرقمي والحوكمة</p>`, 'right:84px;bottom:150px', 'ink'],
  [r('foil'), `<h2>البوابة صارت شعار</h2><p>البرجين والجدار من بوابة عشتار، والقوسين<br>الذهبيين حول المدخل موجات اتصال</p>`, 'right:80px;bottom:110px', 'ink'],
  [r('grid'), `<h2>رسمته على شبكة</h2><p>البرج ١١ مربع والجدار ٢٣<br>وكل الشرفات بنفس القياس</p>`, 'right:80px;top:110px', 'ink'],
  [r('swatches'), `<h2>أربع ألوان<br>من البوابة نفسها</h2><p>أزرق بابل من الطابوق المزجج<br>والذهبي للقوسين والإبراز وبس</p>`, 'right:80px;top:90px', 'ink'],
  [r('letterhead'), `<h2>الكتب الرسمية</h2><p>الشعار فوق، وشريط الشرفات يحد الورقة</p>`, 'right:84px;bottom:120px', 'ink'],
  [r('stationery'), `<h2>الورق والظرف<br>وبطاقة العمل</h2>`, 'left:72px;bottom:90px;text-align:left', 'ink'],
  [r('badge'), `<h2>هوية الموظف</h2><p>تتعلق بشريط أزرق عليه الشرفات</p>`, 'right:80px;bottom:110px', 'ink'],
  [r('phone'), `<h2>شاشة البدء بالتطبيق</h2>`, 'right:80px;bottom:84px', 'ink'],
  ['../ministry-identity/out/fig/web-1.jpg', `<h2>الموقع</h2><p>تبدي بالبحث عن الخدمة<br>وبعدها الخدمات الأكثر طلب</p>`, 'right:80px;bottom:120px', 'ink', '0% 50%'],
  [r('macro'), `<p style="opacity:.9;margin:0">مقترح قدمته للمسابقة، مو الهوية الرسمية للوزارة</p><h2 style="margin-top:10px">علي احمد شهاب</h2><p style="direction:ltr;text-align:right;margin-top:6px">allawi.psd</p>`, 'right:80px;bottom:96px', 'ink'],
];
S.forEach(([img, html, pos, col, bp]) => document.write(
  `<section class="s" style="background-image:url(${img})${bp ? `;background-position:${bp}` : ''}"><div class="t ${col}" style="${pos}">${html}</div></section>`));
</script>
</body>
</html>
