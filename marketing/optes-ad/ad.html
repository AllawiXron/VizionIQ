<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>OPTES 1.0 Flash — سريع، ذكي، وخفيف على رصيدك؟ فلاش.</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root { --gold: #e9c46a; --gold-2: #c9a24a; --blue: #2f6bff; --black: #03050c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: var(--black); font-family: "Alexandria", sans-serif; }
  /* CC0 lightning photo, cropped and graded in photo/grade.py */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(3, 5, 12, 0.78) 0%, rgba(3, 5, 12, 0.45) 18%, rgba(3, 5, 12, 0) 32%),
      linear-gradient(0deg, rgba(3, 5, 12, 0.9) 0%, rgba(3, 5, 12, 0.5) 8%, rgba(3, 5, 12, 0) 16%); }
  .grain {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0.2; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* headline: their launch line, then the question and the one-word answer */
  .kick { position: absolute; z-index: 10; top: 58px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px; direction: rtl; color: var(--gold); font-weight: 600; font-size: 24px; letter-spacing: 0.02em; }
  .kick i { width: 56px; height: 2px; background: var(--gold); opacity: 0.7; }
  .q { position: absolute; z-index: 10; top: 98px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 700; font-size: 56px; line-height: 1.35; white-space: nowrap; }
  .a { position: absolute; z-index: 10; top: 200px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 900; font-size: 204px; line-height: 1.25; white-space: nowrap; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #fbe7a6 0%, var(--gold) 45%, var(--gold-2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 16px 40px rgba(0, 0, 0, 0.55)); }

  /* the new model, pinned onto the bolt: their own wording */
  .pin { position: absolute; z-index: 10; left: 412px; top: 652px; direction: rtl; }
  .card { display: flex; align-items: center; gap: 16px; background: #fff; color: #0b0d14; border-radius: 22px; padding: 14px 16px 14px 18px; box-shadow: 0 22px 50px rgba(0, 10, 40, 0.6); white-space: nowrap; }
  .card .icon { width: 64px; height: 64px; border-radius: 16px; flex: none; display: block; }
  .card .t small { display: block; font-weight: 600; font-size: 15px; color: var(--blue); line-height: 1.3; }
  .card .t b { display: block; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 27px; line-height: 1.25; direction: ltr; text-align: right; }
  .card .t span { display: block; font-weight: 500; font-size: 16px; color: #5d6170; line-height: 1.4; }
  .card .new { flex: none; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--black); color: var(--gold); border-radius: 14px; padding: 8px 14px; font-weight: 700; font-size: 16px; }
  .card .new svg { width: 26px; height: 26px; }
  .pin .tail { position: absolute; right: calc(100% - 14px); top: 32px; width: 26px; height: 26px; background: #fff; transform: rotate(45deg); border-radius: 4px; }
  .pin .dot { position: absolute; right: calc(100% + 26px); top: 36px; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 8px rgba(233, 196, 106, 0.3), 0 0 0 18px rgba(233, 196, 106, 0.12); }

  /* footer */
  .foot { position: absolute; z-index: 10; left: 56px; right: 56px; bottom: 46px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
  .foot .brand { display: flex; align-items: center; gap: 22px; }
  .foot .word { font-family: "Manrope", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: 0.06em; direction: ltr; line-height: 1; }
  .foot .brand span { font-family: "Manrope", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.16em; line-height: 1.7; color: rgba(255, 255, 255, 0.8); direction: ltr; text-align: left;
    padding-right: 22px; border-right: 2px solid rgba(233, 196, 106, 0.55); }
  .foot .brand span em { font-style: normal; color: var(--gold); letter-spacing: 0.04em; font-size: 17px; }
  .foot .cta { background: linear-gradient(180deg, #f3d88a 0%, var(--gold) 100%); color: var(--black); font-weight: 800; font-size: 22px; padding: 14px 28px; border-radius: 16px; display: flex; align-items: center; gap: 10px; }
  .foot .cta svg { width: 20px; height: 20px; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad [data-l="bg"], body.m-card .ad [data-l="card"], body.m-txt .ad [data-l="txt"],
  body.m-logo .ad [data-l="logo"] { visibility: visible; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs><symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.6h6.3L9.6 22l9.9-12.4h-6.4z" fill="currentColor" /></symbol></defs>
</svg>
<section class="ad" id="ad">
  <img class="hero" data-l="bg" src="img/hero.png" alt="" />
  <div class="shade" data-l="bg"></div>
  <div class="grain" data-l="bg"></div>

  <div class="kick" data-l="txt"><i></i>إطلاق النموذج الجديد<i></i></div>
  <div class="q" data-l="txt">سريع، ذكي، وخفيف على رصيدك؟</div>
  <div class="a" data-l="txt">فلاش.</div>

  <div class="pin" data-l="card">
    <i class="dot"></i>
    <i class="tail"></i>
    <div class="card">
      <img class="icon" src="img/app-icon.png" alt="" />
      <div class="t"><small>متاح لجميع المشتركين</small><b>OPTES 1.0 Flash</b><span>سرعة فائقة، جودة عالية، استهلاك أقل</span></div>
      <div class="new"><svg><use href="#bolt" /></svg>جديد</div>
    </div>
  </div>

  <div class="foot">
    <div class="brand"><div class="word" data-l="logo">OPTES</div><span data-l="txt">AI FOR EVERYONE<br><em>optes3.com</em></span></div>
    <div class="cta" data-l="txt"><svg><use href="#bolt" /></svg>جرّبه هسة</div>
  </div>
</section>
</body>
</html>
