<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>OPTES 1.0 Flash — قبل لا ترمش، يجاوبك.</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root { --gold: #f2c962; --black: #02040c; --cyan: #59c8ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: var(--black); font-family: "Alexandria", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* their mascot (from their own Flash post): upscaled, cut out, rim-lit in photo/mascot.py */
  .mascot { position: absolute; z-index: 4; left: 390px; top: 56px; width: 740px;
    -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 97%); mask-image: linear-gradient(180deg, #000 72%, transparent 97%);
    filter: drop-shadow(0 0 26px rgba(0, 2, 10, 0.7)); }
  /* the headphone's "O" blooms: OPTES' mark, the centre of the rings */
  .bloom { position: absolute; z-index: 5; left: 923px; top: 338px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(120, 210, 255, 0.55), rgba(60, 140, 255, 0.18) 45%, rgba(60, 140, 255, 0) 100%); }
  .shade { position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background:
      linear-gradient(0deg, rgba(2, 4, 12, 0.96) 0%, rgba(2, 4, 12, 0.85) 26%, rgba(2, 4, 12, 0.35) 40%, rgba(2, 4, 12, 0) 52%),
      linear-gradient(90deg, rgba(2, 4, 12, 0.55) 0%, rgba(2, 4, 12, 0.2) 30%, rgba(2, 4, 12, 0) 45%); }
  .sweep { position: absolute; z-index: 7; left: 0; top: 0; width: 1080px; height: 1350px; pointer-events: none; mix-blend-mode: screen; }
  .grain {
    position: absolute; inset: 0; z-index: 30; pointer-events: none; opacity: 0.16; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* metal type */
  .chrome { background: linear-gradient(180deg, #ffffff 0%, #eef2fa 30%, #a7b0c6 47%, #566079 52%, #c4cde2 63%, #ffffff 82%, #b3bcd2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .goldt { background: linear-gradient(180deg, #fff8e0 0%, #fbe08f 26%, #e7ae44 48%, #a26a1a 53%, #f0c55e 68%, #fff1c4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* top-left: the punchline, beside her eyes */
  .kick { position: absolute; z-index: 20; left: 56px; top: 64px; height: 46px; padding: 0 18px; border-radius: 99px; display: flex; align-items: center; gap: 10px; direction: rtl;
    border: 1px solid rgba(242, 201, 98, 0.55); background: linear-gradient(180deg, rgba(242, 201, 98, 0.16), rgba(242, 201, 98, 0.04)); color: var(--gold); font-weight: 600; font-size: 20px; }
  .kick svg { width: 18px; height: 18px; color: var(--gold); }
  .q { position: absolute; z-index: 20; left: 56px; top: 138px; direction: rtl; font-weight: 800; font-size: 56px; line-height: 1.3; white-space: nowrap;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6)); }
  .a { position: absolute; z-index: 20; left: 50px; top: 196px; direction: rtl; font-weight: 900; font-size: 112px; line-height: 1.35; white-space: nowrap;
    filter: drop-shadow(0 0 22px rgba(245, 180, 60, 0.35)) drop-shadow(0 10px 26px rgba(0, 0, 0, 0.6)); }

  /* lower-left: the product name */
  .title { position: absolute; z-index: 20; left: 52px; top: 540px; direction: ltr; font-family: "Manrope", sans-serif; font-weight: 800; line-height: 0.92; }
  .title .t1 { display: block; font-size: 126px; letter-spacing: 0.015em;
    filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.3)) drop-shadow(0 12px 22px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 26px rgba(60, 130, 255, 0.35)); }
  .title .row { display: flex; align-items: flex-end; gap: 18px; margin-top: 6px; }
  .title .ver { font-size: 82px; letter-spacing: 0.01em; padding-bottom: 10px;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 20px rgba(60, 130, 255, 0.3)); }
  .title .fl { font-size: 150px; letter-spacing: -0.01em; transform: skewX(-9deg); transform-origin: bottom left; padding-right: 10px;
    filter: drop-shadow(0 0 28px rgba(245, 180, 60, 0.45)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7)); }
  .title .bolt { width: 74px; height: 120px; margin-left: -6px; padding-bottom: 14px; filter: drop-shadow(0 0 18px rgba(245, 190, 70, 0.8)); }
  .tag { position: absolute; z-index: 20; left: 58px; top: 862px; display: flex; align-items: center; gap: 14px; direction: rtl; font-weight: 500; font-size: 22px; color: rgba(255, 255, 255, 0.82); }
  .tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

  /* feature cards: their four promises */
  .cards { position: absolute; z-index: 20; left: 56px; right: 56px; top: 946px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; direction: rtl; }
  .c { position: relative; height: 132px; border-radius: 20px; padding: 18px 18px 14px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 60%, rgba(60, 130, 255, 0.06) 100%);
    border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 18px 34px rgba(0, 0, 0, 0.35); backdrop-filter: blur(10px); }
  .c::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 2px; background: linear-gradient(90deg, rgba(242, 201, 98, 0), rgba(242, 201, 98, 0.9), rgba(242, 201, 98, 0)); }
  .c .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(242, 201, 98, 0.1); border: 1px solid rgba(242, 201, 98, 0.45); color: var(--gold); }
  .c .ic svg { width: 26px; height: 26px; filter: drop-shadow(0 0 6px rgba(242, 201, 98, 0.6)); }
  .c b { font-weight: 700; font-size: 21px; line-height: 1.3; white-space: nowrap; }
  .c small { position: absolute; left: 18px; top: 22px; font-family: "Manrope", sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; color: rgba(255, 255, 255, 0.42); direction: ltr; }

  /* the four models behind it (their claim) */
  .models { position: absolute; z-index: 20; left: 56px; right: 56px; top: 1100px; height: 70px; border-radius: 18px; padding: 0 12px 0 22px; display: flex; align-items: center; justify-content: space-between; direction: rtl;
    background: linear-gradient(90deg, rgba(242, 201, 98, 0.1), rgba(255, 255, 255, 0.03)); border: 1px solid rgba(242, 201, 98, 0.3); }
  .models .lb { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 19px; color: var(--gold); white-space: nowrap; }
  .models .lb svg { width: 22px; height: 22px; }
  .models .ch { display: flex; gap: 8px; direction: ltr; }
  .models .ch span { height: 42px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 8px; font-family: "Manrope", sans-serif; font-weight: 700; font-size: 15px; color: rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }
  .models .ch span i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }

  /* footer */
  .foot { position: absolute; z-index: 20; left: 56px; right: 56px; bottom: 50px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
  .foot .brand { display: flex; align-items: center; gap: 22px; }
  .foot .word { font-family: "Manrope", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: 0.06em; direction: ltr; line-height: 1; }
  .foot .brand span { font-family: "Manrope", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.18em; line-height: 1.75; color: rgba(255, 255, 255, 0.72); direction: ltr; text-align: left;
    padding-right: 22px; border-right: 1px solid rgba(242, 201, 98, 0.5); }
  .foot .brand span em { font-style: normal; color: var(--gold); letter-spacing: 0.05em; font-size: 16px; }
  .foot .cta { background: linear-gradient(180deg, #fbe39a 0%, #e9b649 100%); color: var(--black); font-weight: 800; font-size: 22px; padding: 15px 30px; border-radius: 99px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 0 0 1px rgba(255, 240, 200, 0.6) inset, 0 12px 30px rgba(233, 170, 60, 0.35); }
  .foot .cta svg { width: 20px; height: 20px; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad [data-l="bg"], body.m-mascot .ad [data-l="mascot"], body.m-glow .ad [data-l="glow"], body.m-shade .ad [data-l="shade"],
  body.m-cards .ad [data-l="cards"], body.m-grain .ad [data-l="grain"],
  body.m-txt .ad [data-l="txt"], body.m-logo .ad [data-l="logo"] { visibility: visible; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.6h6.3L9.6 22l9.9-12.4h-6.4z" fill="currentColor" /></symbol>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6" /><stop offset=".35" stop-color="#f8d677" /><stop offset=".6" stop-color="#d99a35" /><stop offset="1" stop-color="#f5cf6c" /></linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2c962" stop-opacity="0" /><stop offset=".45" stop-color="#ffd98a" stop-opacity=".9" /><stop offset=".8" stop-color="#8fd8ff" stop-opacity=".7" /><stop offset="1" stop-color="#59c8ff" stop-opacity="0" /></linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="6" /></filter>
  </defs>
</svg>
<section class="ad" id="ad">
  <img class="bg" data-l="bg" src="img/bg.png" alt="" />
  <img class="mascot" data-l="mascot" src="img/mascot.png" alt="" />
  <div class="bloom" data-l="glow"></div>
  <div class="shade" data-l="shade"></div>
  <!-- one gold light sweep in front of her, the "flash" passing through -->
  <svg class="sweep" data-l="glow" viewBox="0 0 1080 1350">
    <path d="M300 905 C 520 860, 760 760, 1100 640" stroke="url(#sw)" stroke-width="10" fill="none" filter="url(#soft)" />
    <path d="M300 905 C 520 860, 760 760, 1100 640" stroke="url(#sw)" stroke-width="2.2" fill="none" />
  </svg>
  <div class="grain" data-l="grain"></div>

  <div class="kick" data-l="txt"><svg><use href="#bolt" /></svg>إطلاق النموذج الجديد</div>
  <div class="q" data-l="txt">قبل لا ترمش،</div>
  <div class="a goldt" data-l="txt">يجاوبك.</div>

  <div class="title" data-l="logo">
    <span class="t1 chrome">OPTES</span>
    <div class="row"><span class="ver chrome">1.0</span><span class="fl goldt">Flash</span><svg class="bolt" viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.6h6.3L9.6 22l9.9-12.4h-6.4z" fill="url(#gold)" /></svg></div>
  </div>
  <div class="tag" data-l="txt">سرعة فائقة<i></i>جودة عالية<i></i>استهلاك أقل</div>

  <div class="cards" data-l="cards">
    <div class="c"><div class="ic"><svg><use href="#bolt" /></svg></div><small>FASTER</small><b>استجابات أسرع</b></div>
    <div class="c"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5a3 3 0 0 0-3 3 3 3 0 0 0-2 5.3A3 3 0 0 0 7 17a2.5 2.5 0 0 0 5 .5V5.5a2 2 0 0 0-2.5-2z" /><path d="M14.5 3.5a3 3 0 0 1 3 3 3 3 0 0 1 2 5.3A3 3 0 0 1 17 17a2.5 2.5 0 0 1-5 .5" /></svg></div><small>SMARTER</small><b>ذكاء متقدم</b></div>
    <div class="c"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.5" rx="7" ry="3" /><path d="M5 6.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" /><path d="M5 11.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" /></svg></div><small>LOWER COST</small><b>استهلاك أرخص</b></div>
    <div class="c"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2" /><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5" /><circle cx="17" cy="9" r="2.6" /><path d="M16 14.2c2.6-.2 4.6 1.4 5 4.3" /></svg></div><small>ALL PLANS</small><b>لجميع المشتركين</b></div>
  </div>

  <div class="models" data-l="cards">
    <div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8 19.5 6v5.6c0 4.6-3.2 8.3-7.5 9.6-4.3-1.3-7.5-5-7.5-9.6V6z" /><path d="m8.6 12 2.4 2.4 4.6-4.8" stroke-linecap="round" /></svg>مدعوم بأربعة نماذج متقدمة</div>
    <div class="ch"><span style="--c:#e8865f"><i></i>Claude Opus 5.5</span><span style="--c:#e8865f"><i></i>Claude Sonnet 5.5</span><span style="--c:#4d7cff"><i></i>DeepSeek</span><span style="--c:#8b6cff"><i></i>Qwen</span></div>
  </div>

  <div class="foot">
    <div class="brand"><div class="word" data-l="logo">OPTES</div><span data-l="txt">AI FOR EVERYONE<br><em>optes3.com</em></span></div>
    <div class="cta" data-l="txt"><svg><use href="#bolt" /></svg>جرّبه هسة</div>
  </div>
</section>
</body>
</html>
