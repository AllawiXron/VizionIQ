<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Sahabah; src: url(../brand-fonts/DG-Sahabah-Reg.ttf); font-weight: 400; }
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#111; display:flex; gap:30px; padding:30px; width:4600px; font-family:Sahabah, sans-serif; font-weight:400; font-synthesis:none }
  .art { position:relative; width:1080px; height:1350px; overflow:hidden; color:#fff6ea }
  .art > * { position:absolute }
  .plate { inset:0; width:1080px; height:1350px }
  .t { direction:rtl; white-space:nowrap; line-height:1.05; text-shadow:0 3px 18px rgba(20,5,0,.5) }
  .s { direction:rtl; font-size:46px; line-height:1.35; color:#f0e2cf; text-shadow:0 2px 10px rgba(20,5,0,.5) }
  .lab { left:24px; top:20px; font:600 40px sans-serif; color:#fff; background:#000; padding:4px 14px; direction:ltr; z-index:9 }
  .grain { inset:0; background:url(../ig-highlights/assets/img/grain.png) 0 0/512px; mix-blend-mode:overlay; opacity:.1 }
</style>
</head>
<body>
<!-- A: one big line across the top, one small line under it, nothing else -->
<div class="art" id="optA"><img class="plate" src="img/plate-chameleon-1.png" alt="">
  <div class="t" style="left:0;right:0;top:230px;text-align:center;font-size:230px">غيرت لوني</div>
  <div class="s" style="left:0;right:0;top:500px;text-align:center">الصفحة بشكلها الجديد</div>
  <div class="grain"></div><div class="lab">A</div></div>
<!-- B: headline set right, stacked big, small line under, a lot of air -->
<div class="art" id="optB"><img class="plate" src="img/plate-chameleon-1.png" alt="">
  <div class="t" style="right:80px;top:170px;text-align:right;font-size:200px">غيرت<br>لوني</div>
  <div class="s" style="right:84px;top:620px;text-align:right">الصفحة بشكلها الجديد</div>
  <div class="grain"></div><div class="lab">B</div></div>
<!-- C: small line on top, the headline huge right above the animal -->
<div class="art" id="optC"><img class="plate" src="img/plate-chameleon-1.png" alt="">
  <div class="s" style="left:0;right:0;top:300px;text-align:center">الصفحة بشكلها الجديد</div>
  <div class="t" style="left:0;right:0;top:400px;text-align:center;font-size:215px">غيرت لوني</div>
  <div class="grain"></div><div class="lab">C</div></div>
<script>document.fonts.load("200px Sahabah", 'غيرت').then(() => setTimeout(() => { document.body.dataset.ready = '1'; }, 300));</script>
</body>
</html>
