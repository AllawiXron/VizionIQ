<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Sahabah; src: url(../brand-fonts/DG-Sahabah-Reg.ttf); font-weight: 400; }
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#111; display:flex; gap:40px; padding:40px; width:3500px; font-family:Sahabah, sans-serif; font-weight:400; font-synthesis:none }
  .art { position:relative; width:1080px; height:1350px; overflow:hidden; color:#f1dfc2 }
  .art > * { position:absolute }
  .plate { inset:0; width:1080px; height:1350px }

  /* a warm light thrown on the backdrop behind the subject, broken up by the paper so it is not an even disc */
  .lamp { inset:0; background:radial-gradient(ellipse 46% 38% at var(--lx) var(--ly), rgba(255,118,40,.55), rgba(255,118,40,0) 70%);
    mix-blend-mode:screen; -webkit-mask:url(../ig-highlights/assets/img/newsprint.jpg) var(--mx) var(--my)/1800px; mask:url(../ig-highlights/assets/img/newsprint.jpg) var(--mx) var(--my)/1800px }

  /* one headline in two lines and one quiet line under it; the orange comes from the photo */
  .head { right:76px; direction:rtl; text-align:right; white-space:nowrap; font-size:132px; line-height:1.12; color:#f4e5cc }
  .head span { display:block }
  .line { right:80px; direction:rtl; text-align:right; font-size:42px; line-height:1.4; color:#e3cba8 }
  .wm { left:70px; top:62px; font-size:60px; line-height:1; color:#f3e3c8; direction:rtl; white-space:nowrap; z-index:5 }
  .wm .h { position:absolute; width:.19em; height:.19em; border:.032em solid currentColor; background:#2a1007 }
  .handle { font-size:32px; color:#e3cba8; direction:ltr; opacity:.85 }

  /* one finish over everything: edges falling off and a fine grain, so the type sits in the photograph */
  .vig { inset:0; background:radial-gradient(ellipse 80% 75% at 55% 55%, rgba(0,0,0,0) 55%, rgba(12,4,0,.55) 100%); z-index:8 }
  .grain { inset:0; background:url(../ig-highlights/assets/img/grain.png) 0 0/512px; mix-blend-mode:overlay; opacity:.12; z-index:9 }

  #s1 { --lx:40%; --ly:66%; --mx:-300px; --my:-200px }
  #s1 .head { top:190px } #s1 .line { top:505px }
  #s2 { --lx:30%; --ly:62%; --mx:-900px; --my:-500px }
  #s2 .head { top:150px } #s2 .line { top:465px }
  #s3 { --lx:40%; --ly:74%; --mx:-600px; --my:-1000px }
  #s3 .head { top:220px } #s3 .line { top:535px }
  .handle { left:74px; bottom:56px }
</style>
</head>
<body>

<div class="art" id="s1">
  <img class="plate" src="img/plate-chameleon-1.png" alt="">
  <div class="lamp"></div>
  <div class="head">غيرت<span>لوني</span></div>
  <div class="line">الصفحة بشكلها الجديد</div>
  <span class="wm"><span class="t">عـــــــلاوي</span><span class="h"></span></span>
  <div class="handle">allawi.psd</div>
  <div class="vig"></div><div class="grain"></div>
</div>

<div class="art" id="s2">
  <img class="plate" src="img/plate-chameleon-2.png" alt="">
  <div class="lamp"></div>
  <div class="head">شنو اسوي<span>هنا</span></div>
  <div class="line">بوستات، اعلانات، ريلز موشن وهويات</div>
  <span class="wm"><span class="t">عـــــــلاوي</span><span class="h"></span></span>
  <div class="handle">allawi.psd</div>
  <div class="vig"></div><div class="grain"></div>
</div>

<div class="art" id="s3">
  <img class="plate" src="img/plate-chameleon-3.png" alt="">
  <div class="lamp"></div>
  <div class="head">دزلي<span>بالخاص</span></div>
  <div class="line">كلي شنو تبيع، وارجعلك بفكرة</div>
  <span class="wm"><span class="t">عـــــــلاوي</span><span class="h"></span></span>
  <div class="handle">allawi.psd</div>
  <div class="vig"></div><div class="grain"></div>
</div>

<script>
// the wordmark's handle sits on the middle of the stretched kashida
const imgs = [...document.images].map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }));
Promise.all([document.fonts.load("200px Sahabah", 'علاوي'), ...imgs]).then(() => document.fonts.ready).then(() => {
  const c = document.createElement('canvas'); c.width = 400; c.height = 400;
  const x = c.getContext('2d'); x.font = '200px Sahabah'; x.fillText('ـــــ', 20, 250);
  const d = x.getImageData(150, 0, 1, 400).data; let lo = -1, hi = -1;
  for (let y = 0; y < 400; y++) if (d[y * 4 + 3] > 128) { if (lo < 0) lo = y; hi = y; }
  const K = ((lo + hi) / 2 - 250) / 200;
  document.querySelectorAll('.wm').forEach((el) => {
    const t = el.querySelector('.t'), h = el.querySelector('.h'), fs = parseFloat(getComputedStyle(el).fontSize);
    const r = document.createRange(); r.setStart(t.firstChild, 1); r.setEnd(t.firstChild, 9);
    const k = r.getBoundingClientRect(), box = el.getBoundingClientRect();
    const m = document.createElement('span'); m.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline'; t.appendChild(m);
    const base = m.getBoundingClientRect().top - box.top; m.remove();
    h.style.left = (k.left - box.left + k.width / 2 - fs * .095) + 'px';
    h.style.top = (base + fs * K - fs * .095) + 'px';
  });
  setTimeout(() => { document.body.dataset.ready = '1'; }, 300);
});
</script>
</body>
</html>
