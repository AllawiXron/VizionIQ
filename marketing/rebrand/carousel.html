<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Sahabah; src: url(../brand-fonts/DG-Sahabah-Reg.ttf); font-weight: 400; }
  /* Markazi Text Bold for the headlines, Vazirmatn Regular for the line under them (both SIL OFL, free for commercial use) */
  @font-face { font-family: Ruqaa; src: url(fonts/MarkaziText-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Naskh; src: url(fonts/Vazirmatn-Regular.ttf); font-weight: 700; }
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#111; display:flex; gap:40px; padding:40px; width:3500px; font-family:Sahabah, sans-serif; font-weight:400; font-synthesis:none }
  .art { position:relative; width:1080px; height:1350px; overflow:hidden }
  .art > * { position:absolute }

  /* the photograph, a little more contrast and a deeper orange than the plate */
  .plate { inset:0; width:1080px; height:1350px; filter:contrast(1.06) saturate(1.06) }
  /* warm light falling across the backdrop from the upper right, behind the words, broken by the paper */
  .lamp { inset:0; background:radial-gradient(ellipse 70% 42% at 78% 26%, rgba(255,140,70,.22), rgba(255,140,70,0) 75%); mix-blend-mode:screen;
    -webkit-mask:url(../ig-highlights/assets/img/newsprint.jpg) var(--mx) var(--my)/1800px; mask:url(../ig-highlights/assets/img/newsprint.jpg) var(--mx) var(--my)/1800px }

  /* the headline: stacked on the right, lit from the same lamp (white at the top, warm at the foot), with a soft shadow
     on the backdrop behind it so it sits in the room rather than on the screen */
  .head { right:74px; top:var(--top); direction:rtl; text-align:right; white-space:nowrap; font-family:Ruqaa; font-weight:700; line-height:1.12 !important; font-feature-settings:"liga" 0, "dlig" 0;
    color:#fff1de; font-size:var(--fs); line-height:1.22; filter:drop-shadow(10px 16px 18px rgba(18,4,0,.55)) }
  .line { right:80px; top:var(--ltop); direction:rtl; text-align:right; font-family:Naskh; font-weight:700; font-size:46px; line-height:1.5;
    color:#efdcc2; text-shadow:0 2px 12px rgba(18,4,0,.5) }

  .lock { left:70px; top:60px; display:flex; align-items:center; gap:18px; direction:rtl }
  .wm { position:relative; font-size:54px; line-height:1; color:#f6e8d4; white-space:nowrap }
  .wm .h { position:absolute; width:.19em; height:.19em; border:.032em solid currentColor; background:#2a1007 }
  .who { font-size:25px; line-height:1.25; color:#dcc6a6; padding-right:16px; border-right:2px solid rgba(220,198,166,.4) }
  .handle { left:74px; bottom:54px; font-size:30px; color:#dcc6a6; direction:ltr; opacity:.85 }

  .vig { inset:0; background:radial-gradient(ellipse 85% 80% at 50% 50%, rgba(0,0,0,0) 58%, rgba(10,3,0,.5) 100%) }
  .grain { inset:0; background:url(../ig-highlights/assets/img/grain.png) 0 0/512px; mix-blend-mode:overlay; opacity:.1 }

  #s1 { --mx:-300px; --my:-200px; --fs:260px; --top:48px; --ltop:700px }
  #s2 { --mx:-900px; --my:-500px; --fs:200px; --top:110px; --ltop:560px }
  #s3 { --mx:-600px; --my:-1000px; --fs:250px; --top:100px; --ltop:770px }
</style>
</head>
<body>

<div class="art" id="s1">
  <img class="plate" src="img/plate-chameleon-1.png" alt="">
  <div class="lamp"></div>
  <div class="head">غيرت<br>لوني</div>
  <div class="line">الصفحة بشكلها الجديد</div>
  <div class="lock"><span class="wm"><span class="t">عـــــــلاوي</span><span class="h"></span></span><span class="who">مصمم<br>جرافيك</span></div>
  <div class="handle">allawi.psd</div>
  <div class="vig"></div><div class="grain"></div>
</div>

<div class="art" id="s2">
  <img class="plate" src="img/plate-chameleon-2.png" alt="">
  <div class="lamp"></div>
  <div class="head">شنو اسوي<br>هنا</div>
  <div class="line">بوستات، اعلانات، ريلز موشن وهويات</div>
  <div class="lock"><span class="wm"><span class="t">عـــــــلاوي</span><span class="h"></span></span><span class="who">مصمم<br>جرافيك</span></div>
  <div class="handle">allawi.psd</div>
  <div class="vig"></div><div class="grain"></div>
</div>

<div class="art" id="s3">
  <img class="plate" src="img/plate-chameleon-3.png" alt="">
  <div class="lamp"></div>
  <div class="head" style="line-height:1.22 !important">دزلي<br>بالـخاص</div>
  <div class="line">كلي شنو تبيع، وارجعلك بفكرة</div>
  <div class="lock"><span class="wm"><span class="t">عـــــــلاوي</span><span class="h"></span></span><span class="who">مصمم<br>جرافيك</span></div>
  <div class="handle">allawi.psd</div>
  <div class="vig"></div><div class="grain"></div>
</div>

<script>
// the wordmark's handle sits on the middle of the stretched kashida
const imgs = [...document.images].map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }));
Promise.all([document.fonts.load("200px Sahabah", 'علاوي'), document.fonts.load("700 200px Ruqaa", 'غيرت'), document.fonts.load("700 40px Naskh", 'الصفحة'), ...imgs]).then(() => document.fonts.ready).then(() => {
  const c = document.createElement('canvas'); c.width = 400; c.height = 400;
  const x = c.getContext('2d'); x.font = '200px Sahabah'; x.fillText('ـــــ', 20, 250);
  const d = x.getImageData(150, 0, 1, 400).data; let lo = -1, hi = -1;
  for (let y = 0; y < 400; y++) if (d[y * 4 + 3] > 128) { if (lo < 0) lo = y; hi = y; }
  const K = ((lo + hi) / 2 - 250) / 200;
  document.querySelectorAll('.wm').forEach((el) => {
    const t = el.querySelector('.t'), h = el.querySelector('.h'), fs = parseFloat(getComputedStyle(el).fontSize);
    const r = document.createRange(); r.setStart(t.firstChild, 1); r.setEnd(t.firstChild, 9);
    const k = r.getBoundingClientRect(), box = el.getBoundingClientRect();
    const m = document.createElement('span'); m.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline'; t.appendChild(m);
    const base = m.getBoundingClientRect().top - box.top; m.remove();
    h.style.left = (k.left - box.left + k.width / 2 - fs * .095) + 'px';
    h.style.top = (base + fs * K - fs * .095) + 'px';
  });
  setTimeout(() => { document.body.dataset.ready = '1'; }, 300);
});
</script>
</body>
</html>
