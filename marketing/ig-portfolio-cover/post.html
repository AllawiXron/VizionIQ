<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>allawi.psd — أعمالي سوشيال ميديا</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root {
    --paper: #ece3d4;
    --paper-2: #e3d6c2;
    --ink: #1f1510;
    --ink-soft: rgba(31, 21, 16, 0.62);
    --orange: #e2541b;
    --orange-2: #f07a2e;
    --cream: #fbf3e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; flex-direction: column; gap: 40px; align-items: center; padding: 40px 0; }

  .post {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    color: var(--ink);
    font-family: "Readex Pro", sans-serif;
    background:
      radial-gradient(60% 42% at 50% 64%, rgba(240, 122, 46, 0.22) 0%, rgba(240, 122, 46, 0) 70%),
      radial-gradient(120% 90% at 50% 0%, #f1e9dc 0%, var(--paper) 55%, var(--paper-2) 100%);
  }
  /* paper grain */
  .grain {
    position: absolute; inset: 0; z-index: 30; pointer-events: none; opacity: 0.32; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0.55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* orbit rings — a nod to the orange loops in the reference */
  .rings { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  /* top meta strip */
  .meta {
    position: absolute; top: 52px; left: 64px; right: 64px; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "IBM Plex Mono", monospace; font-size: 17px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .meta .ar { font-family: "Readex Pro"; letter-spacing: 0; font-size: 20px; font-weight: 500; text-transform: none; }
  .meta .dot { width: 9px; height: 9px; border-radius: 99px; background: var(--orange); display: inline-block; margin-inline-end: 10px; vertical-align: 1px; }

  /* headline */
  .title {
    position: absolute; top: 88px; left: 0; right: 0; z-index: 3;
    text-align: center; direction: rtl;
    font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 256px; line-height: 1.32;
    color: var(--ink);
  }
  .sub {
    position: absolute; top: 432px; left: 64px; right: 64px; z-index: 20;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .sub .ar { direction: rtl; font-size: 40px; font-weight: 500; letter-spacing: 0; }
  .sub .en { font-family: "Instrument Serif", serif; font-style: italic; font-size: 46px; line-height: 1; }
  .sub .rule { flex: 1; height: 2px; background: var(--ink); margin: 0 26px; transform: translateY(-11px); opacity: 0.85; }

  /* statue */
  .head {
    position: absolute; z-index: 5;
    width: 660px; left: 210px; top: 478px;
    filter: drop-shadow(18px 26px 30px rgba(70, 30, 10, 0.28));
  }
  .head img { width: 100%; display: block; }
  /* warm rim light clipped to the statue */
  .head .rim {
    position: absolute; inset: 0;
    -webkit-mask: url(img/head.webp) center / 100% 100% no-repeat; mask: url(img/head.webp) center / 100% 100% no-repeat;
    background: linear-gradient(105deg, rgba(240,122,46,0) 45%, rgba(240,122,46,0.55) 100%);
    mix-blend-mode: soft-light;
  }

  /* the blindfold = a selected Photoshop layer */
  .bar {
    position: absolute; z-index: 10;
    left: 540px; top: 0; /* positioned via --y */
    width: 610px; height: 104px;
    transform: translate(-50%, -50%) rotate(var(--rot, 6deg));
    background: linear-gradient(180deg, var(--orange-2) 0%, var(--orange) 100%);
    border-radius: 18px;
    box-shadow: 0 18px 34px rgba(150, 50, 10, 0.32), inset 0 2px 0 rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center; gap: 18px;
    color: var(--cream);
  }
  .bar .name { font-family: "Readex Pro"; font-weight: 600; font-size: 50px; letter-spacing: 0.01em; direction: ltr; }
  .bar .eye { width: 44px; height: 44px; opacity: 0.95; }
  .frame { position: absolute; inset: -14px; border: 2px solid var(--ink); pointer-events: none; }
  .frame i { position: absolute; width: 14px; height: 14px; background: var(--cream); border: 2px solid var(--ink); }
  .frame .tl { left: -8px; top: -8px; } .frame .tr { right: -8px; top: -8px; }
  .frame .bl { left: -8px; bottom: -8px; } .frame .br { right: -8px; bottom: -8px; }
  .frame .tm { left: calc(50% - 7px); top: -8px; } .frame .bm { left: calc(50% - 7px); bottom: -8px; }
  .frame .ml { left: -8px; top: calc(50% - 7px); } .frame .mr { right: -8px; top: calc(50% - 7px); }
  .cursor { position: absolute; z-index: 11; width: 50px; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.3)); }

  /* bottom details */
  /* museum-label annotation */
  .label {
    position: absolute; left: 64px; top: 566px; z-index: 20; width: 150px;
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 500; line-height: 1.55; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .label b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 6px; }
  .label::after { content: ""; position: absolute; left: 0; top: -14px; width: 28px; height: 2px; background: var(--orange); }

  .foot { position: absolute; bottom: 56px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
  .foot.r { right: 64px; align-items: flex-end; direction: rtl; text-align: right; }
  .foot.l { left: 64px; align-items: flex-start; }
  .foot .big { font-size: 30px; font-weight: 500; }
  .foot .en { font-family: "Instrument Serif"; font-style: italic; font-size: 30px; line-height: 1.1; }
  .foot .mono { font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .foot .handle { font-family: "IBM Plex Mono", monospace; font-size: 24px; font-weight: 500; letter-spacing: 0.02em; }
</style>
</head>
<body>

<section class="post" id="post" style="--y: 924px; --rot: 4.6deg">
  <svg class="rings" viewBox="0 0 1080 1350">
    <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" /></filter></defs>
    <g fill="none" stroke="#e2541b" filter="url(#soft)">
      <circle cx="540" cy="840" r="392" stroke-width="22" />
    </g>
  </svg>

  <div class="meta">
    <span><span class="dot"></span>Portfolio — Vol.01</span>
    <span class="ar">ملف الأعمال ٢٠٢٦</span>
  </div>

  <h1 class="title">أَعْمَالِي</h1>

  <div class="sub">
    <span class="en">Social Media Designs</span>
    <span class="rule"></span>
    <span class="ar">سوشيال ميديا</span>
  </div>

  <div class="head">
    <img src="img/head.webp" alt="" />
    <div class="rim"></div>
  </div>

  <div class="bar" style="top: var(--y)">
    <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /><path d="M3 3l18 18" />
    </svg>
    <span class="name">allawi.psd</span>
    <div class="frame"><i class="tl"></i><i class="tm"></i><i class="tr"></i><i class="ml"></i><i class="mr"></i><i class="bl"></i><i class="bm"></i><i class="br"></i></div>
  </div>

  <svg class="cursor" style="left: 856px; top: 992px" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5 6.3-.3z" fill="#1f1510" stroke="#fbf3e6" stroke-width="1.4" stroke-linejoin="round" /></svg>

  <div class="label"><b>Fig. 01</b>Marble head<br>of an athlete<br>Roman<br>138–192 CE<br>Met · CC0</div>

  <div class="foot r">
    <span class="mono">Layer by layer</span>
    <span class="big">طبقة فوق طبقة</span>
  </div>
  <div class="foot l">
    <span class="mono">Follow</span>
    <span class="handle">@allawi.psd</span>
  </div>

  <div class="grain"></div>
</section>

</body>
</html>
