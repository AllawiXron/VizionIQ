<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>viZion swing reel</title>
<style>
  @font-face { font-family: "DG Sahabah"; src: url("../brand-fonts/DG-Sahabah-Reg.ttf"); font-weight: 400; }
  /* the "viZion" name only: DG Sahabah draws its "v" like a "u", so the name keeps the viZion posts' Readex Pro */
  @font-face { font-family: "Readex Pro"; src: url("../vizion-results-carousel/fonts/0d3c0ac20a.woff2") format("woff2"); font-weight: 200 700; }
  .wm { font-family: "Readex Pro", sans-serif; font-weight: 600; font-synthesis: none; direction: ltr; unicode-bidi: isolate; }
  :root { --navy: #061a4d; --ink: #04123a; --mint: #d9efe6; --blue: #1f6bff; --yellow: #f5b51a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #062469; }
  body { font-family: "DG Sahabah", "Alexandria", sans-serif; font-weight: 400; font-synthesis: none; }
  .full { position: absolute; inset: 0; }

  /* the spotlight: bright blue in the middle, navy at the edges */
  #bg { background:
      radial-gradient(ellipse 62% 40% at 50% 47%, #5ea6ff 0%, #2f7cf6 30%, #1450c8 62%, #0a2f86 100%); }
  #vignette { background: radial-gradient(ellipse 85% 70% at 50% 48%, transparent 45%, rgba(2, 10, 40, .55) 100%); }
  #grain { opacity: .07; mix-blend-mode: overlay; }

  /* top: the mark and the name */
  #brand { position: absolute; top: 250px; left: 0; right: 0; display: flex; justify-content: center; align-items: center;
    gap: 18px; direction: ltr; color: var(--mint); }
  #brand svg { width: 64px; height: 60px; }
  #brand span { font-size: 58px; line-height: 1; letter-spacing: .5px; }

  /* the line that flips: one full-frame layer each side of the string */
  .side { position: absolute; inset: 0; }
  .say { position: absolute; left: 0; right: 0; top: 700px; direction: rtl; text-align: center; font-size: 132px; line-height: 1.12; }
  .say.q { color: var(--navy); }
  .say.a { color: #fff; text-shadow: 0 6px 30px rgba(4, 20, 70, .25); }

  /* bottom */
  #foot { position: absolute; top: 1470px; left: 0; right: 0; text-align: center; direction: rtl; color: var(--mint); }
  #foot .l1 { font-size: 40px; opacity: .92; }
  #foot .l2 { font-size: 34px; margin-top: 10px; color: #a9d4ff; }

  #tag { position: absolute; left: 0; top: 0; width: 190px; height: 190px; border-radius: 44px;
    background: linear-gradient(160deg, #0c2766 0%, #061a4d 55%, #04123a 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.10), inset 0 -6px 14px rgba(0,0,0,.35), 0 34px 50px rgba(2, 12, 50, .45);
    transform-origin: 95px 0; display: flex; align-items: center; justify-content: center; }
  #tag::before { content: ""; position: absolute; top: 14px; left: 50%; width: 16px; height: 16px; margin-left: -8px;
    border-radius: 50%; background: #020a26; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.12); }
  #tag svg { width: 128px; height: 119px; margin-top: 14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</svg>
<div id="bg" class="full"></div>

<div id="brand"><svg id="brandMark"></svg><span class="wm">viZion</span></div>

<div id="sideL" class="side"><div class="say"></div></div>
<div id="sideR" class="side"><div class="say"></div></div>

<div id="foot">
  <div class="l1">إعلانات · رسايل · تسعير · توصيل</div>
  <div class="l2">كورس <span class="wm">viZion</span> · راسلنا بالخاص</div>
</div>

<svg id="rope" class="full" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <line id="ropeShadow" stroke="rgba(2,12,50,.30)" stroke-width="7" filter="url(#soft)"/>
  <line id="ropeLine" stroke="#04123a" stroke-width="5" stroke-linecap="round"/>
</svg>
<div id="tag"><svg id="tagMark"></svg></div>

<svg id="grain" class="full" width="1080" height="1920"><rect id="grainRect" width="1300" height="2140" filter="url(#noise)"/></svg>
<div id="vignette" class="full"></div>

<script src="mark.js"></script>
<script>
// The pendulum: a string from a pivot far above the frame, swinging between ±A. Each half swing flips the line:
// the side the string has already passed shows the next line, the side ahead of it still shows the old one.
const W = 1080, PX = 540, PY = -1100, LEN = 2180;     // pivot and string length (tag hangs just under the line)
const A = 10.5 * Math.PI / 180;                       // swing amplitude
const HALF = 1.3;                                     // seconds per half swing
const Q = [
  ['إعلانك', 'ما يبيع؟'],
  ['يسألون بيش', 'وما يشترون؟'],
  ['ما تعرف', 'شلون تسعّر؟'],
  ['الرواجع', 'دا تخسّرك؟'],
  ['تريد تبدي', 'تبيع أونلاين؟'],
];
const ANS = ['إحنا', 'وياك.'];
const STEPS = Q.length * 2;                           // question, answer, question, answer ... back to the first
const DUR = STEPS * HALF;

// line k of the sequence: even = a question, odd = the answer
const line = (k) => (k % 2 ? { t: ANS, c: 'a' } : { t: Q[(k / 2) % Q.length], c: 'q' });

function mark(svg, parts) {
  const [x, y, w, h] = MARK.viewBox;
  svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  svg.innerHTML = parts.map(([k, fill]) => `<path d="${MARK[k]}" fill="${fill}"/>`).join('');
}
mark(document.getElementById('brandMark'), [['all', '#d9efe6']]);
mark(document.getElementById('tagMark'), [['blue', '#2f7cf6'], ['yellow', '#f5b51a']]);

const sideL = document.getElementById('sideL'), sideR = document.getElementById('sideR');
const sayL = sideL.firstElementChild, sayR = sideR.firstElementChild;
function setSay(el, k) {
  const l = line(k);
  const html = l.t.map((s) => `<div>${s}</div>`).join('');
  if (el.dataset.k != String(k)) { el.innerHTML = html; el.className = 'say ' + l.c; el.dataset.k = k; }
}

const theta = (t) => A * Math.cos(Math.PI * t / HALF);   // +A = tag on the right; starts on the right

window.TIMELINE = { duration: DUR, fps: 30, half: HALF, steps: STEPS };
window.setTime = function (t) {
  t = ((t % DUR) + DUR) % DUR;
  const k = Math.min(STEPS - 1, Math.floor(t / HALF));
  const th = theta(t);
  const tan = Math.tan(th);
  const xAt = (y) => PX + (y - PY) * tan;               // the string's x at height y

  // rightward half swings (odd k) sweep the left side; leftward ones (even k) sweep the right side
  const oldK = k, newK = k + 1;
  const leftK = k % 2 ? newK : oldK, rightK = k % 2 ? oldK : newK;
  setSay(sayL, leftK); setSay(sayR, rightK);
  const x0 = xAt(0), x1 = xAt(1920);
  sideL.style.clipPath = `polygon(0 0, ${x0}px 0, ${x1}px 1920px, 0 1920px)`;
  sideR.style.clipPath = `polygon(${x0}px 0, ${W}px 0, ${W}px 1920px, ${x1}px 1920px)`;

  // string end and tag
  const ex = PX + LEN * Math.sin(th), ey = PY + LEN * Math.cos(th);
  for (const [id, dx, dy] of [['ropeLine', 0, 0], ['ropeShadow', 22, 14]]) {
    const l = document.getElementById(id);
    l.setAttribute('x1', PX + dx); l.setAttribute('y1', PY + dy); l.setAttribute('x2', ex + dx); l.setAttribute('y2', ey + 22 + dy);
  }
  const lag = theta(t - 0.09) * 1.3;                     // the tag trails the string a little
  const tag = document.getElementById('tag');
  tag.style.transform = `translate(${ex - 95}px, ${ey}px) rotate(${-lag}rad)`;

  // light grain that shifts every 0.2 s, not every frame
  const g = Math.floor(t / 0.2);
  document.getElementById('grainRect').setAttribute('transform', `translate(${-((g * 73) % 200)} ${-((g * 131) % 200)})`);
};
setTime(0);
</script>
</body>
</html>
