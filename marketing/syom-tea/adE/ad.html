<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Syom ad E</title>
<style>
  @font-face { font-family: Lama; font-weight: 900; src: url('../files/brand/3- Fonts/LamaSans-Black.ttf'); }
  @font-face { font-family: Lama; font-weight: 700; src: url('../files/brand/3- Fonts/LamaSans-Bold.ttf'); }
  @font-face { font-family: Lama; font-weight: 500; src: url('../files/brand/3- Fonts/LamaSans-Medium.ttf'); }
  :root { --lily: #ffebea; --gold: #e8b06f; }
  body { margin: 0; background: #222; }
  .f { position: relative; overflow: hidden; font-family: Lama; font-synthesis: none; color: var(--lily); }
  .f > * { position: absolute; margin: 0; }
  #syom-adE-story { width: 1080px; height: 1920px; }
  .plate { inset: 0; width: 100%; height: 100%; }

  .logo { left: 50px; top: 268px; width: 214px; }
  .head { right: 50px; top: 256px; font-weight: 900; font-size: 118px; line-height: 1.14; letter-spacing: -1px; text-align: right; }
  .head span { display: block; white-space: nowrap; }

  /* the answer sits right under the question, in the column beside the pouch */
  .ans { right: 50px; top: 846px; font-weight: 900; font-size: 84px; line-height: 1.12; color: var(--gold); text-align: right; white-space: nowrap; }
  .sub { right: 50px; top: 1062px; font-weight: 700; font-size: 40px; line-height: 1.3; text-align: right; white-space: nowrap; }

  .cta { right: 50px; top: 1222px; text-align: right; }
  .cta::before { content: ''; display: block; width: 70px; height: 3px; margin: 0 0 18px auto; background: var(--gold); }
  .cta p { margin: 0; white-space: nowrap; }
  .c1 { font-weight: 500; font-size: 36px; line-height: 1.3; }
  .c2 { margin-top: 10px !important; font-weight: 900; font-size: 46px; line-height: 1.22; }
</style>
</head>
<body>
<div class="f" id="syom-adE-story">
  <img class="plate" src="plate.png" alt="">
  <img class="logo" src="logo.svg" alt="">
  <p class="head"><span>وزنج زايد</span><span>والدايت مايفيد</span><span>وتخافين من</span><span>المنحفات؟</span></p>
  <p class="ans">وصلتي<br>للحل الطبيعي</p>
  <p class="sub">سيوم الكوري<br>يحقق هدفج</p>
  <div class="cta">
    <p class="c1">ابدي اليوم وعيشي التجربة</p>
    <p class="c2">راسلينا وخلي<br>الباقي على سيوم</p>
  </div>
</div>
<script>document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 300));</script>
</body>
</html>
