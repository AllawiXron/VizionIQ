<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Syom ad B</title>
<style>
  @font-face { font-family: Lama; font-weight: 900; src: url('../files/brand/3- Fonts/LamaSans-Black.ttf'); }
  @font-face { font-family: Lama; font-weight: 700; src: url('../files/brand/3- Fonts/LamaSans-Bold.ttf'); }
  @font-face { font-family: Lama; font-weight: 500; src: url('../files/brand/3- Fonts/LamaSans-Medium.ttf'); }
  :root { --lily: #ffebea; --gold: #e8b06f; }
  body { margin: 0; background: #222; }
  .f { position: relative; overflow: hidden; font-family: Lama; font-synthesis: none; color: var(--lily); }
  .f > * { position: absolute; margin: 0; }
  #syom-adB-story { width: 1080px; height: 1920px; }
  .scene { inset: 0; width: 100%; height: 100%; }

  /* the copy sits on the wall left of the pouch; the headline is painted on the wall in the render */
  .col { right: 640px; top: 790px; width: 390px; }
  .col > * { margin: 0; }
  .q { font-weight: 700; font-size: 46px; line-height: 1.22; }
  .b { margin-top: 20px !important; font-weight: 500; font-size: 35px; line-height: 1.4; opacity: .92; }
  .herb { margin-top: 34px !important; font-weight: 700; font-size: 33px; line-height: 1.25; }
  .herb b { display: block; font-weight: 900; font-size: 84px; line-height: 1; color: var(--gold); }
  .cta { margin-top: 40px !important; font-weight: 900; font-size: 40px; line-height: 1.25; }
  .cta::before { content: ''; display: block; width: 76px; height: 3px; margin: 0 0 18px auto; background: var(--gold); }
</style>
</head>
<body>
<div class="f" id="syom-adB-story">
  <img class="scene" src="render/scene.png" alt="">
  <div class="col">
    <p class="q">وتخافين من المنتجات الكيميائية؟</p>
    <p class="b">اشربي سيوم وادخلي عالم الرشاقة من اليوم</p>
    <p class="herb"><b>100%</b>أعشاب كورية طبيعية</p>
    <p class="cta">راسلينا وخلي<br>الباقي على سيوم</p>
  </div>
</div>
<script>document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 300));</script>
</body>
</html>
