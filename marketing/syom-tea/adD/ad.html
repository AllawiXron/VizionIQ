<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Syom ad D</title>
<style>
  @font-face { font-family: Lama; font-weight: 900; src: url('../files/brand/3- Fonts/LamaSans-Black.ttf'); }
  @font-face { font-family: Lama; font-weight: 700; src: url('../files/brand/3- Fonts/LamaSans-Bold.ttf'); }
  @font-face { font-family: Lama; font-weight: 500; src: url('../files/brand/3- Fonts/LamaSans-Medium.ttf'); }
  :root { --lily: #ffebea; --gold: #e8b06f; }
  body { margin: 0; background: #222; }
  .f { position: relative; overflow: hidden; font-family: Lama; font-synthesis: none; color: var(--lily); }
  .f > * { position: absolute; margin: 0; }
  #syom-adD-story { width: 1080px; height: 1920px; }
  .plate { inset: 0; width: 100%; height: 100%; }

  .logo { left: 50px; top: 268px; width: 214px; }
  .head { right: 50px; top: 262px; font-weight: 900; font-size: 176px; line-height: 1.03; letter-spacing: -2px; text-align: right; }
  .head span { display: block; white-space: nowrap; }

  .herb { left: 52px; top: 392px; width: 250px; margin: 0; font-weight: 700; font-size: 30px; line-height: 1.25; text-align: left; }
  .herb b { display: block; font-weight: 900; font-size: 72px; line-height: 1; color: var(--gold); }

  .col { right: 668px; top: 790px; width: 362px; }
  .col > * { margin: 0; }
  .d1 { font-weight: 900; font-size: 60px; line-height: 1.15; white-space: nowrap; }
  .d2 { margin-top: 10px !important; font-weight: 700; font-size: 37px; line-height: 1.3; white-space: nowrap; }

  .cta { right: 668px; top: 1196px; font-weight: 900; font-size: 40px; line-height: 1.25; white-space: nowrap; }
  .cta::before { content: ''; display: block; width: 70px; height: 3px; margin: 0 0 16px auto; background: var(--gold); }
</style>
</head>
<body>
<div class="f" id="syom-adD-story">
  <img class="plate" src="plate.png" alt="">
  <img class="logo" src="logo.svg" alt="">
  <p class="head"><span>وزنج</span><span>مضايقج؟</span></p>
  <div class="col">
    <p class="d1">اشربي سيوم</p>
    <p class="d2">وادخلي عالم الرشاقة<br>من اليوم</p>
  </div>
  <p class="herb"><b>100%</b>أعشاب كورية طبيعية</p>
  <p class="cta">راسلينا وخلي<br>الباقي على سيوم</p>
</div>
<script>document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 300));</script>
</body>
</html>
