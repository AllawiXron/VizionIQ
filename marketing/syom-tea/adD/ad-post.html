<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Syom ad D post</title>
<style>
  @font-face { font-family: Lama; font-weight: 900; src: url('../files/brand/3- Fonts/LamaSans-Black.ttf'); }
  @font-face { font-family: Lama; font-weight: 700; src: url('../files/brand/3- Fonts/LamaSans-Bold.ttf'); }
  @font-face { font-family: Lama; font-weight: 500; src: url('../files/brand/3- Fonts/LamaSans-Medium.ttf'); }
  :root { --lily: #ffebea; --gold: #e8b06f; }
  body { margin: 0; background: #222; }
  .f { position: relative; overflow: hidden; font-family: Lama; font-synthesis: none; color: var(--lily); }
  .f > * { position: absolute; margin: 0; }
  /* the same scene as the Story, rendered wider (plate-228.png, 1536x1920) and framed tight on the pouch:
     the 1344x1680 crop at (120, 200) set at 1080x1350 */
  #syom-adD-post { width: 1080px; height: 1350px; }
  .plate { left: -96.4px; top: -160.7px; width: 1234.3px; height: 1542.9px; }

  .logo { left: 46px; top: 54px; width: 176px; }
  .head { right: 44px; top: 40px; font-weight: 900; font-size: 140px; line-height: 1.03; letter-spacing: -2px; text-align: right; }
  .head span { display: block; white-space: nowrap; }

  .herb { right: 612px; top: 600px; width: 400px; margin: 0; font-weight: 700; font-size: 30px; line-height: 1.25; white-space: nowrap; }
  .herb b { display: block; font-weight: 900; font-size: 86px; line-height: 1; color: var(--gold); }

  .ans { right: 46px; top: 338px; text-align: right; }
  .ans > * { margin: 0; }
  .d1 { font-weight: 900; font-size: 54px; line-height: 1.1; white-space: nowrap; }
  .d2 { margin-top: 2px !important; font-weight: 700; font-size: 32px; line-height: 1.3; white-space: nowrap; }

  .cta { right: 612px; top: 800px; font-weight: 900; font-size: 40px; line-height: 1.25; white-space: nowrap; }
  .cta::before { content: ''; display: block; width: 60px; height: 3px; margin: 0 0 14px auto; background: var(--gold); }
</style>
</head>
<body>
<div class="f" id="syom-adD-post">
  <img class="plate" src="plate-228.png" alt="">
  <img class="logo" src="logo.svg" alt="">
  <p class="head"><span>وزنج</span><span>مضايقج؟</span></p>
  <div class="ans">
    <p class="d1">اشربي سيوم</p>
    <p class="d2">وادخلي عالم الرشاقة من اليوم</p>
  </div>
  <p class="herb"><b>100%</b>أعشاب كورية طبيعية</p>
  <p class="cta">راسلينا وخلي<br>الباقي على سيوم</p>
</div>
<script>document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 300));</script>
</body>
</html>
