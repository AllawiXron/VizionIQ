<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Syom ad 1</title>
<style>
  @font-face { font-family: Lama; font-weight: 900; src: url('../files/brand/3- Fonts/LamaSans-Black.ttf'); }
  @font-face { font-family: Lama; font-weight: 700; src: url('../files/brand/3- Fonts/LamaSans-Bold.ttf'); }
  @font-face { font-family: Lama; font-weight: 500; src: url('../files/brand/3- Fonts/LamaSans-Medium.ttf'); }
  :root { --green: #014d40; --gold: #e8b06f; }
  body { margin: 0; background: #222; }
  .f { position: relative; overflow: hidden; font-family: Lama; font-synthesis: none; }
  .f > * { position: absolute; }
  #syom-ad1-story { width: 1080px; height: 1920px; }

  /* the photo, then everything printed on its surface (multiply keeps the palm and window shadows on the ink),
     then the pouch from the same frame laid back on top of the headline */
  .scene, .pouch { inset: 0; width: 100%; height: 100%; }
  .ink { inset: 0; mix-blend-mode: multiply; color: var(--green); }
  .ink > * { position: absolute; margin: 0; }

  .h1 { right: 50px; top: 232px; font-weight: 900; font-size: 246px; line-height: 1; letter-spacing: -3px; }
  .h2 { right: 44px; top: 524px; font-weight: 900; font-size: 246px; line-height: 1; letter-spacing: -3px; white-space: nowrap; }

  .copy { right: 50px; top: 830px; width: 400px; }
  .copy .q { margin: 0; font-weight: 700; font-size: 46px; line-height: 1.22; }
  .copy .b { margin: 22px 0 0 auto; width: 330px; font-weight: 500; font-size: 38px; line-height: 1.35; }
  .herb { right: 50px; top: 1206px; width: 290px; font-weight: 700; font-size: 36px; line-height: 1.25; }
  .herb b { display: block; font-weight: 900; font-size: 86px; line-height: 1; color: var(--gold); }
  .cta { right: 50px; top: 1430px; font-weight: 900; font-size: 44px; line-height: 1.25; white-space: nowrap; }
  .cta::before { content: ''; display: block; width: 84px; height: 4px; margin: 0 0 18px auto; background: var(--gold); }
</style>
</head>
<body>
<div class="f" id="syom-ad1-story">
  <img class="scene" src="img/scene.jpg" alt="">
  <div class="ink">
    <p class="h1">وزنج</p>
    <p class="h2">مضايقج؟</p>
    <div class="copy">
      <p class="q">وتخافين من<br>المنتجات الكيميائية؟</p>
      <p class="b">اشربي سيوم وادخلي عالم الرشاقة من اليوم</p>
    </div>
    <p class="herb"><b>100%</b>أعشاب كورية طبيعية</p>
    <p class="cta">راسلينا وخلي<br>الباقي على سيوم</p>
  </div>
  <img class="pouch" src="img/pouch.png" alt="">
</div>
<script>document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 300));</script>
</body>
</html>
