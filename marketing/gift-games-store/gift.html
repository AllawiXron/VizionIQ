<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>allawi.psd — gift card for a new games store</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<!-- A discount gift for a client opening a new games store: made like the game gift cards he sells
     (scratch-off code, hologram sticker), in the allawi.psd colours on the brand paper. -->
<style>
:root { --paper:#ece3d4; --ink:#1f1510; --orange:#e2541b; --orange2:#f07a2e; --cream:#fbf3e6; --oink:#c2441a }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#222; display:flex; justify-content:center; padding:40px }
.art { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:var(--ink); font-family:'IBM Plex Sans Arabic';
  background:url(assets/img/paper.jpg) center/cover }
.art::after { content:''; position:absolute; inset:0; background:url(assets/img/grain.png); background-size:380px; mix-blend-mode:multiply; opacity:.16; pointer-events:none; z-index:30 }

.kicker { position:absolute; right:84px; top:78px; font:700 50px/1.2 'Aref Ruqaa'; color:var(--oink) }
.hl { position:absolute; right:80px; top:146px; font:900 104px/1.3 'Alexandria'; letter-spacing:-.01em; white-space:nowrap }
.hl .o { color:var(--orange) }
.mk { position:absolute; overflow:visible; z-index:4 }
.mk { preserveAspectRatio:none }
.mk path { fill:none; stroke:var(--orange); stroke-width:11; stroke-linecap:round; opacity:.9 }

/* ---------- the card ---------- */
.cardwrap { position:absolute; left:110px; top:356px; width:860px; height:540px; transform:rotate(-5deg); z-index:5;
  filter:drop-shadow(0 34px 34px rgba(40,20,5,.42)) drop-shadow(0 6px 8px rgba(40,20,5,.3)) }
.card { position:absolute; inset:0; border-radius:34px; overflow:hidden; direction:ltr; color:var(--cream);
  background:
    radial-gradient(70% 90% at 88% 0%, rgba(240,122,46,.55), rgba(240,122,46,0) 60%),
    radial-gradient(60% 70% at 0% 100%, rgba(226,84,27,.35), rgba(226,84,27,0) 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, rgba(255,255,255,0) 2px 14px),
    linear-gradient(160deg, #241913 0%, #120c09 100%) }
.card::before { content:''; position:absolute; inset:0; border-radius:34px; box-shadow:inset 0 0 0 2px rgba(251,243,230,.12), inset 0 2px 0 rgba(255,255,255,.12) }
.card::after { content:''; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.10) 45%, rgba(255,255,255,0) 56%) }
.wm { position:absolute; right:-30px; bottom:-60px; font:900 250px/1 'Alexandria'; color:rgba(251,243,230,.035); letter-spacing:-.04em }

.brand { position:absolute; left:44px; top:38px; font:800 44px/1 'Alexandria' }
.brand span { color:var(--orange2) }
.kind { position:absolute; left:46px; top:92px; font:700 21px/1 'Courier Prime'; letter-spacing:.42em; color:rgba(251,243,230,.6) }
.pad { position:absolute; right:42px; top:34px; width:88px; height:60px }

.val { position:absolute; right:46px; top:128px; direction:rtl; text-align:right }
.val .k { font:600 30px/1.2 'IBM Plex Sans Arabic'; color:rgba(251,243,230,.75) }
.val .n { font:900 112px/1.05 'Alexandria'; margin-top:4px; white-space:nowrap }
.val .n b { color:var(--orange2); font-weight:900 }
.val .s { font:600 30px/1.3 'IBM Plex Sans Arabic'; margin-top:12px }

/* scratch-off code, half scratched */
.scratch { position:absolute; left:44px; bottom:44px; width:370px; height:92px; border-radius:14px; overflow:hidden; background:#f4ede0 }
.scratch .code { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 38px/1 'Courier Prime'; letter-spacing:.12em; color:var(--ink) }
.scratch .foil { position:absolute; inset:0;
  background:repeating-linear-gradient(100deg, #9b9b98 0 3px, #c9c8c3 3px 7px, #aeada9 7px 11px), #b7b6b1;
  -webkit-mask:linear-gradient(100deg, #000 0 4%, transparent 9% 90%, #000 95%); mask:linear-gradient(100deg, #000 0 4%, transparent 9% 90%, #000 95%) }
.scratch .crumbs { position:absolute; inset:0; background:radial-gradient(circle at 15% 30%, #b7b6b1 0 3px, transparent 4px), radial-gradient(circle at 22% 70%, #b7b6b1 0 2px, transparent 3px),
  radial-gradient(circle at 68% 25%, #b7b6b1 0 3px, transparent 4px), radial-gradient(circle at 63% 80%, #b7b6b1 0 2px, transparent 3px), radial-gradient(circle at 40% 15%, #b7b6b1 0 2px, transparent 3px) }
.sc-l { position:absolute; left:46px; bottom:144px; font:700 17px/1 'Courier Prime'; letter-spacing:.3em; color:rgba(251,243,230,.55) }

/* hologram sticker */
.holo { position:absolute; right:44px; bottom:44px; width:150px; height:92px; border-radius:12px; overflow:hidden;
  background:conic-gradient(from 210deg at 40% 60%, #ffd1a6, #ff9fd0, #a6c8ff, #a6ffe0, #fff0a6, #ffb38a, #ffd1a6);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5) }
.holo::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 2px, rgba(255,255,255,0) 2px 6px); mix-blend-mode:overlay }
.holo span { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font:700 17px/1.25 'Courier Prime'; letter-spacing:.14em; color:rgba(31,21,16,.75); z-index:2; text-align:center }

.tape { position:absolute; height:54px; background:rgba(236,226,200,.8); box-shadow:0 2px 6px rgba(0,0,0,.16); z-index:7;
  clip-path:polygon(0 8%, 6% 0, 12% 10%, 20% 2%, 30% 9%, 42% 1%, 55% 8%, 66% 0, 78% 9%, 90% 2%, 100% 8%, 100% 92%, 92% 100%, 82% 90%, 70% 99%, 58% 91%, 45% 100%, 33% 92%, 21% 100%, 10% 91%, 0 98%) }

/* ---------- under the card ---------- */
.price { position:absolute; right:84px; top:968px; display:flex; align-items:baseline; gap:26px; z-index:6 }
.price .lab { font:800 44px/1 'Alexandria' }
.price .was { font:800 52px/1 'Alexandria'; color:rgba(31,21,16,.45); position:relative }
.price .was::after { content:''; position:absolute; left:-8px; right:-8px; top:52%; height:8px; background:var(--orange); border-radius:4px; transform:rotate(-8deg) }
.price .now { font:900 92px/1 'Alexandria'; color:var(--oink) }
.price .now small { font-size:46px }
.inc { position:absolute; right:84px; top:1072px; font:500 28px/1.5 'IBM Plex Sans Arabic'; color:rgba(31,21,16,.8); z-index:6 }
.inc b { font-weight:700; color:var(--ink) }

.stamp { position:absolute; left:84px; top:1140px; padding:6px 26px 14px; border:7px double var(--oink); border-radius:16px; color:var(--oink);
  font:700 36px/1.3 'IBM Plex Sans Arabic'; text-align:center; transform:rotate(7deg); z-index:8; background:rgba(247,244,238,.5);
  -webkit-mask-image:url(assets/img/grain.png); mask-image:url(assets/img/grain.png); -webkit-mask-size:240px; mask-size:240px }
.stamp small { display:block; font-size:26px; font-weight:600 }

.cta { position:absolute; right:84px; bottom:62px; font:700 46px/1.2 'Aref Ruqaa'; color:var(--ink); z-index:6 }
.cta b { color:var(--oink); font-weight:700 }
.handle { position:absolute; left:84px; top:96px; font:800 32px/1 'Alexandria'; direction:ltr; z-index:6 }
.handle span { color:var(--orange) }
</style>
</head>
<body>
<section class="art" id="gift">
  <div class="kicker">مني.. لمتجرك الجديد</div>
  <div class="hl">هدية <span class="o">افتتاح</span> متجرك</div>
  <svg class="mk" id="mk" width="290" height="36" viewBox="0 0 290 36" preserveAspectRatio="none"><path d="M6 22 C 60 10, 130 6, 200 13 S 272 26, 284 15" /></svg>

  <div class="cardwrap">
    <div class="card">
      <div class="wm">allawi</div>
      <div class="brand">allawi<span>.psd</span></div>
      <div class="kind">GIFT CARD</div>
      <svg class="pad" viewBox="0 0 88 60"><path fill="#f07a2e" d="M22 6h44c11 0 18 8 20 20l2 16c1 9-5 14-11 14-5 0-8-3-11-8l-3-5H25l-3 5c-3 5-6 8-11 8-6 0-12-5-11-14l2-16C4 14 11 6 22 6z"/><path fill="#16100c" d="M20 19h5v6h6v5h-6v6h-5v-6h-6v-5h6zM62 19a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm9 8a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm-17 0a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z"/></svg>
      <div class="val">
        <div class="k">رصيد هديتك</div>
        <div class="n">خصم <b>30</b> ألف</div>
        <div class="s">على الهوية الكاملة لمتجرك</div>
      </div>
      <div class="sc-l">SCRATCH · CODE</div>
      <div class="scratch"><div class="code">NEWSTORE30</div><div class="foil"></div><div class="crumbs"></div></div>
      <div class="holo"><span>VALID<br/>7 DAYS</span></div>
    </div>
    <div class="tape" style="left:-40px;top:-10px;width:170px;transform:rotate(-38deg)"></div>
    <div class="tape" style="right:-46px;bottom:-4px;width:170px;transform:rotate(-38deg)"></div>
  </div>

  <div class="price"><span class="lab">الهوية الكاملة</span><span class="was">150</span><span class="now">120 <small>ألف</small></span></div>
  <div class="inc"><b>الشعار</b> · الألوان والخطوط · أغلفة الهايلايت · قوالب بوست وستوري</div>
  <div class="stamp">صالحة لغاية<small>١٧ تشرين الأول</small></div>

  <div class="cta">ردّ بـ <b>«تمام»</b> ونبدي</div>
  <div class="handle">allawi<span>.psd</span></div>
</section>
<script>
  // headline on one line, at most 916px wide; the marker sits under «افتتاح»
  document.fonts.ready.then(() => {
    const h = document.querySelector('.hl'), w = h.getBoundingClientRect().width;
    if (w > 916) h.style.fontSize = (104 * 916 / w) + 'px';
    const o = h.querySelector('.o').getBoundingClientRect(), a = document.querySelector('.art').getBoundingClientRect(), mk = document.getElementById('mk');
    mk.setAttribute('width', o.width + 20); mk.style.left = (o.left - a.left - 10) + 'px'; mk.style.top = (o.bottom - a.top - 18) + 'px';
  });
  Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]).then(() => { document.body.dataset.ready = '1' });
</script>
</body>
</html>
