<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../brand-ads-2026/fonts/fonts.css" />
<!-- «ليش إعلانك ما يبيع؟»: a tips carousel for business owners, in the page's own look (paper, ink, orange, the
     Photoshop selection). The companion to ../ig-ad-mistakes, which covers how an ad looks; this one covers why it does
     not sell: it talks about the shop, hides the price, asks for five things, and is boosted to all of Iraq.
     6 slides at 1080x1350. -->
<style>
:root { --paper:#ece3d4; --paper-2:#e3d6c2; --ink:#1f1510; --soft:#6f655c; --mute:#9a8f83; --orange:#e2541b; --orange-2:#f07a2e; --cream:#fbf3e6; --line:#d3c7b5 }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#333; display:flex; flex-direction:column; gap:40px; padding:40px; align-items:center }
.slide { position:relative; width:1080px; height:1350px; overflow:hidden; direction:rtl; color:var(--ink); font-family:'Readex Pro';
  background:radial-gradient(120% 90% at 50% 0%, #f1e9dc 0%, var(--paper) 55%, var(--paper-2) 100%) }
.slide::after { content:""; position:absolute; inset:0; z-index:50; pointer-events:none; opacity:.32; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0.55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>") }

.top { position:absolute; left:64px; right:64px; top:56px; display:flex; justify-content:space-between; align-items:center }
.top .t { font:500 26px 'Readex Pro'; color:var(--ink) }
.top .t i { display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--orange); margin-left:12px; vertical-align:2px }
.top .n { font:500 24px 'IBM Plex Mono'; letter-spacing:.08em; color:var(--soft); direction:ltr }
.rule { position:absolute; left:64px; right:64px; top:110px; height:3px; background:var(--line) }
.foot { position:absolute; left:64px; right:64px; bottom:52px; display:flex; justify-content:space-between; align-items:center }
.foot .h { font:500 24px 'IBM Plex Mono'; color:var(--soft); direction:ltr }
.dots { display:flex; gap:10px; direction:rtl }
.dots b { width:12px; height:12px; border-radius:50%; background:var(--ink); opacity:.18 }
.dots b.on { opacity:1; background:var(--orange) }

.pill { display:inline-block; padding:8px 26px 13px; border-radius:999px; background:var(--orange); color:#fff; font:600 30px 'Readex Pro'; white-space:nowrap }
.pill.ink { background:var(--ink); color:var(--cream) }

/* the orange selection box with handles (same as the reel cover and the Cactus showcase) */
.hl { position:relative; display:inline-block; padding:34px 40px 16px }
.hl .box { position:absolute; inset:0; background:var(--orange); border-radius:12px; box-shadow:0 24px 56px rgba(226,84,27,.3) }
.hl .hd { position:absolute; width:5px; background:var(--ink) }
.hl .hd::after { content:""; position:absolute; left:-11px; width:27px; height:27px; border-radius:50%; background:var(--cream); border:4px solid var(--ink) }
.hl .hd.r { right:-2px; top:-30px; height:calc(100% + 30px) } .hl .hd.r::after { top:-14px }
.hl .hd.l { left:-3px; bottom:-30px; height:calc(100% + 30px) } .hl .hd.l::after { bottom:-14px }
.hl span { position:relative; color:var(--cream) }

/* ── cover ── */
#s1 .block { position:absolute; left:64px; right:64px; top:160px; display:flex; flex-direction:column; align-items:flex-start }
#s1 .h1 { font:900 132px/1.2 'Alexandria'; margin-top:44px; white-space:nowrap }
#s1 .hl { margin-top:40px } #s1 .hl span { font:900 150px/1.12 'Alexandria'; white-space:nowrap }
#s1 .sub { font:500 40px 'Readex Pro'; color:var(--soft); margin-top:46px }
.ins { position:absolute; left:64px; right:64px; top:880px; height:290px; border-radius:30px; background:var(--cream);
  box-shadow:0 26px 56px rgba(60,35,15,.16), 0 0 0 1px rgba(31,21,16,.05); padding:30px 40px }
.ins .cap { display:flex; justify-content:space-between; align-items:center; font:500 26px 'Readex Pro'; color:var(--soft) }
.ins .cap b { font:500 20px 'IBM Plex Mono'; letter-spacing:.1em; color:var(--mute); direction:ltr }
.ins .row { display:flex; justify-content:space-between; margin-top:34px }
.ins .row > div { width:31%; text-align:center }
.ins .row b { display:block; font:800 72px/1 'Alexandria'; direction:ltr }
.ins .row small { display:block; font:500 28px 'Readex Pro'; color:var(--soft); margin-top:16px }
.ins .zero { position:relative; display:inline-block; padding:6px 30px 10px; color:var(--orange) }
.ins .zero .fr { position:absolute; inset:-6px -2px; border:3px solid var(--ink) }
.ins .zero .fr i { position:absolute; width:16px; height:16px; background:var(--cream); border:3px solid var(--ink) }
.ins .zero .fr i:nth-child(1) { left:-9px; top:-9px } .ins .zero .fr i:nth-child(2) { right:-9px; top:-9px }
.ins .zero .fr i:nth-child(3) { left:-9px; bottom:-9px } .ins .zero .fr i:nth-child(4) { right:-9px; bottom:-9px }
.ins .cursor { position:absolute; width:46px; left:300px; top:182px; filter:drop-shadow(0 4px 5px rgba(0,0,0,.3)) }
#s1 .save { position:absolute; bottom:52px; right:64px; display:flex; align-items:center; gap:12px; font:600 28px 'Readex Pro' }
#s1 .swipe { position:absolute; bottom:52px; left:64px; display:flex; align-items:center; gap:12px; font:600 28px 'Readex Pro'; color:var(--orange) }

/* ── reason slides ── */
.r .head { position:absolute; left:64px; right:64px; top:150px }
.r .h2 { font:900 86px/1.3 'Alexandria'; margin-top:46px; white-space:nowrap }
.r .h2 em { font-style:normal; color:var(--orange) }
.cmp { position:absolute; left:64px; right:64px; top:506px; display:flex; flex-direction:column; gap:28px }
.card { position:relative; border-radius:26px; padding:28px 36px 32px }
.card .lab { display:flex; align-items:center; gap:12px; font:600 26px 'Readex Pro' }
.card .lab svg { width:34px; height:34px; flex:none }
.card.bad { background:#e2d7c6; color:#8a7f73 }
.card.bad .lab { color:#9b3b2b }
.card.good { background:var(--cream); box-shadow:0 22px 48px rgba(60,35,15,.14) }
.card.good .lab { color:var(--orange) }
.card .say { font:600 40px/1.5 'Readex Pro'; margin-top:14px }
.card.bad .say { color:#8a7f73 }
.card .fr { position:absolute; inset:-12px; border:3px solid var(--ink); pointer-events:none; border-radius:4px }
.card .fr i { position:absolute; width:18px; height:18px; background:var(--cream); border:3px solid var(--ink) }
.card .fr i:nth-child(1) { left:-10px; top:-10px } .card .fr i:nth-child(2) { right:-10px; top:-10px }
.card .fr i:nth-child(3) { left:-10px; bottom:-10px } .card .fr i:nth-child(4) { right:-10px; bottom:-10px }
.card .cursor { position:absolute; width:44px; left:-26px; bottom:-38px; filter:drop-shadow(0 4px 5px rgba(0,0,0,.3)) }
.fix { margin-top:6px; padding:24px 34px 28px; border-right:8px solid var(--orange); background:rgba(251,243,230,.55); border-radius:6px }
.fix b { font:700 30px 'Readex Pro'; color:var(--orange) }
.fix p { font:500 34px/1.55 'Readex Pro'; margin-top:6px }

/* comments (reason 2) */
.cm { display:flex; flex-direction:column; gap:12px; margin-top:16px }
.cm div { display:flex; align-items:center; gap:16px; font:500 32px 'Readex Pro' }
.cm i { width:44px; height:44px; border-radius:50%; background:#cbbfae; flex:none }
.cm div.me { font-weight:600; color:#6c6157 } .cm div.me i { background:#a99d8f }
.price { display:inline-flex; align-items:baseline; gap:16px; margin-top:12px }
.price b { font:900 64px 'Alexandria'; color:var(--orange) }
.price span { font:600 38px 'Readex Pro' }
/* asks (reason 3) */
.asks { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px }
.asks span { padding:8px 22px 12px; border-radius:999px; border:2px solid #b9ad9f; font:500 28px 'Readex Pro' }
.one { display:inline-flex; align-items:center; gap:14px; margin-top:16px; padding:14px 34px 20px; border-radius:999px; background:var(--orange); color:#fff; font:600 38px 'Readex Pro' }
/* targeting (reason 4) */
.tg { display:flex; gap:14px; margin-top:16px; flex-wrap:wrap }
.tg span { display:flex; align-items:center; gap:10px; padding:10px 22px 14px; border-radius:16px; background:rgba(31,21,16,.06); font:500 30px 'Readex Pro' }
.card.good .tg span { background:#f3e2d3; color:var(--ink) }
.tg span small { font:500 24px 'Readex Pro'; color:var(--soft) }
.card.bad .tg span small { color:#9a8f83 }

/* ── last slide ── */
#s6 { background:var(--ink); color:var(--cream) }
#s6::after { opacity:.12; mix-blend-mode:screen }
#s6 .top .t { color:var(--cream) } #s6 .top .n, #s6 .foot .h { color:#b5a898 } #s6 .rule { background:#3b2e25 }
#s6 .dots b { background:var(--cream) } #s6 .dots b.on { background:var(--orange) }
#s6 .h2 { position:absolute; left:64px; right:64px; top:160px; font:900 80px/1.3 'Alexandria'; white-space:nowrap }
#s6 .h2 em { font-style:normal; color:var(--orange-2) }
.chk { position:absolute; left:64px; right:64px; top:420px; display:flex; flex-direction:column; gap:22px }
.chk div { display:flex; align-items:center; gap:26px; padding:24px 30px 28px; border-radius:22px; background:#2b2019 }
.chk .bx { flex:none; width:60px; height:60px; border-radius:16px; background:var(--orange); display:flex; align-items:center; justify-content:center }
.chk .bx svg { width:36px; height:36px }
.chk p { font:600 40px 'Readex Pro' }
.chk p small { font:400 30px 'Readex Pro'; color:#b5a898; margin-right:10px }
#s6 .cta { position:absolute; left:64px; right:64px; top:1020px; display:flex; justify-content:space-between; align-items:center }
#s6 .cta .pill { font-size:44px; padding:16px 50px 24px; box-shadow:0 20px 44px rgba(226,84,27,.35) }
#s6 .cta .pr { font:500 32px 'Readex Pro'; color:#d8ccbc } #s6 .cta .pr b { font:900 44px 'Alexandria'; color:var(--orange-2) }
#s6 .save { position:absolute; left:64px; right:64px; top:1170px; display:flex; align-items:center; gap:14px; font:500 32px 'Readex Pro'; color:#d8ccbc }
#s6 .save svg { width:34px; color:var(--orange-2) }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5 6.3-.3z" fill="#1f1510" stroke="#fbf3e6" stroke-width="1.4" stroke-linejoin="round" /></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#9b3b2b" /><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round" /></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#e2541b" /><path d="M7 12.5l3.3 3.3L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M6 3 H18 V21 L12 16.5 L6 21 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" /></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="10" r="2.3" fill="currentColor" /></symbol>
</defs></svg>

<main id="deck"></main>

<script>
const AR = '٠١٢٣٤٥٦٧٨٩', ar = (n) => String(n).replace(/\d/g, (d) => AR[d]);
const N = 6;
const bar = (i) => `<div class="top"><span class="t"><i></i>ليش إعلانك ما يبيع؟</span><span class="n">${String(i).padStart(2, '0')} / ${String(N).padStart(2, '0')}</span></div><div class="rule"></div>`;
const foot = (i) => `<div class="foot"><span class="h">@allawi.psd</span><span class="dots">${Array.from({ length: N }, (_, k) => `<b class="${k + 1 === i ? 'on' : ''}"></b>`).join('')}</span></div>`;
const frame = '<div class="fr"><i></i><i></i><i></i><i></i></div><svg class="cursor" viewBox="0 0 24 24"><use href="#i-cursor" /></svg>';
const lab = (good, t) => `<div class="lab"><svg><use href="#i-${good ? 'ok' : 'x'}" /></svg>${t}</div>`;

const REASONS = [
  { h: 'يحچي عنك..<br /><em>مو عن الزبون.</em>',
    bad: '<div class="say">مطعم الأصالة.. أفضل مطعم بالمدينة،<br />جودة وخبرة من سنة 2005.</div>',
    good: '<div class="say">جوعان بنص الليل؟<br />برگرك يوصلك خلال 20 دقيقة.</div>',
    fix: 'الزبون ما يهمه منو انت، يهمه شنو راح يستفاد.<br />جاوبه بأول سطر.' },
  { h: 'السعر..<br /><em>«بالخاص»</em>',
    bad: '<div class="cm"><div><i></i>بكم؟</div><div><i></i>السعر لو سمحت؟</div><div class="me"><i></i>الصفحة: السعر بالخاص</div></div>',
    good: '<div class="price"><span>برگر دبل + بطاطا</span><b>7 آلاف</b></div>',
    fix: 'اكتب السعر، أو على الأقل «يبدي من».<br />اللي يشوف السعر ويراسلك، هذا زبون جاد.' },
  { h: 'يطلب منه<br /><em>خمس أشياء.</em>',
    bad: '<div class="asks"><span>تابعونا</span><span>اتصلوا بينا</span><span>زورونا</span><span>شاركوا البوست</span><span>واتساب</span></div>',
    good: '<div class="one">راسلنا هسه واكتب «برگر»</div>',
    fix: 'خطوة وحدة واضحة. إذا طلبت منه خمس أشياء،<br />ما راح يسوي ولا وحدة.' },
  { h: 'يوصل لكل العراق..<br /><em>وزبونك بمنطقتك.</em>',
    bad: '<div class="tg"><span><small>الموقع</small>العراق كله</span><span><small>العمر</small>18 – 65</span><span><small>الاهتمام</small>الكل</span></div>',
    good: '<div class="tg"><span><small>الموقع</small>بعقوبة + 10 كم</span><span><small>العمر</small>20 – 40</span><span><small>الاهتمام</small>مطاعم وأكل</span></div>',
    fix: 'محلك يوصّل داخل بعقوبة بس؟ لا تدفع فلوس<br />حتى يشوف إعلانك واحد بالبصرة.' },
];

const cover = `<section class="slide" id="s1">${bar(1)}
  <div class="block">
    <span class="pill">٤ أسباب</span>
    <div class="h1">ليش إعلانك</div>
    <div class="hl"><div class="box"></div><i class="hd r"></i><i class="hd l"></i><span>ما يبيع؟</span></div>
    <div class="sub">حتى لو تصميمه حلو..</div>
  </div>
  <div class="ins">
    <div class="cap"><span>إحصائيات الإعلان</span><b>INSIGHTS</b></div>
    <div class="row">
      <div><b>12,480</b><small>شافوه</small></div>
      <div><b>86</b><small>لايك</small></div>
      <div><b class="zero">0<span class="fr"><i></i><i></i><i></i><i></i></span></b><small>رسائل</small></div>
    </div>
    <svg class="cursor" viewBox="0 0 24 24"><use href="#i-cursor" /></svg>
  </div>
  <div class="save"><svg viewBox="0 0 24 24" width="34"><use href="#i-save" /></svg>احفظه وارجعله</div>
  <div class="swipe"><svg viewBox="0 0 60 24" width="56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 H54 M44 3 L55 12 L44 21" /></svg>اسحب</div>
</section>`;

const reason = (r, k) => `<section class="slide r" id="s${k + 2}">${bar(k + 2)}
  <div class="head"><span class="pill">السبب ${ar(k + 1)}</span><div class="h2">${r.h}</div></div>
  <div class="cmp">
    <div class="card bad">${lab(false, 'الإعلان اللي ما يبيع')}${r.bad}</div>
    <div class="card good">${lab(true, 'الإعلان اللي يبيع')}${r.good}${frame}</div>
    <div class="fix"><b>الحل</b><p>${r.fix}</p></div>
  </div>
  ${foot(k + 2)}
</section>`;

const last = `<section class="slide" id="s6">${bar(6)}
  <div class="h2">قبل ما تنشر<br /><em>اسأل نفسك:</em></div>
  <div class="chk">
    <div><span class="bx"><svg><use href="#i-tick" /></svg></span><p>يحچي عن الزبون؟</p></div>
    <div><span class="bx"><svg><use href="#i-tick" /></svg></span><p>بيه سعر؟</p></div>
    <div><span class="bx"><svg><use href="#i-tick" /></svg></span><p>بيه خطوة وحدة واضحة؟</p></div>
    <div><span class="bx"><svg><use href="#i-tick" /></svg></span><p>يوصل لمنطقتك وزبونك؟</p></div>
  </div>
  <div class="cta"><span class="pill">تريد إعلان يبيع؟ راسلني</span></div>
  <div class="save"><svg viewBox="0 0 24 24"><use href="#i-save" /></svg>احفظ البوست وارجعله قبل إعلانك الجاي</div>
  ${foot(6)}
</section>`;

document.getElementById('deck').innerHTML = cover + REASONS.map(reason).join('') + last;
document.getElementById('deck').style.cssText = 'display:flex; flex-direction:column; gap:40px';
const all = document.body.innerText;
Promise.all([
  document.fonts.load("900 150px 'Alexandria'", all), document.fonts.load("800 72px 'Alexandria'", '12,480 86 0'),
  document.fonts.load("500 34px 'Readex Pro'", all), document.fonts.load("600 40px 'Readex Pro'", all), document.fonts.load("700 30px 'Readex Pro'", 'الحل'),
  document.fonts.load("400 30px 'Readex Pro'", all), document.fonts.load("500 24px 'IBM Plex Mono'", '@allawi.psd 01 / 06 INSIGHTS'),
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
