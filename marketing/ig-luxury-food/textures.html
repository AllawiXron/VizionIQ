<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../identity-concepts/fonts/fonts.css" />
<!-- Artwork for the 3D products, white on transparent: the render uses the alpha as gold foil (or ink).
     Each map's pixel size matches the face it is printed on (1 cm = 100 px). -->
<style>
body{margin:0;background:transparent}
.t{position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.en{font-family:'Cormorant Garamond';font-weight:600;letter-spacing:.32em;padding-left:.32em;line-height:1}
.ar{font-family:'Aref Ruqaa';font-weight:700;direction:rtl;line-height:1.1}
.small{font-family:'Cormorant Garamond';font-weight:500;letter-spacing:.42em;padding-left:.42em;line-height:1}
.rule{background:#fff}
</style>
</head><body>

<!-- the samoon box: inside of the lid, 22 x 13 cm -->
<div class="t" id="samoon-lid" style="width:2200px;height:1300px">
  <svg width="180" height="180" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round">
    <path d="M50 6 L94 50 L50 94 L6 50 Z" /><path d="M50 22 L78 50 L50 78 L22 50 Z" stroke-width="1.4" />
    <path d="M6 50 H94 M50 6 V94" stroke-width="1" opacity=".8" /></svg>
  <div class="en" style="font-size:150px;margin-top:40px">SAMOON</div>
  <div class="ar" style="font-size:120px;margin-top:10px">سمّون</div>
  <div class="rule" style="width:420px;height:3px;margin:36px 0 34px"></div>
  <div class="small" style="font-size:48px">MAISON DE BAGDAD</div>
</div>

<!-- the amba bottle: front label, 6 x 8 cm -->
<div class="t" id="amba-label" style="width:600px;height:800px">
  <svg width="70" height="92" viewBox="0 0 60 80" fill="none" stroke="#fff" stroke-width="2.6"><path d="M30 6 C 48 14, 56 34, 52 52 C 48 70, 32 76, 22 72 C 8 66, 4 50, 10 34 C 15 20, 22 12, 30 6 Z" /><path d="M30 6 C 30 2, 33 0, 37 0" /></svg>
  <div class="en" style="font-size:118px;margin-top:26px;font-family:'Playfair Display';font-weight:400;letter-spacing:.18em;padding-left:.18em">AMBA</div>
  <div class="ar" style="font-size:78px;margin-top:6px">عمبة</div>
  <div class="rule" style="width:150px;height:2px;margin:28px 0 26px"></div>
  <div class="small" style="font-size:30px">EAU DE PARFUM</div>
  <div class="small" style="font-size:22px;margin-top:16px;opacity:.9">100 ML · 3.4 FL.OZ</div>
</div>

<!-- the amba box: front, 9 x 12 cm -->
<div class="t" id="amba-box" style="width:900px;height:1200px">
  <svg width="96" height="128" viewBox="0 0 60 80" fill="none" stroke="#fff" stroke-width="2.2"><path d="M30 6 C 48 14, 56 34, 52 52 C 48 70, 32 76, 22 72 C 8 66, 4 50, 10 34 C 15 20, 22 12, 30 6 Z" /><path d="M30 6 C 30 2, 33 0, 37 0" /></svg>
  <div class="en" style="font-size:150px;margin-top:40px;font-family:'Playfair Display';font-weight:400;letter-spacing:.2em;padding-left:.2em">AMBA</div>
  <div class="ar" style="font-size:100px;margin-top:8px">عمبة</div>
  <div class="rule" style="width:200px;height:3px;margin:40px 0 36px"></div>
  <div class="small" style="font-size:40px">EAU DE PARFUM</div>
</div>

<!-- the istikan tea tin: wrapped around a cylinder, the front at the middle -->
<div class="t" id="istikan-tin" style="width:2048px;height:1024px">
  <svg width="64" height="96" viewBox="0 0 40 60" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M8 4 H32 C 31 14, 26 20, 26 28 C 26 36, 31 42, 30 50 H10 C 9 42, 14 36, 14 28 C 14 20, 9 14, 8 4 Z" /><path d="M1 55 H39" /></svg>
  <div class="en" style="font-size:96px;margin-top:22px">ISTIKAN</div>
  <div class="ar" style="font-size:82px;margin-top:2px">استكان</div>
  <div class="rule" style="width:200px;height:2px;margin:22px 0 22px"></div>
  <div class="small" style="font-size:28px">THÉ NOIR À LA CARDAMOME</div>
</div>

<!-- the dolma box: top of the lid, 24 x 18 cm -->
<div class="t" id="dolma-lid" style="width:2400px;height:1800px">
  <svg width="200" height="200" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50 92 C 50 80, 50 70, 50 58 M50 58 C 34 64, 14 58, 8 44 C 16 42, 20 38, 18 30 C 28 32, 34 26, 34 16 C 42 22, 46 20, 50 8 C 54 20, 58 22, 66 16 C 66 26, 72 32, 82 30 C 80 38, 84 42, 92 44 C 86 58, 66 64, 50 58 Z" />
    <path d="M50 58 L 50 20 M50 52 L 28 38 M50 52 L 72 38 M50 44 L 38 28 M50 44 L 62 28" stroke-width="1.4" /></svg>
  <div class="en" style="font-size:190px;margin-top:50px">DOLMA</div>
  <div class="ar" style="font-size:150px;margin-top:6px">دولمة</div>
  <div class="rule" style="width:480px;height:3px;margin:46px 0 44px"></div>
  <div class="small" style="font-size:58px">PRALINES DE BAGDAD</div>
  <div class="small" style="font-size:40px;margin-top:22px;opacity:.9">12 PIÈCES</div>
</div>

<script>
document.fonts.ready.then(() => Promise.all([
  document.fonts.load("700 100px 'Aref Ruqaa'", 'سمّون عمبة استكان دولمة'),
  document.fonts.load("600 100px 'Cormorant Garamond'", 'SAMOON'),
  document.fonts.load("500 100px 'Cormorant Garamond'", 'MAISON'),
  document.fonts.load("400 100px 'Playfair Display'", 'AMBA'),
])).then(() => (document.body.dataset.ready = 1));
</script></body></html>
