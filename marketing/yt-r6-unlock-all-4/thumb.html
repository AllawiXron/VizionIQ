<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>R6 Unlock All 4</title>
<style>
@font-face { font-family: Jakarta; src: url(fonts/PlusJakartaSans-VF.ttf); font-weight: 200 800; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; }
.f { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #d9b94a; }
.f > * { position: absolute; }

/* 1. background: the poster's own yellow, grain and streaks */
.bg { inset: 0; }

/* 2. the menu, rebuilt from the Recoil tab screenshot, top left */
.menu { left: 34px; top: 46px; width: 1396px; height: 1127px; transform-origin: 0 0;
  transform: perspective(2400px) scale(.45) rotateY(10deg) rotateZ(-3deg); }
.panel { position: absolute; inset: 0; background: #0b0b0e; border-radius: 22px; font-family: Jakarta; font-weight: 700; color: #f1eef4;
  box-shadow: 0 0 0 5px rgba(255, 250, 230, .5), 0 50px 90px rgba(70, 52, 0, .5), 0 12px 24px rgba(40, 30, 0, .35); }
.panel > * { position: absolute; }
.p-logo { left: 45px; top: 34px; font-size: 41px; }
.p-tab { top: 20px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 38px; color: #c9c5d0; }
.p-tab.on { left: 622px; width: 258px; background: #1d1d23; border-radius: 16px; color: #f6f3f8; }
.p-tab.on::after { content: ''; position: absolute; left: 34px; right: 34px; bottom: 2px; height: 6px; border-radius: 3px; background: #f7dfee; }
.rule { left: 30px; right: 30px; height: 2px; background: #26262c; }
.sec { left: 44px; font-size: 40px; color: #d9d5de; display: flex; align-items: center; gap: 26px; }
.sec::before { content: ''; width: 20px; height: 20px; border-radius: 50%; background: #f4f1f6; }
.lab { left: 46px; font-size: 38px; }
.val { right: 48px; font-size: 38px; }
.box { left: 1295px; top: 240px; width: 51px; height: 51px; border-radius: 9px; background: #f7dcec;
  box-shadow: 0 0 26px rgba(247, 210, 232, .55); }
.box::after { content: ''; position: absolute; left: 17px; top: 9px; width: 12px; height: 23px; border: solid #17121a; border-width: 0 5px 5px 0; transform: rotate(42deg); }
.track { left: 80px; width: 1258px; height: 13px; border-radius: 7px; background: #1e1e24; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: #f6e0ee; }
.knob { width: 56px; height: 56px; border-radius: 50%; background: #fbfafc; box-shadow: 0 0 0 5px #3a3940, 0 0 20px rgba(255, 255, 255, .25); }
.note { left: 46px; top: 548px; font-size: 34px; color: #9a97a2; }
.key { left: 1085px; width: 266px; height: 83px; border-radius: 13px; background: #1b1c21; border: 2px solid #26272d;
  display: flex; align-items: center; justify-content: center; font-size: 37px; }
.foot { top: 1058px; font-size: 33px; color: #8e8b96; }

/* 3. Sledge, his hammer face on the C; 4. the concrete title in front of him, broken where the hammer comes
   through, and the pieces flying out (title.py) */
.sledge { left: 320px; top: 68px; width: 1800px; filter: drop-shadow(0 22px 30px rgba(40, 30, 0, .45)); }
.title, .chunks { inset: 0; }

/* finish */
.vig { inset: 0; background:
  linear-gradient(0deg, rgba(60, 40, 0, .26) 0%, rgba(60, 40, 0, 0) 16%),
  linear-gradient(90deg, rgba(60, 40, 0, .2) 0%, rgba(60, 40, 0, 0) 10%, rgba(60, 40, 0, 0) 90%, rgba(60, 40, 0, .2) 100%); }
</style>
</head>
<body>
<div class="f" id="thumb">
  <img class="bg" src="img/bg.jpg">

  <div class="menu"><div class="panel">
    <div class="p-logo">UnlockX</div>
    <div class="p-tab on">Recoil</div>
    <div class="p-tab" style="left:930px;width:150px">HUD</div>
    <div class="p-tab" style="left:1170px;width:180px">Account</div>
    <div class="rule" style="top:121px"></div>
    <div class="sec" style="top:160px">General</div>
    <div class="lab" style="top:245px">Enabled</div>
    <div class="box"></div>
    <div class="lab" style="top:322px">Keep</div><div class="val" style="top:322px">0.69</div>
    <div class="track" style="top:384px"><i style="width:868px"></i></div>
    <div class="knob" style="left:921px;top:362px"></div>
    <div class="lab" style="top:435px">Step</div><div class="val" style="top:435px">0.34</div>
    <div class="track" style="top:499px"><i style="width:858px"></i></div>
    <div class="knob" style="left:911px;top:477px"></div>
    <div class="note">0 = full kill, 1 = no effect</div>
    <div class="sec" style="top:655px">Hotkeys</div>
    <div class="lab" style="top:740px">Tighten</div><div class="key" style="top:720px">F1</div>
    <div class="lab" style="top:838px">Weaken</div><div class="key" style="top:818px">F2</div>
    <div class="lab" style="top:934px">Disable</div><div class="key" style="top:917px">End</div>
    <div class="rule" style="top:1034px"></div>
    <div class="foot" style="left:46px">INSERT to hide</div>
    <div class="foot" style="right:46px;color:#c6c3cc">welcome, <span style="color:#f1eef4">LCKYLucky</span></div>
  </div></div>

  <img class="sledge" src="img/sledge.png">
  <img class="title" src="img/title.png">
  <img class="chunks" src="img/chunks.png">

  <div class="vig"></div>
</div>
<script>
document.fonts.load('700 38px Jakarta')
  .then(() => Promise.all([...document.images].map((i) => i.decode())))
  .then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
