<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Al-Waseet — بينك وبين زبونك</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root {
    --navy: #2d2f64;      /* sampled from the Al-Waseet globe mark */
    --navy-2: #1f2150;
    --red: #cc1f2c;       /* sampled from the Al-Waseet globe mark */
    --royal: #2b47a8;     /* the van livery */
    --paper: #f4f5f9;
    --ink-soft: rgba(45, 47, 100, 0.66);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: "Alexandria", sans-serif; color: var(--navy); direction: rtl;
    background:
      radial-gradient(70% 38% at 50% 74%, rgba(43, 71, 168, 0.14) 0%, rgba(43, 71, 168, 0) 70%),
      radial-gradient(120% 80% at 50% 0%, #ffffff 0%, var(--paper) 60%, #e9ebf3 100%);
  }
  .grain {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0.22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.19  0 0 0 0 0.4  0 0 0 0.5 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* faint coverage map of Iraq: every governorate capital wired to Baghdad */
  .map { position: absolute; z-index: 1; }

  /* top bar */
  .top { position: absolute; top: 56px; right: 64px; left: 64px; z-index: 20; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo .mark { height: 78px; }
  .logo .wm { height: 66px; }
  .handle { direction: ltr; font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.06em; color: var(--ink-soft); }

  /* headline */
  .h1 { position: absolute; top: 178px; left: 0; right: 0; z-index: 20; text-align: center; }
  .h1 .a { font-weight: 800; font-size: 96px; line-height: 1.1; letter-spacing: -0.01em; }
  .h1 .b { font-weight: 900; font-size: 206px; line-height: 1; color: var(--red); margin-top: 0; }
  .h1 .c { font-weight: 400; font-size: 32px; line-height: 1.5; color: var(--ink-soft); margin-top: 34px; }
  .h1 .c b { font-weight: 700; color: var(--navy); }

  /* hero */
  .route { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .van { position: absolute; z-index: 6; width: 600px; left: 240px; top: 690px; filter: drop-shadow(0 30px 26px rgba(20, 24, 70, 0.22)); }
  .shadow { position: absolute; z-index: 5; left: 270px; top: 1052px; width: 560px; height: 56px; border-radius: 50%; background: radial-gradient(closest-side, rgba(20, 24, 70, 0.45), rgba(20, 24, 70, 0)); }
  .pin { position: absolute; z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: translate(-50%, -52px); }
  .pin .chip { background: var(--navy); color: #fff; font-weight: 700; font-size: 28px; line-height: 1; padding: 13px 22px 15px; border-radius: 16px; box-shadow: 0 10px 22px rgba(20, 24, 70, 0.25); white-space: nowrap; }
  .pin .chip.red { background: var(--red); }
  .pin small { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.12em; color: var(--ink-soft); direction: ltr; text-transform: uppercase; }
  .pin svg { width: 40px; height: 52px; filter: drop-shadow(0 6px 6px rgba(20, 24, 70, 0.25)); }

  .parcel { position: absolute; z-index: 7; left: 151px; top: 727px; width: 60px; height: 60px; border-radius: 99px; background: #fff; color: var(--red); display: grid; place-items: center; box-shadow: 0 10px 20px rgba(20, 24, 70, 0.18), 0 0 0 3px rgba(204, 31, 44, 0.9); }
  .parcel svg { width: 30px; height: 30px; }
  .hub { position: absolute; z-index: 7; left: 540px; top: 580px; transform: translateX(-50%); font-size: 18px; font-weight: 600; color: var(--red); letter-spacing: 0.02em; }

  /* services */
  .svc { position: absolute; left: 64px; right: 64px; top: 1124px; z-index: 20; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 2px solid var(--navy); }
  .svc div { display: flex; align-items: center; gap: 14px; padding: 20px 10px 0 0; }
  .svc div + div { border-right: 1px solid rgba(45, 47, 100, 0.22); padding-right: 22px; }
  .svc svg { width: 34px; height: 34px; flex: none; color: var(--red); }
  .svc span { font-size: 22px; font-weight: 600; line-height: 1.3; }

  /* call to action */
  .cta { position: absolute; left: 64px; right: 64px; bottom: 54px; z-index: 20; display: flex; justify-content: space-between; align-items: center; }
  .btn { display: flex; align-items: center; gap: 14px; background: var(--red); color: #fff; font-weight: 700; font-size: 30px; padding: 16px 30px 18px; border-radius: 18px; box-shadow: 0 14px 28px rgba(204, 31, 44, 0.32); }
  .btn svg { width: 28px; height: 28px; }
  .stores { display: flex; align-items: center; gap: 12px; direction: ltr; font-family: "IBM Plex Mono", monospace; font-size: 17px; font-weight: 500; letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; }
  .stores i { width: 5px; height: 5px; border-radius: 99px; background: var(--red); display: inline-block; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad > [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad > [data-l="bg"], body.m-logo .ad > [data-l="logo"], body.m-txt .ad > [data-l="txt"],
  body.m-route .ad > [data-l="route"], body.m-van .ad > [data-l="van"] { visibility: visible; }
</style>
</head>

<script>
  // governorate capitals (projected into the map's 1000×1013 box) wired to Baghdad
  const C = {"بغداد": [571.5, 494.8], "البصرة": [920.7, 836.9], "الموصل": [445.2, 126.2], "أربيل": [535.0, 144.3], "السليمانية": [680.9, 221.1], "دهوك": [430.6, 62.0], "كركوك": [574.1, 232.4], "تكريت": [501.2, 337.4], "الرمادي": [462.4, 481.3], "بعقوبة": [599.8, 441.8], "الكوت": [720.5, 593.4], "الحلة": [578.3, 596.2], "كربلاء": [536.6, 580.0], "النجف": [566.3, 655.5], "الديوانية": [628.6, 656.0], "السماوة": [664.9, 739.3], "الناصرية": [764.7, 771.5], "العمارة": [855.5, 675.0], "حلبجة": [737.0, 267.8]};
  const [bx, by] = C['بغداد'];
  let links = '', dots = '';
  for (const [name, [x, y]] of Object.entries(C)) {
    if (name !== 'بغداد') {
      const mx = (bx + x) / 2, my = (by + y) / 2 - Math.hypot(x - bx, y - by) * 0.18;
      links += `<path d="M${bx},${by} Q${mx},${my} ${x},${y}" />`;
      dots += `<circle cx="${x}" cy="${y}" r="6" fill="rgba(45,47,100,0.35)" />`;
    }
  }
  document.getElementById('links').innerHTML = links;
  document.getElementById('dots').innerHTML = dots;
</script>
