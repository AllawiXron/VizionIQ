<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Al-Waseet — أجدادنا شالوا الأمانة</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root {
    --navy: #0b1650;
    --red: #e0262f;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--white); background: #13258f; }
  /* the 3D render (Blender/Cycles), composited in build_hero.py */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* grade: deeper navy corners like Al-Waseet's posts, a soft beam from the spotlight */
  .grade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(85% 70% at 50% 42%, rgba(11, 22, 80, 0) 55%, rgba(6, 12, 52, 0.62) 100%),
      linear-gradient(180deg, rgba(6, 12, 52, 0.28) 0%, rgba(6, 12, 52, 0) 18%, rgba(6, 12, 52, 0) 80%, rgba(6, 12, 52, 0.45) 100%);
  }
  .beam {
    position: absolute; z-index: 3; pointer-events: none; left: -260px; top: -420px; width: 900px; height: 1500px;
    transform: rotate(-31deg); transform-origin: 50% 0;
    background: linear-gradient(90deg, rgba(190, 210, 255, 0) 0%, rgba(190, 210, 255, 0.10) 42%, rgba(190, 210, 255, 0.14) 50%, rgba(190, 210, 255, 0.10) 58%, rgba(190, 210, 255, 0) 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 85%); -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 85%);
    mix-blend-mode: screen;
  }
  .grain {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0.28; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* logo */
  .logo { position: absolute; z-index: 10; top: 44px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
  .logo img { filter: brightness(0) invert(1); }
  .logo .wm { height: 58px; }
  .logo .mark { height: 74px; }

  /* headline: Ruqaa, two lines */
  .h1 {
    position: absolute; z-index: 10; top: 136px; left: 0; right: 0; text-align: center; direction: rtl;
    font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 74px; line-height: 1.26; word-spacing: 0.24em;
    text-shadow: 0 6px 24px rgba(4, 10, 50, 0.55);
  }

  /* red chevrons, the arrow from Al-Waseet's mark */
  .chev { position: absolute; z-index: 9; pointer-events: none; }
  .chev path { fill: none; stroke: var(--red); stroke-linecap: square; stroke-linejoin: miter; }

  /* footer like Al-Waseet's posts */
  .foot { position: absolute; z-index: 10; bottom: 34px; left: 0; right: 0; text-align: center; font-family: "Alexandria"; font-weight: 500; font-size: 13px; letter-spacing: 0.12em; line-height: 1.5; color: rgba(255, 255, 255, 0.86); }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad > [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad > [data-l="bg"], body.m-logo .ad > [data-l="logo"], body.m-txt .ad > [data-l="txt"],
  body.m-chev .ad > [data-l="chev"] { visibility: visible; }
</style>
</head>
<body>
<section class="ad" id="ad">
  <img class="hero" data-l="bg" src="img/hero.png" alt="" />
  <div class="grade" data-l="bg"></div>
  <div class="beam" data-l="bg"></div>
  <div class="grain" data-l="bg"></div>

  <div class="logo" data-l="logo"><img class="wm" src="img/wordmark.png" alt="شركة الوسيط" /><img class="mark" src="img/mark.png" alt="" /></div>

  <h1 class="h1" data-l="txt">أجدادنا شالوا الأمانة<br>وإحنا كملنا الطريق</h1>

  <!-- chevrons: big pair top-right and bottom-left (soft, out of focus), small marks beside the headline -->
  <svg class="chev" data-l="chev" style="right: -58px; top: 26px; width: 230px; height: 150px; filter: blur(3.5px); opacity: .85" viewBox="0 0 260 170"><path d="M150 20 L90 85 L150 150" stroke-width="26" /><path d="M235 20 L175 85 L235 150" stroke-width="26" /></svg>
  <svg class="chev" data-l="chev" style="left: -70px; bottom: 54px; width: 230px; height: 150px; filter: blur(4px); opacity: .8" viewBox="0 0 260 170"><path d="M110 20 L170 85 L110 150" stroke-width="26" /><path d="M25 20 L85 85 L25 150" stroke-width="26" /></svg>
  <svg class="chev" data-l="chev" style="right: 196px; top: 128px; width: 30px; height: 30px" viewBox="0 0 30 30"><path d="M22 6 L10 15 L22 24" stroke-width="5" /></svg>
  <svg class="chev" data-l="chev" style="left: 214px; top: 236px; width: 30px; height: 30px" viewBox="0 0 30 30"><path d="M8 6 L20 15 L8 24" stroke-width="5" /></svg>

  <div class="foot" data-l="txt">AL-WASEET COMPANY<br>FOR FAST DELIVERY</div>
</section>
</body>
</html>
