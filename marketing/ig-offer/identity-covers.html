<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../ig-brand-posts/fonts/src.css" />
<link rel="stylesheet" href="../ig-food-brands/fonts/fonts.css" />
<!-- allawi.psd «هويات» highlight cover (identity work, first case study: ../gift-cactus/showcase.html #st1-#st6), 1080x1920.
     A pen-tool nib, drawn in the three styles of the «الأسعار» options in covers.html so the pair matches whichever is on the profile.
     #preview pairs each with its «الأسعار» cover; it reads the PNGs, so render twice. -->
<style>
:root { --paper:#ece3d4; --ink:#1f1510; --orange:#e2541b; --orange-2:#f07a2e; --cream:#fbf3e6 }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#333; display:flex; flex-wrap:wrap; gap:40px; padding:40px; width:3500px; align-items:flex-start }
.art { flex:none; position:relative; width:1080px; height:1920px; overflow:hidden }
.c { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) }

/* A: the nib selected like a Photoshop layer, on paper */
#a { background:var(--paper) }
#a .sel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:30px 50px }
#a .sel > .ico { display:block; width:400px; height:600px }
.frame { position:absolute; inset:0; border:5px solid var(--ink) }
.frame i { position:absolute; width:34px; height:34px; background:var(--cream); border:5px solid var(--ink) }
.frame .tl { left:-20px; top:-20px } .frame .tr { right:-20px; top:-20px } .frame .bl { left:-20px; bottom:-20px } .frame .br { right:-20px; bottom:-20px }
.frame .tm { left:calc(50% - 17px); top:-20px } .frame .bm { left:calc(50% - 17px); bottom:-20px } .frame .ml { left:-20px; top:calc(50% - 17px) } .frame .mr { right:-20px; top:calc(50% - 17px) }
#a .cursor { position:absolute; right:-80px; bottom:-96px; width:110px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)) }

/* B: a cream nib on orange */
#b { background:radial-gradient(circle at 50% 45%, var(--orange-2) 0%, var(--orange) 55%, #c4440f 100%) }
#b svg.st { width:660px; height:660px; filter:drop-shadow(0 30px 40px rgba(90,25,0,.35)) }

/* C: dark, orange ring, cream outline */
#c { background:var(--ink) }
#c .ring { width:820px; height:820px; border-radius:50%; border:30px solid var(--orange); display:flex; align-items:center; justify-content:center }
#c .ring svg { width:530px; height:530px; color:var(--cream) }

/* preview */
#preview { width:1300px; background:#000; color:#f5f5f5; font-family:'Readex Pro'; direction:rtl; padding:60px 80px }
#preview h4 { font:500 26px 'IBM Plex Mono'; direction:ltr; text-align:left; color:#8a8a8a; margin-bottom:40px }
#preview .row { display:flex; justify-content:space-around }
#preview .pair { display:flex; gap:26px }
#preview .hl { text-align:center; font:400 26px 'Readex Pro' }
#preview .ci { width:170px; height:170px; border-radius:50%; padding:6px; border:3px solid #3a3a3a; margin-bottom:18px }
#preview .ci div { width:100%; height:100%; border-radius:50%; background-size:cover; background-position:center }
#preview .k { margin-top:26px; font:500 24px 'IBM Plex Mono'; color:#e2541b; direction:ltr; text-align:center }
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5 6.3-.3z" fill="#1f1510" stroke="#fbf3e6" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <!-- pen-tool nib on the «الأسعار» tag icon's 24px grid: body, collar, slit, and the hole as the orange accent -->
  <path id="nib" d="M12 21.4C9.6 17.6 6.1 14.6 6.5 10.6L8.4 6.6H15.6L17.5 10.6C17.9 14.6 14.4 17.6 12 21.4Z" />
  <symbol id="i-nib" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <use href="#nib" />
    <rect x="8.2" y="2.6" width="7.6" height="4" rx="1" />
    <path d="M12 21.4V14.2" />
    <circle cx="12" cy="12.2" r="1.45" fill="#e2541b" stroke="none" />
  </symbol>
</defs></svg>

<div class="art" id="a">
  <div class="sel">
    <svg class="ico" viewBox="5.4 1.6 13.2 20.8" stroke-linejoin="round" stroke-linecap="round">
      <use href="#nib" fill="#1f1510" stroke="#1f1510" stroke-width="1.6" />
      <rect x="8.2" y="2.6" width="7.6" height="4" rx="1" fill="#1f1510" stroke="#1f1510" stroke-width="1.6" />
      <path d="M8.4 6.6H15.6" stroke="#ece3d4" stroke-width=".7" />
      <path d="M12 21.6V14.2" stroke="#ece3d4" stroke-width=".75" />
      <circle cx="12" cy="12.2" r="1.5" fill="#e2541b" />
    </svg>
    <div class="frame"><i class="tl"></i><i class="tm"></i><i class="tr"></i><i class="ml"></i><i class="mr"></i><i class="bl"></i><i class="bm"></i><i class="br"></i></div>
    <svg class="cursor" viewBox="0 0 24 24"><use href="#i-cursor" /></svg></div>
</div>

<div class="art" id="b">
  <svg class="st c" viewBox="0 0 24 24">
    <g transform="rotate(-18 12 12)" stroke-linejoin="round" stroke-linecap="round">
      <use href="#nib" fill="#fbf3e6" stroke="#fbf3e6" stroke-width="1.6" />
      <rect x="8.2" y="2.6" width="7.6" height="4" rx="1" fill="#1f1510" stroke="#1f1510" stroke-width="1.6" />
      <path d="M12 21.6V14.2" stroke="#1f1510" stroke-width=".75" />
      <circle cx="12" cy="12.2" r="1.5" fill="#e2541b" />
    </g>
  </svg>
</div>

<div class="art" id="c"><div class="ring c"><svg><use href="#i-nib" /></svg></div></div>

<div class="art" id="preview" style="height:480px">
  <h4>HOW IT LOOKS ON YOUR PROFILE</h4>
  <div class="row">
    <div><div class="pair">
      <div class="hl"><div class="ci"><div style="background-image:url(out/covers-a.png)"></div></div>الأسعار</div>
      <div class="hl"><div class="ci"><div style="background-image:url(out/identity-covers-a.png)"></div></div>هويات</div>
    </div><div class="k">A</div></div>
    <div><div class="pair">
      <div class="hl"><div class="ci"><div style="background-image:url(out/covers-b.png)"></div></div>الأسعار</div>
      <div class="hl"><div class="ci"><div style="background-image:url(out/identity-covers-b.png)"></div></div>هويات</div>
    </div><div class="k">B</div></div>
    <div><div class="pair">
      <div class="hl"><div class="ci"><div style="background-image:url(out/covers-c.png)"></div></div>الأسعار</div>
      <div class="hl"><div class="ci"><div style="background-image:url(out/identity-covers-c.png)"></div></div>هويات</div>
    </div><div class="k">C</div></div>
  </div>
</div>

<script>
Promise.all([
  document.fonts.load("400 26px 'Readex Pro'", 'الأسعار هويات'),
  document.fonts.load("500 24px 'IBM Plex Mono'", 'HOW IT LOOKS ON YOUR PROFILE ABC'),
  ...['covers-a', 'covers-b', 'covers-c', 'identity-covers-a', 'identity-covers-b', 'identity-covers-c']
    .map((n) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = `out/${n}.png`; })),
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
