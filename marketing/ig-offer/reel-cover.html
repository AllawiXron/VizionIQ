<!doctype html>
<html lang="ar"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../ig-brand-posts/fonts/src.css" />
<link rel="stylesheet" href="../ig-food-brands/fonts/fonts.css" />
<!-- Reel cover for the before/after promo (hf-allawi-promo), in the video's dark look.
     #reelcover 1080x1920. Everything that matters sits inside the profile grid's 3:4 window (y 240-1680). -->
<style>
:root { --ink:#1f1510; --orange:#e2541b; --orange-2:#f07a2e; --peach:#ffb37a; --cream:#fbf3e6 }
* { box-sizing:border-box; margin:0; padding:0 }
body { background:#333; padding:40px }
.art { position:relative; width:1080px; height:1920px; overflow:hidden; direction:rtl; color:var(--cream); font-family:'Readex Pro';
  background:radial-gradient(85% 55% at 68% 34%, #3d2517 0%, #22150d 50%, #110a06 100%) }
.art::after { content:""; position:absolute; inset:0; z-index:50; pointer-events:none; opacity:.22; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.6'/></svg>") }
.rings { position:absolute; inset:0; background:repeating-radial-gradient(circle at 70% 40%, rgba(255,190,140,.04) 0 80px, transparent 80px 200px) }
.glow { position:absolute; left:160px; top:820px; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(240,122,46,.28), rgba(240,122,46,0) 65%) }
.ghost { position:absolute; left:-240px; top:1420px; font:900 520px/1 'Alexandria'; color:rgba(251,243,230,.045); white-space:nowrap }
.sw { position:absolute; inset:0; width:1080px; height:1920px; overflow:visible }
.meta { position:absolute; top:282px; font:500 26px 'IBM Plex Mono'; letter-spacing:.08em; color:rgba(251,243,230,.6); direction:ltr; white-space:nowrap }
.dot { display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--orange-2); margin-right:14px; vertical-align:1px }
.rule { position:absolute; left:70px; right:70px; top:338px; height:3px; background:rgba(251,243,230,.2) }

.block { position:absolute; right:70px; left:70px; top:372px; display:flex; flex-direction:column; align-items:flex-start }
.lead { font:500 74px/1.3 'Readex Pro'; color:rgba(251,243,230,.84); white-space:nowrap }
.hero { font:900 150px/1.18 'Alexandria'; white-space:nowrap }
/* highlight box with selection handles (the video's marker) */
.hl { position:relative; display:inline-block; padding:2px 46px 24px; margin-top:44px }
.hl .box { position:absolute; inset:0; background:var(--orange); border-radius:12px; box-shadow:0 26px 60px rgba(226,84,27,.38) }
.hl .hd { position:absolute; width:6px; background:var(--cream) }
.hl .hd::after { content:""; position:absolute; left:-12px; width:30px; height:30px; border-radius:50%; background:var(--cream) }
.hl .hd.r { right:-3px; top:-30px; height:calc(100% + 30px) } .hl .hd.r::after { top:-15px }
.hl .hd.l { left:-3px; bottom:-30px; height:calc(100% + 30px) } .hl .hd.l::after { bottom:-15px }
.hl .hero { position:relative; font-size:176px; color:var(--cream) }

/* before / after slider */
.ba { position:absolute; left:230px; top:1000px; width:620px; height:600px; border-radius:30px; overflow:hidden; transform:rotate(-2.5deg);
  box-shadow:0 60px 120px rgba(0,0,0,.6), 0 0 0 10px rgba(251,243,230,.92) }
.ba .b { position:absolute; inset:0; background:url(../hf-allawi-promo/assets/img/before.jpg) 58% 50% / cover no-repeat }
.ba .a { position:absolute; inset:0; background:url(../hf-allawi-promo/assets/img/after.jpg) 50% 30% / cover no-repeat; clip-path:inset(0 0 0 46%) }
.ba .d { position:absolute; left:calc(46% - 3px); top:0; width:6px; height:100%; background:var(--cream); box-shadow:0 0 20px rgba(0,0,0,.35) }
.ba .h { position:absolute; left:calc(46% - 46px); top:calc(50% - 46px); width:92px; height:92px; border-radius:50%; background:var(--cream);
  box-shadow:0 10px 24px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center }
.ba .h svg { width:54px; height:54px }
.tag { position:absolute; z-index:3; padding:10px 32px 16px; border-radius:999px; font:600 40px 'Readex Pro'; white-space:nowrap; box-shadow:0 14px 30px rgba(0,0,0,.4) }
.tag.b4 { left:250px; top:962px; transform:rotate(-2.5deg); background:var(--cream); color:var(--ink) }
.tag.af { left:700px; top:942px; transform:rotate(-2.5deg); background:var(--orange); color:#fff }
.cur { position:absolute; left:526px; top:1316px; width:56px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)) }

/* price sticker + handle */
.price { position:absolute; right:96px; top:1548px; transform:rotate(-4deg); display:flex; align-items:baseline; gap:14px; padding:18px 40px 26px;
  border-radius:999px; background:var(--cream); color:var(--ink); box-shadow:0 24px 50px rgba(0,0,0,.45); white-space:nowrap }
.price span { font:500 38px 'Readex Pro'; color:rgba(31,21,16,.72) }
.price b { font:900 58px 'Alexandria'; color:var(--orange) }
.handle { position:absolute; left:70px; top:1622px; font:500 30px 'IBM Plex Mono'; color:rgba(251,243,230,.7); direction:ltr; white-space:nowrap }
</style></head>
<body>
<div class="art" id="reelcover">
  <div class="rings"></div>
  <div class="glow"></div>
  <div class="ghost">إعلان</div>
  <svg class="sw" viewBox="0 0 1080 1920">
    <path d="M -120 1560 C 260 1260, 700 1760, 1200 1180" fill="none" stroke="#f07a2e" stroke-width="26" stroke-linecap="round" opacity=".9" />
    <path d="M 1200 760 C 900 960, 420 640, -120 900" fill="none" stroke="rgba(251,243,230,.55)" stroke-width="10" stroke-linecap="round" />
  </svg>

  <div class="meta" style="left:70px;"><span class="dot"></span>alshifa_offer.psd</div>
  <div class="meta" style="right:70px; direction:rtl; font-family:'Readex Pro'; letter-spacing:0;">قبل ← بعد</div>
  <div class="rule"></div>

  <div class="block">
    <div class="lead">صورة عادية..</div>
    <div class="hero">صارت إعلان</div>
    <div class="hl"><div class="box"></div><i class="hd r"></i><i class="hd l"></i><div class="hero">يبيع</div></div>
  </div>

  <div class="ba">
    <div class="b"></div>
    <div class="a"></div>
    <div class="d"></div>
    <div class="h"><svg viewBox="0 0 24 24" fill="none" stroke="#1f1510" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6" /></svg></div>
  </div>
  <div class="tag b4">قبل</div>
  <div class="tag af">بعد</div>
  <svg class="cur" viewBox="0 0 40 56"><path d="M3 3 L3 44 L13 34.5 L20.5 52 L28.5 48.5 L21 31.5 L35 31.5 Z" fill="#fff" stroke="#1f1510" stroke-width="3" stroke-linejoin="round" /></svg>

  <div class="price"><span>التصميم يبدي من</span><b>14 ألف</b></div>
  <div class="handle"><span class="dot"></span>@allawi.psd</div>
</div>
<script>
Promise.all([
  document.fonts.load("500 74px 'Readex Pro'", 'صورة عادية.. التصميم يبدي من قبل بعد'),
  document.fonts.load("600 40px 'Readex Pro'", 'قبل بعد'),
  document.fonts.load("900 176px 'Alexandria'", 'صارت إعلان يبيع 14 ألف'),
  document.fonts.load("500 26px 'IBM Plex Mono'", 'alshifa_offer.psd @allawi.psd'),
]).then(() => document.fonts.ready).then(() => (document.body.dataset.ready = 1));
</script>
</body></html>
