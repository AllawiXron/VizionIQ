<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Sala — لا تخلي البيض كله بسلة وحدة</title>
<link rel="stylesheet" href="fonts/src.css" />
<style>
  :root { --red: #e10b17; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; display: flex; justify-content: center; padding: 40px 0; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; font-family: "Alexandria", sans-serif;
    background: radial-gradient(70% 55% at 50% 60%, #f0222c 0%, #e10b17 45%, #b9000d 100%); }
  /* their own doodle pattern (from sala-iqr.com), the empty middle framing the basket */
  .doodles { position: absolute; z-index: 1; left: -310px; top: 392px; width: 1700px; opacity: 0.2; }
  .grain {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0.22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }

  /* headline: the proverb, then the answer */
  .q { position: absolute; z-index: 10; top: 58px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 700; font-size: 50px; line-height: 1.35; white-space: nowrap; color: rgba(255, 255, 255, 0.9); }
  .q small { display: block; font-weight: 600; font-size: 24px; letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.75); margin-bottom: 4px; }
  .a { position: absolute; z-index: 10; top: 182px; left: 0; right: 0; text-align: center; direction: rtl; font-weight: 900; font-size: 196px; line-height: 1.25; white-space: nowrap; letter-spacing: -0.01em; text-shadow: 0 16px 40px rgba(110, 0, 6, 0.4); }
  .scribble { position: absolute; z-index: 11; left: 0; top: 0; width: 1080px; height: 1350px; pointer-events: none; }

  /* the basket: a real photo, cut out */
  .basket { position: absolute; z-index: 5; left: 200px; top: 556px; width: 680px; transform: rotate(-7deg); filter: saturate(1.06) sepia(0.06) drop-shadow(0 26px 22px rgba(80, 0, 4, 0.5)) drop-shadow(0 4px 6px rgba(50, 0, 2, 0.4)); }
  .glow { position: absolute; z-index: 1; left: 90px; top: 430px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 120, 110, 0.38), rgba(255, 120, 110, 0)); }
  .contact { position: absolute; z-index: 4; left: 255px; top: 1148px; width: 620px; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(70, 0, 4, 0.55), rgba(70, 0, 4, 0)); filter: blur(4px); }

  /* the app card, in their own UI language («اضافة الى السلة») */
  .pin { position: absolute; z-index: 10; left: 452px; top: 616px; direction: rtl; }
  .card { display: flex; align-items: center; gap: 16px; background: #fff; color: #1d1d1f; border-radius: 22px; padding: 14px 16px 14px 22px; box-shadow: 0 20px 44px rgba(80, 0, 4, 0.45); white-space: nowrap; }
  .card .ic { width: 58px; height: 58px; border-radius: 16px; background: var(--red); display: grid; place-items: center; flex: none; }
  .card .th { width: 62px; height: 62px; border-radius: 14px; object-fit: cover; flex: none; }
  .card .t b { display: block; font-weight: 800; font-size: 25px; line-height: 1.3; }
  .card .t span { display: block; font-weight: 500; font-size: 16px; color: #6b6b70; line-height: 1.4; }
  .card .ok { flex: none; background: var(--red); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .card .ok svg { width: 18px; height: 18px; }
  .pin .tail { position: absolute; left: 250px; bottom: -12px; width: 26px; height: 26px; background: #fff; transform: rotate(45deg); border-radius: 4px; }

  /* footer */
  .foot { position: absolute; z-index: 10; left: 56px; right: 56px; bottom: 48px; display: flex; justify-content: space-between; align-items: center; direction: rtl; }
  .foot .brand { display: flex; align-items: center; gap: 22px; }
  .foot .brand img { height: 58px; display: block; }
  .foot .brand span { font-weight: 600; font-size: 20px; line-height: 1.5; color: rgba(255, 255, 255, 0.92); padding-right: 22px; border-right: 2px solid rgba(255, 255, 255, 0.4); }
  .foot .cta { background: #fff; color: var(--red); font-weight: 800; font-size: 22px; padding: 14px 26px; border-radius: 16px; }

  /* layer export (one PSD layer at a time) */
  body.export { background: transparent; padding: 0; display: block; }
  body.export .ad [data-l] { visibility: hidden; }
  body.export:not(.m-bg) .ad { background: none; }
  body.m-bg .ad [data-l="bg"], body.m-food .ad [data-l="food"], body.m-card .ad [data-l="card"],
  body.m-txt .ad [data-l="txt"], body.m-logo .ad [data-l="logo"] { visibility: visible; }
</style>
</head>
<body>
<section class="ad" id="ad">
  <img class="doodles" data-l="bg" src="img/doodles.png" alt="" />
  <div class="grain" data-l="bg"></div>

  <div class="q" data-l="txt"><small>بيبيتك تگول:</small>لا تخلي البيض كله بسلة وحدة</div>
  <div class="a" data-l="txt">إلا هاي.</div>
  <!-- hand-drawn circle around «هاي» and an arrow to the basket, in the line style of their doodles -->
  <svg class="scribble" data-l="txt" viewBox="0 0 1080 1350" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- one stroke: underline under «هاي» that drops into an arrow onto the basket -->
    <path d="M622 492 C 520 506, 330 508, 214 488 C 160 478, 150 520, 176 560 C 196 592, 220 610, 250 624" />
    <path d="M216 622 L 252 626 L 250 590" />
  </svg>

  <div class="glow" data-l="bg"></div>
  <div class="contact" data-l="food"></div>
  <img class="basket" data-l="food" src="img/basket.png" alt="" />

  <div class="pin" data-l="card">
    <div class="card">
      <img class="th" src="img/thumb-eggs.jpg" alt="" />
      <div class="t"><b>طبقة بيض، ٣٠ حبة</b><span>توصيل للرمادي والفلوجة</span></div>
      <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>أضيفت للسلة</div>
    </div>
    <i class="tail"></i>
  </div>

  <div class="foot">
    <div class="brand"><img data-l="logo" src="img/logo-white.png" alt="سلة" /><span data-l="txt">تسوّق بذكاء من بيتك</span></div>
    <div class="cta" data-l="txt">حمّل التطبيق</div>
  </div>
</section>
</body>
</html>
