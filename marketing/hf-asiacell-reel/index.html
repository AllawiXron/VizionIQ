:root { --red:#e82228; --neon:#ff4049; --ink:#1f1510; --cream:#fbf3e6; --orange:#e2541b; --orange2:#f07a2e }
* { margin:0; padding:0; box-sizing:border-box }
html, body { width:1080px; height:1920px; overflow:hidden; background:#050506 }
#root { position:relative; width:100%; height:100%; overflow:hidden; background:#050506; direction:rtl; font-family:'Alexandria' }
#scene, #cam, .plate, #fx, #ui { position:absolute; inset:0 }
#cam { transform-origin:540px 1000px }
.plate { width:1080px; height:1920px; object-fit:cover }
#roomRed { opacity:0 }
#filament { opacity:.9 }
#halo { position:absolute; left:190px; top:690px; width:700px; height:700px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,226,170,.42) 0%, rgba(255,200,130,.14) 34%, rgba(255,200,130,0) 66%) }
#dust { position:absolute; inset:0; opacity:0 }
.mote { position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(255,190,195,.95), rgba(255,90,100,0) 70%) }

/* the neon words, hanging in the room (they move with the camera) */
#neon { position:absolute; left:80px; right:80px; top:745px; display:flex; flex-direction:column; align-items:center }
.row1 { display:flex; align-items:center; gap:34px; direction:rtl }
#w1 { font:900 170px/1.35 'Alexandria'; color:#fff7f7; white-space:nowrap; opacity:0;
  text-shadow:0 0 5px #fff, 0 0 16px rgba(255,255,255,.7), 0 0 38px rgba(255,150,160,.45), 0 0 80px rgba(255,90,100,.25) }
#w2 { font:900 184px/1.35 'Alexandria'; color:#ff6b72; white-space:nowrap; opacity:0;
  text-shadow:0 0 3px #ffc2c5, 0 0 12px #ff3a44, 0 0 28px #e82228, 0 0 62px rgba(232,34,40,.85), 0 0 120px rgba(232,34,40,.55) }
#bars { width:118px; height:132px; overflow:visible }
#bars path { opacity:0 }

#vig { position:absolute; inset:0; background:radial-gradient(120% 85% at 50% 52%, rgba(0,0,0,0) 52%, rgba(0,0,0,.6) 100%) }
#grain { position:absolute; inset:0; pointer-events:none; opacity:.13; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.8'/></svg>") }

/* words on the glass */
#hook { position:absolute; left:80px; right:80px; top:270px; text-align:center }
#hook .l { font:900 96px/1.58 'Alexandria'; color:var(--cream); white-space:nowrap; text-shadow:0 6px 34px rgba(0,0,0,.55) }
#lead { position:absolute; left:80px; right:80px; top:300px; text-align:center; font:600 70px/1.4 'Alexandria'; color:#c4c4ca; opacity:0 }
#sub { position:absolute; left:130px; right:130px; top:1296px; text-align:center; font:400 34px/1.55 'Readex Pro'; color:#c9c9ce; opacity:0 }
#sub b { font-weight:600; color:#fff }
#foot { position:absolute; left:130px; right:130px; top:1380px; display:flex; justify-content:center; align-items:center; gap:40px; opacity:0 }
#foot img { height:84px; display:block }
#pill { display:flex; align-items:center; gap:12px; font:600 29px 'Readex Pro'; color:#fff; background:var(--red); padding:14px 30px 18px;
  border-radius:999px; box-shadow:0 14px 34px rgba(232,34,40,.4) }
#pill svg { width:26px; height:26px }
#share { position:absolute; left:70px; right:70px; top:250px; display:flex; flex-direction:column; align-items:center; gap:18px }
#shareBtn { display:flex; align-items:center; gap:18px; padding:20px 40px 26px; border-radius:999px; background:var(--cream); color:var(--ink);
  font:600 40px 'Readex Pro'; white-space:nowrap; box-shadow:0 22px 50px rgba(0,0,0,.55); opacity:0 }
#shareBtn svg { width:44px; height:44px; color:var(--orange); margin-top:6px }
#credit { font:500 27px 'Readex Pro'; color:#c2c2c8; opacity:0 }

    <script>
      const D = 7.5;

      // dust in the neon's red light: a fixed, seeded set of motes (no Math.random)
      function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = seeded(20261007);
      const MOTES = Array.from({ length: 30 }, () => ({ x: 120 + rnd() * 840, y: 560 + rnd() * 900, s: 3 + rnd() * 7, dx: (rnd() - 0.5) * 70, dy: -(30 + rnd() * 90), o: 0.35 + rnd() * 0.6 }));
      const dust = document.getElementById('dust');
      MOTES.forEach((m, i) => { const d = document.createElement('div'); d.className = 'mote'; d.id = 'm' + i;
        Object.assign(d.style, { left: m.x + 'px', top: m.y + 'px', width: m.s + 'px', height: m.s + 'px', opacity: m.o }); dust.appendChild(d); });

      function build() {
        const tl = gsap.timeline({ paused: true });
        // the room light: 1 = lit, 0 = grid down. Words on screen cut with the light rather than ghosting.
        const power = (t, v, hook = true) => {
          tl.set(['#roomLit', '#halo'], { opacity: v }, t);
          if (hook) tl.set('#hook', { opacity: v < 0.5 ? 0 : v }, t);
        };
        const flick = (sel, steps) => steps.forEach(([t, v]) => tl.set(sel, { opacity: v }, t));

        // camera: a slow push in through the whole cut, easing back as the light returns, so the last frame meets the first
        tl.fromTo('#cam', { scale: 1 }, { scale: 1.07, duration: 6.4, ease: 'power1.inOut' }, 0);
        tl.to('#cam', { scale: 1, duration: 1.1, ease: 'sine.inOut' }, 6.4);

        // ---- 0–0.72 s: the real room, lit. Then the grid flickers and drops.
        [[0.45, 0.3], [0.51, 1], [0.58, 0.15], [0.66, 0.8], [0.72, 0]].forEach(([t, v]) => power(t, v));
        tl.fromTo('#filament', { opacity: 0.9 }, { opacity: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, 0.72);   // afterglow

        // ---- 0.95 s: a whisper, then the neon
        tl.fromTo('#lead', { opacity: 0, y: 12, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.45, ease: 'power2.out' }, 0.95);
        flick('#w1', [[1.38, 1], [1.41, 0.1], [1.44, 1], [1.5, 0.5], [1.53, 1]]);
        flick('#w2', [[1.6, 1], [1.633, 0.15], [1.667, 1], [1.733, 0.3], [1.767, 1]]);
        flick('#roomRed', [[1.6, 0.55], [1.633, 0.08], [1.667, 0.65], [1.733, 0.2], [1.767, 0.8]]);
        tl.to('#roomRed', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.8);
        ['#b1', '#b2', '#b3', '#b4'].forEach((b, i) => flick(b, [[1.9 + i * 0.1, 1], [1.93 + i * 0.1, 0.4], [1.96 + i * 0.1, 1]]));
        tl.fromTo('#dust', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.8);
        MOTES.forEach((m, i) => tl.fromTo('#m' + i, { x: 0, y: 0 }, { x: m.dx, y: m.dy, duration: 4.8, ease: 'none' }, 1.6));

        // ---- 2.3 s: the brand
        tl.fromTo('#sub', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 2.3);
        tl.fromTo('#foot', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, 2.45);
        // the neon is alive: one stutter
        flick('#w2', [[3.5, 0.4], [3.53, 1], [3.58, 0.7], [3.6, 1]]);
        flick('#roomRed', [[3.5, 0.55], [3.53, 1], [3.58, 0.8], [3.6, 1]]);

        // ---- 4.2 s: the ask takes the top line
        tl.to('#lead', { opacity: 0, y: -14, duration: 0.2, ease: 'power2.in' }, 4.18);
        tl.fromTo('#shareBtn', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 4.28);
        tl.fromTo('#credit', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 4.42);
        tl.to('#shareBtn', { scale: 1.05, duration: 0.28, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 4.95);

        // ---- 6.4 s: the grid comes back; the room washes out the neon; the opening frame returns
        tl.to(['#neon', '#sub', '#foot', '#share', '#dust', '#roomRed'], { opacity: 0, duration: 0.22, ease: 'power2.in' }, 6.4);
        [[6.4, 0.5], [6.47, 0], [6.53, 0.85], [6.6, 0.2], [6.7, 1]].forEach(([t, v]) => power(t, v, false));
        tl.fromTo('#hook', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, 6.95);

        window.__timelines['main'] = tl;
      }
      document.fonts.ready.then(build);
    </script>
