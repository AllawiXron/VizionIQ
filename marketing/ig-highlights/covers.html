<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#000; display:flex; flex-wrap:wrap; gap:40px; padding:40px; width:6000px }
  .art { position:relative; width:1080px; height:1920px; overflow:hidden }
  .art { background:var(--card); --inkc:#f6e9d3 }
  /* card stock: the fibres of a real sheet, then slow tone changes from the same sheet blown up and blurred */
  .fibre { position:absolute; inset:0; background:url(assets/img/newsprint.jpg) var(--fx) var(--fy)/var(--fs); mix-blend-mode:multiply; opacity:.46 }
  .tone { position:absolute; inset:-120px; background:url(assets/img/newsprint.jpg) var(--tx) var(--ty)/2600px; filter:blur(36px) contrast(1.6);
    mix-blend-mode:soft-light; opacity:.55 }
  /* daylight falling across the sheet from the upper left, the far corner a little in shade */
  .light { position:absolute; inset:0; background:linear-gradient(158deg, rgba(255,236,214,.16) 0%, rgba(255,236,214,0) 38%, rgba(60,18,0,0) 62%, rgba(60,18,0,.2) 100%);
    mix-blend-mode:soft-light }
  /* the icon pressed into the card: a dark lip on the upper edge of the groove, light catching the lower one */
  .press { position:absolute; inset:0; filter:drop-shadow(0 -2px 0 rgba(70,22,0,.32)) drop-shadow(0 2.5px 1px rgba(255,214,180,.38)) }
  /* the icon printed in ink that takes the paper's texture */
  .ink { position:absolute; left:50%; top:50%; width:var(--w); height:var(--w); margin:calc(var(--w) / -2) 0 0 calc(var(--w) / -2);
    background:var(--inkc); -webkit-mask:var(--icon) center/contain no-repeat; mask:var(--icon) center/contain no-repeat }
  .ink::after { content:''; position:absolute; inset:0; background:url(assets/img/newsprint.jpg) var(--fx) var(--fy)/600px; mix-blend-mode:multiply; opacity:.42 }
  .grain { position:absolute; inset:0; background:url(assets/img/grain.png) 0 0/512px; mix-blend-mode:overlay; opacity:.1 }

  .row { width:1960px; height:440px; background:#000 }
  .hl { position:absolute; top:70px; width:300px; text-align:center }
  .hl .c { width:250px; height:250px; margin:0 auto; border-radius:50%; border:6px solid #3a3a3a; padding:8px; background:#000 }
  .hl .c div { width:100%; height:100%; border-radius:50%; background-size:100% auto; background-position:center }
  .hl span { display:block; margin-top:26px; font:500 40px sans-serif; color:#f2f2f2 }
</style>
</head>
<body>
<div id="arts"></div>
<script>
// every cover is its own sheet: a slightly different card colour and a different part of the paper
const C = [
  { id:'c-prices',   icon:'price-tag', label:'الأسعار', card:'#e2511a', dark:'#1f1510', w:'520px', fs:'900px',  fx:'-120px', fy:'40px',   tx:'-300px',  ty:'-900px' },
  { id:'c-work',     icon:'images',    label:'أعمالي',  card:'#e85c1f', dark:'#221712', w:'520px', fs:'1100px', fx:'60px',   fy:'-200px', tx:'-1200px', ty:'-400px' },
  { id:'c-brands',   icon:'stamp',     label:'براندات', card:'#db4c17', dark:'#1d140f', w:'520px', fs:'1000px', fx:'-400px', fy:'300px',  tx:'-700px',  ty:'-1400px' },
  { id:'c-identity', icon:'pen-tool',  label:'هويات',   card:'#e4571d', dark:'#201611', w:'520px', fs:'1200px', fx:'200px',  fy:'100px',  tx:'-1600px', ty:'-200px' },
  { id:'c-motion',   icon:'video',     label:'موشن',    card:'#ea6122', dark:'#231813', w:'540px', fs:'950px',  fx:'-250px', fy:'-500px', tx:'-500px',  ty:'-1100px' },
];
const vars = (c) => Object.entries(c).filter(([k]) => !['id', 'icon', 'label'].includes(k)).map(([k, v]) => `--${k}:${v}`).join(';');
const sheet = (c) => `<div class="art" id="${c.id}" style="${vars(c)};--icon:url(assets/icons/${c.icon}.svg)">
  <div class="fibre"></div><div class="tone"></div><div class="light"></div><div class="press"><div class="ink"></div></div><div class="grain"></div></div>`;
// the profile row, from the rendered covers (render twice: this reads out/)
const row = () => `<div class="art row" id="preview">${C.map((c, k) =>
  `<div class="hl" style="right:${80 + k * 370}px"><div class="c"><div style="background-image:url(out/covers-${c.id}.jpg)"></div></div><span>${c.label}</span></div>`).join('')}</div>`;
document.getElementById('arts').outerHTML = C.map(sheet).join('') + row();
const imgs = [...document.images].map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }));
Promise.all([document.fonts.ready, ...imgs]).then(() => setTimeout(() => { document.body.dataset.ready = '1'; }, 400));
</script>
</body>
</html>
