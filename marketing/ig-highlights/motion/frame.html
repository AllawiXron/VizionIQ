<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Sahabah; src: url(../../brand-fonts/DG-Sahabah-Reg.ttf); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #17110d; position: relative;
    font-family: Sahabah, sans-serif; font-weight: 400; font-synthesis: none; color: #efe4d1; }
  /* newsprint fibres and an uneven lamp from the upper left, both broken by the paper */
  .paper { position: absolute; inset: 0; background: url(../assets/img/newsprint.jpg) 0 0/1024px; mix-blend-mode: overlay; opacity: .42; }
  .lamp { position: absolute; left: -260px; top: -180px; width: 1150px; height: 1300px;
    background: radial-gradient(closest-side, rgba(226,84,27,.22), rgba(226,84,27,0)); filter: blur(30px); transform: rotate(-18deg); }
  .lamp2 { position: absolute; right: -300px; bottom: -200px; width: 900px; height: 900px;
    background: radial-gradient(closest-side, rgba(239,228,209,.06), rgba(239,228,209,0)); }
  .grain { position: absolute; inset: 0; background: url(../assets/img/grain.png) 0 0/512px; mix-blend-mode: overlay; opacity: .12; }

  /* the slot the video plays in: a soft cast shadow, then a cream outline 12px out */
  .shadow { position: absolute; left: 270px; top: 262px; width: 540px; height: 960px; border-radius: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.45); }
  .outline { position: absolute; left: 256px; top: 238px; width: 568px; height: 988px; border-radius: 32px;
    border: 4px solid #efe4d1; opacity: .9; }

  .say { position: absolute; left: 270px; top: 1336px; width: 540px; direction: rtl; text-align: right; }
  .say h1 { font-size: 56px; line-height: 1.22; font-weight: 400; }
  .say p { margin-top: 6px; font-size: 36px; line-height: 1.3; color: #c9b9a0; }
  .ask { margin-top: 30px; font-size: 46px; line-height: 1.25; color: #f07a2e; }
  .ask span { display: block; color: #efe4d1; }
  .arrow { position: absolute; left: 448px; top: 1622px; width: 100px; height: 128px; }
  .arrow path { fill: none; stroke: #f07a2e; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="lamp"></div><div class="lamp2"></div><div class="paper"></div>
  <div class="shadow"></div><div class="outline"></div>
  <div class="say">
    <h1>موشن لموقع سرعة<br>الإنترنت بالعراق</h1>
    <p>شرحت الموقع كله بنص دقيقة</p>
    <div class="ask">تريد فيديو مثله لمشروعك؟<span>دزلي من هنا</span></div>
  </div>
  <svg class="arrow" viewBox="0 0 120 150"><path d="M104 30 C 70 24, 36 44, 40 84 C 42 104, 48 120, 54 136"/><path d="M30 114 L 54 138 L 74 110"/></svg>
  <div class="grain"></div>
</body>
</html>
