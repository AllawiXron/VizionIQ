<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>body{margin:0;background:#ddd;font-family:'IBM Plex Sans Arabic'}
.board{width:1920px;height:1080px;position:relative;background:#fbf8f2;display:flex;margin-bottom:30px}
.l{width:820px;display:flex;align-items:center;justify-content:center;background:#0c1b40}
.r{flex:1;padding:110px 96px;display:flex;flex-direction:column;justify-content:center;color:#0c1b40}
.k{font:500 22px 'Readex Pro';opacity:.55}.t{font:600 60px/1.25 'Readex Pro';margin:14px 0 26px}
.p{font-size:27px;line-height:1.8;opacity:.85;max-width:900px}
.lock{display:flex;align-items:center;gap:36px;margin-top:60px;white-space:nowrap}
.lock .rule{width:2px;align-self:stretch;background:#0c1b40;opacity:.2}
.lock .a{font:400 22px 'Readex Pro';opacity:.75}.lock .b{font:600 44px/1.3 'Readex Pro'}.lock .e{font:400 13px 'Readex Pro';direction:ltr;text-align:right;letter-spacing:.4px;opacity:.7}
</style></head><body>
<script src="concepts.js"></script>
<script>
const NAME = `<div><div class="a">جمهورية العراق</div><div class="b">وزارة الاقتصاد الرقمي والحوكمة</div><div class="e">MINISTRY OF DIGITAL ECONOMY AND GOVERNANCE</div></div>`;
const svg = (fn, c, size) => `<svg viewBox="0 0 300 300" width="${size}" height="${size}">${CONCEPTS[fn](c)}</svg>`;
const D = { ink: '#fbf8f2', accent: '#c99a2e', bg: '#0c1b40' }, L = { ink: '#17357d', accent: '#c99a2e', bg: '#fbf8f2' };
const B = [
  ['gate3', 'الجديد', 'بوابة عشتار.. بوابة العراق الرقمية', 'بوابة عشتار أشهر مدخل في تاريخ العراق، والبوابة اليوم هي المدخل الرقمي للدولة: كل خدمة حكومية تمرّ منها. الأقواس الذهبية المتداخلة حول المدخل هي أقواس البوابة الحقيقية، وهي أيضاً موجات الاتصال: دولة مفتوحة ومتصلة. والشرفات المدرّجة فوق الأبراج تبدو كالبكسلات: أصالة بابلية بروح رقمية.'],
];
for (const [fn, k, t, p] of B) document.write(`<div class="board"><div class="l">${svg(fn, D, 520)}</div><div class="r"><div class="k">الاتجاه ${k}</div><div class="t">${t}</div><div class="p">${p}</div><div class="lock">${svg(fn, L, 150)}<div class="rule"></div>${NAME}</div></div></div>`);
</script></body></html>
